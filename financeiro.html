<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0C0B">
<title>PD Wallet</title>
<link rel="icon" href="assets/icon-pwa.svg" type="image/svg+xml">
<style>
:root{--bg:#0B0C0B;--card:rgba(255,255,255,.045);--tx:rgba(255,255,255,.92);--mut:rgba(255,255,255,.55);--lin:rgba(255,255,255,.16);--acc:#fff;--acc2:rgba(255,255,255,.7);--acc-tx:#0B0C0B;--verde:var(--tx);--verm:#DB2777;--ouro:#D97706;--r:20px;--sombra:none;--veu:rgba(11,12,11,.5)}
:root[data-theme=light]{--bg:#F6F5F1;--card:rgba(255,255,255,.7);--tx:#1A1B1E;--mut:rgba(26,27,30,.58);--lin:rgba(26,27,30,.16);--acc:#1A1B1E;--acc2:rgba(26,27,30,.7);--acc-tx:#fff;--veu:rgba(246,245,241,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html.emb,html.emb body{background:transparent!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
b{font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;transition:background-color .25s,color .25s,border-color .25s,transform .15s,opacity .25s}
button:active:not(:disabled){transform:scale(.97)}
input,select,textarea{font:inherit;color:inherit}
.hid{display:none!important}
#porta{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.pcx{background:var(--card);border:1px solid var(--lin);border-radius:var(--r);padding:28px;max-width:380px;width:100%;text-align:center}
.pcx h2{margin:0 0 6px;font-size:21px;font-weight:600}
.pcx p{margin:0 0 16px;color:var(--mut);font-size:13.5px;line-height:1.5}
.pcx input{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--lin);background:transparent;margin-bottom:10px;outline:none}
.pcx input:focus{border-color:var(--acc)}
.erro{color:var(--verm);font-size:13px;min-height:18px;margin-bottom:6px}
.bt{border:0;border-radius:999px;padding:12px 20px;font-weight:600;background:var(--acc);color:var(--acc-tx)}
.bt.sec{background:transparent;color:var(--tx);border:1px solid var(--lin)}
.bt.mini{padding:7px 13px;font-size:12.5px}
.bt:disabled{opacity:.5}
/* cabeçalho: o mesmo das outras ferramentas da PD (barra de 56px, ícones em caixinha, separador fino, carinha da IA à direita) */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;min-height:56px;padding:0 12px;border-bottom:1px solid var(--lin);background:var(--veu,var(--bg));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--tx)}
.top .fl1{flex:1}
.top .sep{width:1px;height:22px;background:var(--lin);margin:0 4px}
.btn.i{position:relative;width:38px;height:38px;border:1px solid var(--lin);border-radius:8px;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;color:var(--tx)}
.btn.i svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn.i:hover{background:rgba(127,127,127,.12)}
#btKiro img{width:28px;height:28px;border-radius:50%;object-fit:cover;display:block}
.kpulso{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:#1f8a55;box-shadow:0 0 0 0 rgba(31,138,85,.6);animation:kp 2.4s ease-out infinite}
@keyframes kp{0%{box-shadow:0 0 0 0 rgba(31,138,85,.65)}100%{box-shadow:0 0 0 9px rgba(31,138,85,0)}}
html.emb .top{padding-top:calc(var(--safe,0px) + 60px)}
@media(max-width:999px){.top{position:relative;flex-wrap:wrap;row-gap:0;padding:6px 10px}html.emb .top{padding:calc(var(--safe,0px) + 60px) 68px 6px 10px}#btFechar{display:none!important}.top .dk{display:none}.top .fl1{flex:1 1 0}.mesbar{order:9;flex:1 0 calc(100% + 58px);margin-right:-58px;justify-content:center}}
@media(max-width:600px){.seg button{padding:6px 11px}.ic{width:32px;height:32px}.mesbar b{min-width:118px!important;font-size:16px!important}}
.seg{display:flex;border:1px solid var(--lin);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mut);padding:6px 16px;border-radius:999px;font-weight:500;font-size:13px}
.seg button.on{background:var(--acc);color:var(--acc-tx)}
.ic{border:1px solid var(--lin);background:transparent;color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:15px;line-height:1}
.mesbar{display:flex;align-items:center;gap:6px}
.mesbar b{font-size:18px;font-weight:400;min-width:170px;text-align:center}
.av{position:relative;overflow:hidden}
.av span{position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.av.p{width:34px;height:34px;font-size:12px}
.rk{display:flex;align-items:center;gap:11px;padding:8px 12px;cursor:pointer;border-radius:14px}
.rk:hover{background:rgba(127,127,127,.1)}
.rk .m{flex:1;min-width:0}
.rk .ln{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:5px}
.rk .ln span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .bar{height:4px}
.kiro{padding:0}
.kh{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--lin)}
.kh img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--lin)}
.kh div{flex:1;min-width:0}.kh b{display:block;font-size:16px;font-weight:600}.kh small{color:var(--mut)}
.kmsgs{padding:14px 16px;min-height:220px;max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.kvz{color:var(--mut);text-align:center;margin:auto;max-width:360px;line-height:1.55}
.kb{max-width:86%;padding:10px 14px;border-radius:18px;line-height:1.55;word-break:break-word}
.kb.u{align-self:flex-end;border:1px solid var(--lin);background:var(--card)}
.kb.k{align-self:flex-start;padding-left:2px}
.dots i{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--mut);animation:pis 1.1s infinite}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes pis{0%,80%,100%{opacity:.25}40%{opacity:1}}
.kchips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}
.kchips button{border:1px solid var(--lin);background:transparent;border-radius:999px;padding:8px 14px;font-size:13px;color:var(--mut)}
.kchips button:hover{color:var(--tx);border-color:var(--tx)}
.kin{display:flex;align-items:flex-end;gap:10px;padding:10px 12px 12px;border-top:1px solid var(--lin)}
.kin textarea{flex:1;resize:none;border:1px solid var(--lin);background:transparent;border-radius:20px;padding:11px 16px;outline:none;max-height:140px;line-height:1.4}
.kin textarea:focus{border-color:var(--acc)}
.kenv{background:var(--acc)!important;color:var(--acc-tx)!important;border-color:var(--acc)!important;width:40px!important;height:40px!important;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.corpo{max-width:1080px;margin:0 auto;padding:16px 16px 90px}
/* hero */
.hero,.cx,.pcx{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.hero{background:var(--card);border:1px solid var(--lin);border-radius:var(--r);padding:22px;margin-bottom:14px}
.hero .rot{color:var(--mut);font-size:13px}
.hero .gr{font-size:40px;font-weight:600;letter-spacing:-.02em;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.pos{color:var(--verde)}.neg{color:var(--verm)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:430px){.trio{gap:6px}.trio div{padding:9px 9px}.trio b{font-size:13.5px}}
.trio div{background:rgba(127,127,127,.09);border-radius:14px;padding:10px 12px}
.trio small{display:block;color:var(--mut);font-size:11.5px}
.trio b{font-size:15.5px;font-variant-numeric:tabular-nums}
.comp{margin-top:14px;padding-top:12px;border-top:1px solid var(--lin)}
.comp .lc{display:flex;justify-content:space-between;padding:7px 0 0;font-size:14px}
.comp .lc span{color:var(--mut)}
.comp .lc.ed{cursor:pointer;border-radius:10px;margin:0 -8px;padding:8px 8px}.comp .lc.ed:hover{background:rgba(127,127,127,.1)}.comp .lc.ed b{display:inline-flex;align-items:center;gap:7px}
.prog{margin-top:14px;display:grid;gap:9px}
.prog .ln{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.prog .ln b{color:var(--tx);font-weight:600}
.bar{height:6px;border-radius:6px;background:rgba(127,127,127,.2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--acc);transition:width .4s}
.bar.v i{background:var(--verde)}
.bar i{background:var(--acc)}
/* abas */
.abas{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{border:1px solid var(--lin);background:transparent;border-radius:999px;padding:8px 15px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--mut)}
.abas button.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
/* listas */
.duas{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.duas>*{min-width:0}
@media(min-width:900px){.duas{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.cx{background:var(--card);border:1px solid var(--lin);border-radius:var(--r);padding:16px 8px 8px;margin-bottom:14px}
.cx>.cab{display:flex;align-items:center;gap:8px;padding:0 10px 8px}
.cx>.cab h3{margin:0;font-size:16px;font-weight:600;flex:1}
.cx>.cab .tt{font-variant-numeric:tabular-nums;font-weight:600}
.gp{padding:10px 10px 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.lin{display:flex;align-items:center;gap:11px;padding:10px;border-radius:14px;cursor:pointer}
.lin:hover{background:rgba(127,127,127,.1)}
.dia{width:34px;height:34px;border-radius:50%;background:rgba(127,127,127,.14);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--mut);flex-shrink:0}
.lin .m{flex:1;min-width:0}
.lin .m b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lin .m small{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chip{display:inline-block;background:rgba(127,127,127,.16);border-radius:8px;padding:1px 7px;font-size:11px;margin-right:5px;color:var(--tx)}
.val{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.val.e{color:var(--verde)}
.ck{width:26px;height:26px;border-radius:50%;border:1px solid var(--lin);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;color:var(--acc-tx)}
.ck.on{background:var(--acc);border-color:var(--acc)}
.lin.memo{opacity:.55}
.vazio{padding:18px;text-align:center;color:var(--mut);font-size:13.5px}
.add{display:block;width:calc(100% - 20px);margin:6px 10px 8px;border:1.5px dashed var(--lin);background:transparent;border-radius:14px;padding:10px;color:var(--acc);font-weight:600}
/* pessoas */
.busca{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--lin);background:transparent;margin-bottom:12px;outline:none}
.pes{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer}
.pes:hover{background:rgba(127,127,127,.1)}
.av{width:40px;height:40px;border-radius:50%;background:transparent;border:1px solid var(--lin);color:var(--tx);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.pes .m{flex:1;min-width:0}.pes .m b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pes .m small{color:var(--mut);font-size:12px}
/* ano */
.anog{display:flex;align-items:flex-end;gap:6px;height:170px;padding:8px 6px 0;overflow-x:auto}
.anog .c{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
.anog .bb{display:flex;align-items:flex-end;gap:3px;height:130px;width:100%;justify-content:center}
.anog .bb i{display:block;width:42%;border-radius:5px 5px 0 0;min-height:2px}
.anog .bb i.e{background:var(--acc)}.anog .bb i.s{background:rgba(127,127,127,.45)}
.anog small{font-size:11px;color:var(--mut);margin-top:5px}
.anog .c.on small{color:var(--acc);font-weight:700}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb td,table.tb th{padding:9px 10px;border-bottom:1px solid var(--lin);text-align:right;font-variant-numeric:tabular-nums}
table.tb td:first-child,table.tb th:first-child{text-align:left}
table.tb th{color:var(--mut);font-weight:500;font-size:12px}
.nota{font-size:12.5px;color:var(--mut);line-height:1.5;padding:4px 10px 10px}
.nl{font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;padding:5px 12px;border-bottom:1px solid var(--lin);word-break:break-word}
/* folha */
#veu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#folha{background:var(--bg);border:1px solid var(--lin);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:sobe .25s ease}
@media(min-width:700px){#veu{align-items:center}#folha{border-radius:24px}}
@keyframes sobe{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#folha h3{margin:0 0 14px;font-size:18px;font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{display:block;margin-bottom:10px}
.fl span{display:block;font-size:12px;color:var(--mut);margin:0 0 4px 4px}
.fl input,.fl select,.fl textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--lin);background:transparent;outline:none}
.fl input:focus,.fl select:focus{border-color:var(--acc)}
.fl select option{background:var(--card);color:var(--tx)}
.chk{display:flex;align-items:center;gap:9px;margin:4px 2px 10px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.bts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}.bts .bt{flex:1 1 0;min-width:0;height:46px;padding:0 14px;font-size:14px;line-height:1;white-space:nowrap;display:flex;align-items:center;justify-content:center;text-align:center}
.bts .bt:last-child:not(.sec):not(.perigo){order:-1;flex:1 1 100%;height:50px;font-size:15px}
.bt.perigo{background:transparent;color:var(--tx);border:1px solid var(--lin);opacity:.7}
.bt.perigo:active{opacity:1}
.chk input{-webkit-appearance:none;appearance:none;border:1px solid var(--lin);border-radius:7px;background:transparent;display:grid;place-content:center;flex-shrink:0;margin:0}
.chk input:checked{background:var(--acc);border-color:var(--acc)}
.chk input:checked::after{content:"";width:5px;height:10px;border:solid var(--acc-tx);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
@media(max-width:999px){html.emb #folha{max-height:calc(100dvh - var(--safe,0px) - 150px)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--acc);color:var(--acc-tx);padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.acl{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--lin);flex-wrap:wrap}
.acl .n{flex:1;min-width:150px}.acl label{display:flex;align-items:center;gap:5px;font-size:13px}
.acl input{accent-color:var(--acc);width:17px;height:17px}
.lin,.pes,.rk,.abas button,.seg button{transition:background-color .25s,color .25s,border-color .25s}
@keyframes surge{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes cresceX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cresceY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
#hero.anim .hero{animation:surge .65s cubic-bezier(.2,.7,.2,1) both}
#cont.anim>*:not(.duas){animation:surge .65s cubic-bezier(.2,.7,.2,1) both}
#cont.anim>*:nth-child(2){animation-delay:.07s}#cont.anim>*:nth-child(3){animation-delay:.14s}#cont.anim>*:nth-child(4){animation-delay:.21s}#cont.anim>*:nth-child(5){animation-delay:.28s}#cont.anim>*:nth-child(n+6){animation-delay:.34s}
#cont.anim .duas>*{animation:surge .65s cubic-bezier(.2,.7,.2,1) both}
#cont.anim .duas>*:nth-child(2){animation-delay:.1s}
#cont.anim .duas:nth-child(n+3)>*{animation-delay:.22s}
#hero.anim .bar i,#cont.anim .bar i{transform-origin:left center;animation:cresceX 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
#cont.anim .anog .bb i{transform-origin:bottom;animation:cresceY .95s cubic-bezier(.2,.7,.2,1) both}
#cont.anim .anog .c:nth-child(1) .bb i{animation-delay:0.24s}#cont.anim .anog .c:nth-child(2) .bb i{animation-delay:0.29s}#cont.anim .anog .c:nth-child(3) .bb i{animation-delay:0.34s}#cont.anim .anog .c:nth-child(4) .bb i{animation-delay:0.38s}#cont.anim .anog .c:nth-child(5) .bb i{animation-delay:0.42s}#cont.anim .anog .c:nth-child(6) .bb i{animation-delay:0.47s}#cont.anim .anog .c:nth-child(7) .bb i{animation-delay:0.52s}#cont.anim .anog .c:nth-child(8) .bb i{animation-delay:0.56s}#cont.anim .anog .c:nth-child(9) .bb i{animation-delay:0.60s}#cont.anim .anog .c:nth-child(10) .bb i{animation-delay:0.65s}#cont.anim .anog .c:nth-child(11) .bb i{animation-delay:0.70s}#cont.anim .anog .c:nth-child(12) .bb i{animation-delay:0.74s}#cont.anim .anog .c:nth-child(13) .bb i{animation-delay:0.78s}#cont.anim .anog .c:nth-child(14) .bb i{animation-delay:0.83s}
#cont.anim .pes,#cont.anim .rk,#cont.anim .lin{animation:surge .5s cubic-bezier(.2,.7,.2,1) both}
.troca{animation:surge .45s cubic-bezier(.2,.7,.2,1) both}
.ck.on svg{animation:pop .35s cubic-bezier(.2,.8,.3,1.2) both}
.kb.novo{animation:surge .4s cubic-bezier(.2,.7,.2,1) both}
#veu{animation:fadeIn .25s ease}
#veu.saindo{opacity:0;transition:opacity .22s ease}
#veu.saindo #folha{transform:translateY(24px);transition:transform .22s ease}

.hero{position:relative}.hdest{position:absolute;top:12px;right:12px;width:30px;height:30px;opacity:.7}.hdest:hover{opacity:1}
.hero .rot{padding-right:36px}
.corpo{touch-action:pan-y}
#hero,#cont,#mesTxt{will-change:transform}
#mesTxt{cursor:pointer;display:inline-block;border-bottom:1px dashed var(--lin);padding-bottom:1px}
.mesbar .ic{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dsec{margin:14px 2px 7px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.dsec span{text-transform:none;letter-spacing:0;opacity:.8}
.dchips{display:flex;flex-wrap:wrap;gap:7px}
.dchip{border:1px solid var(--lin);background:transparent;color:var(--tx);border-radius:999px;padding:8px 13px;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:background .2s,color .2s,border-color .2s,transform .15s}
.dchip:active{transform:scale(.96)}
.dchip.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.dchip i{font-style:normal;font-size:11px;font-weight:700;width:17px;height:17px;border-radius:50%;background:var(--acc-tx);color:var(--acc);display:inline-flex;align-items:center;justify-content:center}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calh b{font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmes{position:relative;height:60px;border-radius:16px;border:1px solid var(--lin);background:transparent;color:var(--tx);font-size:15px;transition:background .2s,transform .15s}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js?v=fin1"></script>
<script>
(function(){
'use strict';
try{
  const R = document.documentElement, emb = self !== top; if (emb) R.classList.add('emb');
  try { const sf = new URLSearchParams(location.search).get('safe'); if (sf) R.style.setProperty('--safe', Number(sf) + 'px'); } catch(e){}
  let dia = false;
  try { dia = emb ? parent.document.documentElement.classList.contains('dia') : localStorage.getItem('sd_tema') === 'dia'; } catch(e){ dia = localStorage.getItem('sd_tema') === 'dia'; }
  if (matchMedia('(max-width:700px)').matches) dia = false;   // no celular a PD é sempre escura
  R.setAttribute('data-theme', dia ? 'light' : 'dark');
}catch(e){}
const $ = s => document.querySelector(s);
const esc = x => String(x == null ? '' : x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const BRL = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const BRL0 = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(Number(v)||0);
const MN = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const GRUPOS = { fixo:'Fixo', variavel:'Variável', com_nf:'Com NF', sem_nf:'Sem NF', saldo:'Saldo', outro:'Outros', retirada:'Retirada · vai para a Casa' };
const GR_ORDEM = ['saldo','com_nf','sem_nf','fixo','variavel','outro','retirada'];
const sb = window.sb;
let ACC = null, AMB = 'empresa', MES = null, ABA = 'mes', D = { casa: null, empresa: null }, FOLHA = null, BUSCA = '';
let ANIM = true;
let NOTAS = {}, CIA = null, USO = null, PERFIS = null, ACES = null, SEL = null;

// ---------- utilidades ----------
// ---------- movimento: números que sobem ----------
const RE_BRL = /^\s*[-−]?\s*R\$[\s\u00a0]*[-−]?[\d.]+(,\d+)?\s*$/;
function contaAte(el){
  const t = el.textContent; if (!RE_BRL.test(t)) return;
  const neg = /^\s*[-−]/.test(t) || /R\$[\s\u00a0]*[-−]/.test(t), dec = /,\d+/.test(t) ? 2 : 0, n = parseFloat(t.replace(/[^\d,]/g, '').replace(',', '.')), alvo = (neg ? -1 : 1) * n;
  const f = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: dec, maximumFractionDigits: dec }), t0 = performance.now(), dur = 900;
  const passo = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4); if (k < 1) { el.textContent = f.format(alvo * e); requestAnimationFrame(passo); } else el.textContent = t; };
  requestAnimationFrame(passo);
}
function contaTudo(){ if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; document.querySelectorAll('#hero .gr, #hero .trio b, #hero .comp .lc b, #cont .trio b').forEach(contaAte); }

const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-01';
const mesDe = s => { const [y,m] = s.split('-').map(Number); return new Date(y, m-1, 1); };
const somaMes = (s, n) => { const d = mesDe(s); d.setMonth(d.getMonth() + n); return iso(d); };
const rotMes = s => { const d = mesDe(s); return MN[d.getMonth()] + ' ' + d.getFullYear(); };
const rotCurto = s => { const d = mesDe(s); return MN[d.getMonth()].slice(0,3).toLowerCase() + '/' + String(d.getFullYear()).slice(2); };
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => e.classList.remove('on'), 2400); }
function porta(html){ $('#app').classList.add('hid'); const p = $('#porta'); p.classList.remove('hid'); p.innerHTML = '<div class="pcx">' + html + '</div>'; }
function parseValor(t){ let s = String(t == null ? '' : t).replace(/[R$\s]/g,''); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); return Number(s); }
function parcelaDe(t){ const m = /^\s*(\d+)\s*de\s*(\d+)/i.exec(t || ''); return m ? [Number(m[1]), Number(m[2])] : [null, null]; }
const normNome = d => String(d || '').replace(/\b\d+\s*de\s*\d+\b/gi,'').replace(/[-–·]+\s*$/,'').replace(/\s+/g,' ').trim().toUpperCase() || '—';
const soma = (arr, f) => arr.reduce((a, l) => a + (f ? (f(l) ? Number(l.valor) : 0) : Number(l.valor)), 0);
const ICK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
const ICL = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:.6"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';
const dados = () => D[AMB] || [];
const doMes = (m, a) => (D[a || AMB] || []).filter(l => l.mes === m);
const podeEditar = () => ACC && (ACC.admin || (ACC.areas || []).some(a => a.area === AMB && a.editar));
const areasPermitidas = () => ACC.admin ? ['empresa','casa'] : ['empresa','casa'].filter(a => (ACC.areas || []).some(x => x.area === a));

// ---------- entrada ----------
async function boot(){
  if (!sb) return porta('<h2>PD Wallet</h2><p>Não consegui carregar.</p>');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return porta('<h2>Entre na PD</h2><p>A PD Wallet abre com a sua conta da plataforma.</p><button class="bt" onclick="location.href=\'/\'">Ir para a PD</button>');
  const r = await sb.rpc('fin_meu_acesso');
  if (r.error) return porta('<h2>Falta preparar o banco</h2><p>Rode o <b>migration_v171_financeiro.sql</b> no SQL Editor do Supabase e depois o arquivo de importação.</p>');
  ACC = r.data;
  if (ACC.admin) return entrar();
  if (!(ACC.areas || []).length) return porta('<h2>Sem acesso</h2><p>A PD Wallet é restrita. Peça ao administrador para liberar.</p>');
  if (ACC.liberado_ate && new Date(ACC.liberado_ate) > new Date()) return entrar();
  pedirSenha();
}
function pedirSenha(msg){
  porta('<h2>Confirme sua senha</h2><p>Esta área é protegida. A confirmação vale por 30 minutos.</p><input id="pw" type="password" placeholder="sua senha" autocomplete="current-password"><div class="erro" id="pwErr">' + esc(msg || '') + '</div><button class="bt" id="pwOk" style="width:100%">Entrar</button>');
  const go = async () => {
    const s = $('#pw').value; if (!s) return; $('#pwOk').disabled = true;
    const r = await sb.rpc('fin_destrancar', { senha: s });
    if (r.error || !r.data || !r.data.ok) { $('#pwOk').disabled = false; $('#pwErr').textContent = (r.data && r.data.msg) || (r.error && r.error.message) || 'Não deu.'; $('#pw').value = ''; return; }
    ACC.liberado_ate = r.data.ate; entrar();
  };
  $('#pwOk').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); }; setTimeout(() => $('#pw') && $('#pw').focus(), 60);
}
async function carregaAmb(a){
  let tudo = [], de = 0;
  for (;;) {
    const r = await sb.from('fin_lancamentos').select('*').eq('ambiente', a).order('mes').order('sentido').order('dia', { nullsFirst: false }).order('criado_em').range(de, de + 999);
    if (r.error) throw r.error; tudo = tudo.concat(r.data); if (r.data.length < 1000) break; de += 1000;
  }
  D[a] = tudo.map(l => Object.assign(l, { valor: Number(l.valor) }));
}
async function entrar(){
  try {
    const ps = areasPermitidas(); AMB = ps.includes(localStorage.getItem('fin_amb')) ? localStorage.getItem('fin_amb') : ps[0];
    await Promise.all(ps.map(carregaAmb).concat(carregaGrupos()));
  } catch(e){ return porta('<h2>Não consegui abrir</h2><p>' + esc(e.message || e) + '</p><button class="bt" onclick="location.reload()">Tentar de novo</button>'); }
  const hoje = iso(new Date()), meses = [...new Set(dados().map(l => l.mes))].sort();
  MES = meses.includes(hoje) ? hoje : (meses[meses.length - 1] || hoje);
  try { const q = new URLSearchParams(location.search), a = q.get('amb'), m = q.get('mes'), ab = q.get('aba'); if (a && areasPermitidas().includes(a)) { AMB = a; } if (m && /^\d{4}-\d{2}-01$/.test(m)) MES = m; if (ab) ABA = ab; else if (ehMob()) ABA = 'inicio'; } catch(e){}
  $('#porta').classList.add('hid'); $('#app').classList.remove('hid');
  if (window.self !== window.top) $('#btFechar').classList.remove('hid');
  desenha(); carregaAv(); garanteRetiradas().catch(() => {});
}


// ---------- destaques (o que aparece no topo) ----------
const ICDEST = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>';
const catSoma = (c, m) => soma(doMes(m).filter(l => l.conta && l.sentido === 'saida' && l.grupo !== 'retirada' && l.grupo !== 'saldo' && catDe(l) === c));
const METR = {
  total:   { rot: 'Total do mês', curto: 'Total', f: t => t.sobra },
  caixa:   { rot: 'No caixa agora', curto: 'No caixa', f: t => t.caixa },
  ent:     { rot: 'Entradas', curto: 'Entradas', f: t => t.e },
  sai:     { rot: 'Saídas', curto: 'Saídas', f: t => t.s },
  res:     { rot: 'Entradas − saídas', curto: 'Resultado', f: t => t.e - t.s },
  sdant:   { rot: 'Saldo anterior', curto: 'Saldo anterior', f: t => t.sd },
  fent:    { rot: 'Falta entrar', curto: 'Falta entrar', f: t => t.e - t.ep },
  fpag:    { rot: 'Falta pagar', curto: 'Falta pagar', f: t => t.s - t.sp },
  ret:     { rot: 'Retirada', curto: 'Retirada', emp: true, f: t => t.retirada },
  segue:   { rot: 'Saldo que segue', curto: 'Saldo que segue', f: t => t.saldoFim },
  inv:     { rot: 'Investimentos', curto: 'Investimentos', f: (t, m) => catSoma('inv', m) },
  imp:     { rot: 'Impostos', curto: 'Impostos', f: (t, m) => catSoma('imp', m) }
};
const mv = (k, t) => { const v = METR[k].f(t, MES); return v == null || isNaN(v) ? null : v; };
const DEST0 = { gr: 'total', trio: ['ent', 'sai', 'sdant'], prog: true, div: true };
function dest(){
  let d = {}; try { d = JSON.parse(localStorage.getItem('fin_dest_' + AMB) || '{}'); } catch(_){}
  const o = Object.assign({}, DEST0, d);
  if (!METR[o.gr] || (METR[o.gr].emp && AMB !== 'empresa')) o.gr = 'total';
  o.trio = (o.trio || []).filter(k => METR[k] && !(METR[k].emp && AMB !== 'empresa')).slice(0, 3);
  while (o.trio.length < 3) { const k = DEST0.trio.find(x => !o.trio.includes(x)); o.trio.push(k); }

}
function folhaDest(draft){
  const d = FOLHA_D = draft || dest(), ks = Object.keys(METR).filter(k => !(METR[k].emp && AMB !== 'empresa'));
  const chips = (sel, tipo) => ks.map(k => { const n = tipo === 'trio' ? sel.indexOf(k) : -1; return '<button class="dchip ' + ((tipo === 'gr' ? sel === k : n >= 0) ? 'on' : '') + '" data-dk="' + k + '" data-dt="' + tipo + '">' + (n >= 0 ? '<i>' + (n + 1) + '</i>' : '') + METR[k].rot + '</button>'; }).join('');
  folha('<h3>O que destacar</h3><div class="nota" style="padding:0 0 8px">Vale só para a ' + (AMB === 'empresa' ? 'Empresa' : 'Casa') + ', neste aparelho.</div>' +
    '<div class="dsec">Número grande</div><div class="dchips">' + chips(d.gr, 'gr') + '</div>' +
    '<div class="dsec">Os três de baixo <span>(toque para trocar; a ordem é a da contagem)</span></div><div class="dchips">' + chips(d.trio, 'trio') + '</div>' +
    '<div class="dsec">Mostrar</div><label class="chk"><input type="checkbox" id="dProg"' + (d.prog ? ' checked' : '') + '> Barras de quanto já entrou e já foi pago</label><label class="chk"><input type="checkbox" id="dDiv"' + (d.div ? ' checked' : '') + '> Divisão do total (retirada e saldo que segue)</label>' +
    '<div class="bts"><button class="bt sec" data-dreset="1">Voltar ao padrão</button><button class="bt sec" data-fechar="1">Cancelar</button><button class="bt" data-dsalva="1">Aplicar</button></div>');
}
let FOLHA_D = null;
function salvaDest(){
  const d = FOLHA_D; d.prog = $('#dProg').checked; d.div = $('#dDiv').checked;
  try { localStorage.setItem('fin_dest_' + AMB, JSON.stringify(d)); } catch(_){}

// ---------- navegação entre meses (setas que seguram, arrastar, calendário) ----------
let NAV = { busy: false };
const slideEls = () => [$('#hero'), $('#cont')].filter(Boolean);
const mexeu = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
// vai para o mês `novo`; dir = +1 (futuro, entra pela direita) ou -1 (passado, entra pela esquerda); rapido = durante o segurar
function irMes(novo, dir, opt){

    const k = normNome(l.descricao); const g = G[k] = G[k] || { nome: k, itens: [], total: 0, doze: 0, meses: new Set(), ult: '' };

};
function catDe(l){
  if (l.categoria && CATS[l.categoria]) return l.categoria;
  const n = semAc(normNome(l.descricao));
  const r = (REGRAS[l.ambiente] || REGRAS.casa).find(x => x[1].test(n));
  return r ? r[0] : 'out';
}
const rotCat = (k, a) => k === 'mor' && (a || AMB) === 'empresa' ? 'Aluguel e contas' : CATS[k];

// ---------- BI ----------
let PER = '12';
function periodo(){
  const todos = [...new Set(dados().map(l => l.mes))].sort(), fim = MES;
  let ini; if (PER === 'ano') ini = MES.slice(0, 4) + '-01-01'; else if (PER === 'tudo') ini = todos[0] || MES; else ini = somaMes(MES, -(Number(PER) - 1));
  const M = todos.filter(m => m >= ini && m <= fim), n = M.length || 1;
  const pfim = somaMes(M[0] || MES, -1), pini = somaMes(pfim, -(n - 1)), P = todos.filter(m => m >= pini && m <= pfim);
  return { M, P };
}
const real = l => l.conta && l.grupo !== 'saldo' && l.grupo !== 'retirada';
function agg(ms, a){
  const L = ms.flatMap(m => doMes(m, a).filter(real)), ent = L.filter(l => l.sentido === 'entrada'), sai = L.filter(l => l.sentido === 'saida');
  const cat = {}; sai.forEach(l => { const k = catDe(l); cat[k] = (cat[k] || 0) + l.valor; });
  return { L, ent, sai, e: soma(ent), s: soma(sai), cat };
}
const delta = (a, b) => b ? ' <small style="color:var(--mut)">' + (a >= b ? '↑ ' : '↓ ') + Math.abs(Math.round((a / b - 1) * 100)) + '% vs. período anterior</small>' : '';
function topN(arr, n, sentido){
  const G = {}; arr.forEach(l => { const k = normNome(l.descricao); G[k] = (G[k] || 0) + l.valor; });
  return Object.entries(G).sort((a, b) => b[1] - a[1]).slice(0, n).map(([nome, v]) => ({ nome, v, sentido }));
}
function barras(lista, tot, cls){
  return lista.map(x => '<div class="rk"' + (x.data ? ' ' + x.data : '') + '>' + (x.av || '') + '<div class="m"><div class="ln"><span>' + esc(x.nome) + '</span><b>' + BRL0(x.v) + ' <small style="color:var(--mut);font-weight:400">' + (tot ? Math.round(x.v / tot * 100) : 0) + '%</small></b></div><div class="bar ' + (cls || '') + '"><i style="width:' + (tot ? Math.max(1.5, x.v / tot * 100) : 0) + '%"></i></div></div></div>').join('');
}
function vBI(){
  const { M, P } = periodo(), A = agg(M), B = agg(P);

  const res = A.e - A.s, inv = A.cat.inv || 0, fx = soma(A.sai, l => l.grupo === 'fixo'), vr = A.s - fx;
  const mx = Math.max(1, ...M.map(m => { const t = totais(m); return Math.max(t.e, t.s); }));
  const cats = Object.entries(A.cat).filter(([k]) => k !== 'inv').sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ nome: rotCat(k), v, data: 'data-cat="' + k + '"' }));
  const topS = topN(A.sai.filter(l => catDe(l) !== 'inv'), 8, 'saida').map(x => Object.assign(x, { av: avHtml(x.nome, 'saida', 'p'), data: 'data-pes="' + esc(x.nome) + '" data-sent="saida"' }));
  const topE = topN(A.ent, 8, 'entrada').map(x => Object.assign(x, { av: avHtml(x.nome, 'entrada', 'p'), data: 'data-pes="' + esc(x.nome) + '" data-sent="entrada"' }));
  const top3 = topE.slice(0, 3).reduce((a, x) => a + x.v, 0);
  const invM = M.map(m => ({ m, v: soma(doMes(m).filter(l => real(l) && l.sentido === 'saida' && catDe(l) === 'inv')) })); let ac = 0; invM.forEach(x => { ac += x.v; x.ac = ac; });
  const futuros = [...new Set(dados().map(l => l.mes))].sort().filter(m => m > MES).slice(0, 6).map(m => ({ m, s: totais(m).s })).filter(x => x.s > 0), fmx = Math.max(1, ...futuros.map(x => x.s));
  const nf = soma(A.ent, l => l.grupo === 'com_nf'), snf = soma(A.ent, l => l.grupo === 'sem_nf');
  const chips = [['3', '3 meses'], ['6', '6 meses'], ['12', '12 meses'], ['ano', 'Ano ' + MES.slice(0, 4)], ['tudo', 'Tudo']];
  let h = '<div class="abas" style="padding-top:0">' + chips.map(c => '<button data-per="' + c[0] + '" class="' + (PER === c[0] ? 'on' : '') + '">' + c[1] + '</button>').join('') + '</div>';
  h += '<div class="cx" style="padding:16px 12px 12px"><div class="cab"><h3>' + rotCurto(M[0]) + ' a ' + rotCurto(M[M.length - 1]) + '</h3></div><div class="trio" style="padding:0 6px"><div><small>Entrou</small><b>' + BRL0(A.e) + '</b></div><div><small>Saiu</small><b>' + BRL0(A.s) + '</b></div><div><small>Resultado</small><b class="' + (res < 0 ? 'neg' : '') + '">' + BRL0(res) + '</b></div></div>' +
    '<div class="nota" style="padding:8px 8px 0">' + (B.e || B.s ? 'Entrou' + delta(A.e, B.e) + '<br>Saiu' + delta(A.s, B.s) : '') + '</div>' +
    '<div class="trio" style="padding:8px 6px 0"><div><small>Investido</small><b>' + BRL0(inv) + '</b></div><div><small>Sobra do que entra</small><b>' + (A.e ? Math.round(res / A.e * 100) : 0) + '%</b></div><div><small>Fixo nas saídas</small><b>' + (A.s ? Math.round(fx / A.s * 100) : 0) + '%</b></div></div></div>';
  h += '<div class="cx"><div class="cab"><h3>Entradas e saídas por mês</h3><span class="tt"><span style="color:var(--acc)">■</span> entra &nbsp;<span style="color:var(--mut)">■</span> sai</span></div><div class="anog">' + M.map(m => { const t = totais(m); return '<div class="c ' + (m === MES ? 'on' : '') + '" data-ir="' + m + '"><div class="bb"><i class="e" style="height:' + (t.e / mx * 100) + '%"></i><i class="s" style="height:' + (t.s / mx * 100) + '%"></i></div><small>' + rotCurto(m).slice(0, 3) + '</small></div>'; }).join('') + '</div></div>';

  h += '<div class="duas"><div class="cx"><div class="cab"><h3>' + (AMB === 'empresa' ? 'Maiores clientes' : 'Maiores entradas') + '</h3><span class="tt">top 3 = ' + (A.e ? Math.round(top3 / A.e * 100) : 0) + '%</span></div>' + barras(topE, A.e) + '</div>' +
    '<div class="cx"><div class="cab"><h3>Maiores saídas</h3></div>' + barras(topS, A.s - inv) + '</div></div>';
  h += '<div class="duas"><div class="cx"><div class="cab"><h3>Fixo × variável</h3></div>' + barras([{ nome: 'Fixo', v: fx }, { nome: 'Variável', v: vr }], A.s) + (AMB === 'empresa' && (nf || snf) ? '<div class="gp">Entradas</div>' + barras([{ nome: 'Com NF', v: nf }, { nome: 'Sem NF', v: snf }], A.e) : '') + '</div>' +
    '<div class="cx"><div class="cab"><h3>Já comprometido à frente</h3></div>' + (futuros.length ? '<div class="anog" style="height:130px">' + futuros.map(x => '<div class="c" data-ir="' + x.m + '"><div class="bb" style="height:90px"><i class="s" style="height:' + (x.s / fmx * 100) + '%;width:60%"></i></div><small>' + rotCurto(x.m).slice(0, 3) + '</small></div>').join('') + '</div><div class="nota" style="padding-top:6px">Saídas já lançadas (parcelas e fixos) nos próximos meses.</div>' : '<div class="vazio">Nenhum mês à frente lançado.</div>') + '</div></div>';
  $('#cont').innerHTML = h;
}

// ---------- Kiro: a IA da grana ----------
let KIRO = [], KBUSY = false;
const KSUG = ['Onde posso cortar gasto sem sentir?', 'Quanto posso investir por mês?', 'Como está meu ano até aqui?', 'O que já está comprometido nos próximos meses?'];
const fmtK = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
function ctxKiro(){
  const out = [], hoje = iso(new Date());
  areasPermitidas().forEach(a => {
    const ms = [...new Set((D[a] || []).map(l => l.mes))].sort(), fim = ms.filter(m => m <= somaMes(hoje, 3)).slice(-15);
    out.push('== ' + (a === 'casa' ? 'CASA' : 'EMPRESA') + ' ==', 'mês | entradas | saídas | saldo inicial' + (a === 'empresa' ? ' | retirada' : '') + ' | saldo final');
    fim.forEach(m => { const t = fluxo(m, a); out.push(m.slice(0, 7) + ' | ' + Math.round(t.e) + ' | ' + Math.round(t.s) + ' | ' + Math.round(t.sd) + (a === 'empresa' ? ' | ' + (t.tem ? Math.round(t.retirada) : '?') : '') + ' | ' + Math.round(t.tem ? t.saldoFim : t.sobra) + (t.tem ? '' : ' (previsto)')); });
    const m12 = ms.filter(m => m <= hoje).slice(-12), A = agg(m12, a);
    out.push('Últimos 12 meses: entrou ' + Math.round(A.e) + ', saiu ' + Math.round(A.s));
    out.push('Saídas por categoria (12m): ' + Object.entries(A.cat).sort((x, y) => y[1] - x[1]).map(([k, v]) => rotCat(k, a) + ' ' + Math.round(v)).join('; '));
    out.push('Maiores saídas (12m): ' + topN(A.sai, 10).map(x => x.nome + ' ' + Math.round(x.v)).join('; '));
    out.push('Maiores entradas (12m): ' + topN(A.ent, 10).map(x => x.nome + ' ' + Math.round(x.v)).join('; '));
    const fut = ms.filter(m => m > hoje).slice(0, 6).map(m => m.slice(0, 7) + ' ' + Math.round(totais(m, a).s)); if (fut.length) out.push('Saídas já lançadas à frente: ' + fut.join('; '));
  });
  return out.join('\n');
}
function msgsK(novo){
  const m = $('#kMsgs'); if (!m) return;
  m.innerHTML = KIRO.length ? KIRO.map((x, i) => '<div class="kb ' + (x.r === 'u' ? 'u' : 'k') + (novo && i >= KIRO.length - 1 ? ' novo' : '') + '">' + fmtK(x.t) + '</div>').join('') + (KBUSY ? '<div class="kb k"><span class="dots"><i></i><i></i><i></i></span></div>' : '') : '<div class="kvz">Pergunte o que quiser sobre a sua grana — Casa e Empresa. Eu enxergo os números que estão aqui na Wallet.</div>';
  m.scrollTop = m.scrollHeight;
}
function vKiro(novo){
  if (!ACC.admin) { $('#cont').innerHTML = '<div class="vazio">A Kiro é só para o administrador.</div>'; return; }
  const ic = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
  $('#cont').innerHTML = '<div class="cx kiro"><div class="kh"><img src="/icone-ia.php?p=kiro&s=112" alt="" onerror="this.style.visibility=\'hidden\'"><div><b>Kiro</b><small>Conselheira da grana · Casa e Empresa</small></div>' + (KIRO.length ? '<button class="bt sec mini" data-kzera="1">Nova conversa</button>' : '') + '</div><div id="kMsgs" class="kmsgs"></div>' +
    (KIRO.length ? '' : '<div class="kchips">' + KSUG.map(s => '<button data-ksug="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>') +
    '<div class="kin"><textarea id="kTx" rows="1" placeholder="Pergunte sobre a sua grana…"></textarea><button class="ic kenv" id="kEnv" title="Enviar">' + ic + '</button></div><div class="nota">Conselho estratégico com base nos seus números. Não é consultoria financeira licenciada; para decisões grandes, confirme com o contador.</div></div>';
  msgsK(novo);
  const t = $('#kTx'); t.oninput = () => { t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; };
  t.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && innerWidth > 700) { e.preventDefault(); enviaK(); } };
}
async function enviaK(txt){
  const t = $('#kTx'); txt = (txt || (t && t.value) || '').trim(); if (!txt || KBUSY) return;
  KIRO.push({ r: 'u', t: txt }); KBUSY = true; if (t) { t.value = ''; t.style.height = 'auto'; }
  vKiro(true); const cx = $('#kTx'); if (cx) cx.focus();
  try {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch('/pd-grana.php', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token }, body: JSON.stringify({ pergunta: txt, historico: KIRO.slice(0, -1).slice(-10), contexto: ctxKiro() }) });
    const j = await r.json().catch(() => ({}));
    KIRO.push({ r: 'k', t: j.reply || j.error || ('Não consegui responder agora (' + r.status + ').') });
  } catch(e){ KIRO.push({ r: 'k', t: 'Não consegui falar com o servidor. Tente de novo.' }); }
  KBUSY = false; if (ABA === 'kiro') { vKiro(true); }
}


// ---------- retirada (Empresa → Casa) e a cadeia dos meses ----------
const ultimoDia = m => { const d = mesDe(m); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const retRow = m => (D.empresa || []).find(l => l.mes === m && l.grupo === 'retirada' && l.conta);
const stratRows = m => (D.casa || []).filter(l => l.mes === m && l.sentido === 'entrada' && normNome(l.descricao) === 'STRAT/PD');
const cola = (a, r) => { const nv = Object.assign(r, { valor: Number(r.valor) }), i = D[a].findIndex(x => x.id === nv.id); if (i >= 0) D[a][i] = nv; else D[a].push(nv); return nv; };
async function upd(a, id, o){ const r = await sb.from('fin_lancamentos').update(o).eq('id', id).select().single(); if (r.error) throw r.error; return cola(a, r.data); }
// saldo do mês seguinte = TOTAL − retirada (Empresa) / = TOTAL (Casa); segue até onde houver saldo lançado
async function cascata(a, m){
  if (!D[a]) return 0; let k = m, n = 0, mudou = 0;
  while (n++ < 60) {
    const nx = somaMes(k, 1), sr = doMes(nx, a).filter(l => l.grupo === 'saldo' && l.conta);
    if (sr.length !== 1) break;
    let ret = 0; if (a === 'empresa') { const rr = retRow(k); if (!rr) break; ret = rr.valor; }
    const novo = Math.round((totais(k, a).sobra - ret) * 100) / 100;
    if (Math.abs(sr[0].valor - novo) >= 0.01) { await upd(a, sr[0].id, { valor: novo }); mudou++; }
    k = nx;
  }
  return mudou;
}
async function setRetirada(m, v, op){
  op = op || {}; let aviso = '';
  const rr = retRow(m);
  if (rr) { const o = { valor: v }; if (op.dia) o.dia = op.dia; if (op.pago != null) { o.pago = op.pago; o.situacao = op.pago ? 'OK' : null; } await upd('empresa', rr.id, o); }
  else { const r = await sb.from('fin_lancamentos').insert({ ambiente: 'empresa', mes: m, sentido: 'saida', grupo: 'retirada', dia: op.dia || ultimoDia(m), descricao: 'RETIRADA', valor: v, pago: !!op.pago, situacao: op.pago ? 'OK' : null, conta: true, obs: 'vai para a Casa (STRAT/PD)' }).select().single(); if (r.error) throw r.error; cola('empresa', r.data); }
  if (D.casa) {
    const st = stratRows(m);
    if (st.length === 1) { if (Math.abs(st[0].valor - v) >= 0.01) await upd('casa', st[0].id, { valor: v }); }
    else if (!st.length) { const r = await sb.from('fin_lancamentos').insert({ ambiente: 'casa', mes: m, sentido: 'entrada', grupo: 'fixo', dia: 20, descricao: 'STRAT/PD', parcela: 'mensal', forma: 'transf. PJ', valor: v, pago: false, conta: true }).select().single(); if (r.error) throw r.error; cola('casa', r.data); }
    else aviso = ' Há mais de um STRAT/PD na Casa neste mês: ajuste a mão.';
  } else aviso = ' A Casa não foi atualizada (sem acesso).';
  const a1 = await cascata('empresa', m), a2 = await cascata('casa', m);
  return { aviso, meses: Math.max(a1, a2) };
}
// retirada vira linha de verdade nos meses antigos (valor = o que já estava implícito no saldo seguinte)
async function garanteRetiradas(){
  if (!ACC || !D.empresa) return;
  if (!(ACC.admin || (ACC.areas || []).some(x => x.area === 'empresa' && x.editar))) return;
  const ms = [...new Set(D.empresa.map(l => l.mes))].sort(), novos = [];
  ms.forEach(m => {
    if (retRow(m)) return; const nx = somaMes(m, 1), sr = doMes(nx, 'empresa').filter(l => l.grupo === 'saldo' && l.conta); if (sr.length !== 1) return;
    const v = Math.round((totais(m, 'empresa').sobra - sr[0].valor) * 100) / 100; if (Math.abs(v) < 0.01) return;
    novos.push({ ambiente: 'empresa', mes: m, sentido: 'saida', grupo: 'retirada', dia: ultimoDia(m), descricao: 'RETIRADA', valor: v, pago: m < iso(new Date()), conta: true, obs: 'vai para a Casa (STRAT/PD)' });
  });
  if (!novos.length) return;
  for (let i = 0; i < novos.length; i += 100) { const r = await sb.from('fin_lancamentos').insert(novos.slice(i, i + 100)).select(); if (r.error) return; r.data.forEach(x => cola('empresa', x)); }
  desenha(); toast('A retirada agora é uma linha em cada mês, no último dia. Toque nela para mudar.');
}
function folhaRetirada(m){
  const t = fluxo(m, 'empresa'), rr = retRow(m), v = rr ? rr.valor : (t.retirada != null ? t.retirada : 0), nx = MN[mesDe(somaMes(m, 1)).getMonth()];
  folha('<h3>Retirada de ' + rotMes(m) + '</h3><div class="nota" style="padding:0 0 10px;line-height:1.55">Sai da Empresa no <b>último dia do mês</b> e entra na Casa como <b>STRAT/PD</b>. O saldo de ' + nx + ' é o que sobra do TOTAL depois dela. Mexeu aqui, mexe nos dois lados e nos meses seguintes.</div>' +
    '<div class="trio" style="margin-bottom:12px"><div><small>TOTAL do mês</small><b>' + BRL0(t.sobra) + '</b></div><div><small>Retirada</small><b id="rPR">' + BRL0(v) + '</b></div><div><small>Saldo → ' + nx + '</small><b id="rPS">' + BRL0(t.sobra - v) + '</b></div></div>' +
    '<div class="f2"><label class="fl"><span>Valor da retirada (R$)</span><input id="rVal" inputmode="decimal" value="' + esc(String(v).replace('.', ',')) + '"></label><label class="fl"><span>Dia</span><input id="rDia" inputmode="numeric" value="' + (rr && rr.dia ? rr.dia : ultimoDia(m)) + '"></label></div>' +
    '<label class="chk"><input type="checkbox" id="rPag"' + (rr && rr.pago ? ' checked' : '') + '> Já retirei</label><div class="bts"><button class="bt sec" data-fechar="1">Cancelar</button><button class="bt" data-salvaret="' + m + '">Salvar retirada</button></div>');
  folhaRetirada._sobra = t.sobra;
}
async function salvaRetirada(m){
  const v = parseValor($('#rVal').value); if (isNaN(v) || v < 0) return toast('Valor da retirada.');
  const dia = Math.min(31, Math.max(1, parseInt($('#rDia').value, 10) || ultimoDia(m)));
  try { const r = await setRetirada(m, v, { dia, pago: $('#rPag').checked }); fecha(); desenha(); toast('Retirada salva' + (r.meses ? ' · ' + r.meses + ' mês(es) seguinte(s) atualizado(s)' : '') + '.' + r.aviso); }
  catch(e){ toast(e.message || String(e)); }
}
