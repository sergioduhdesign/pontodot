name: cPanel — SSL do domínio
on:
  workflow_dispatch:
    inputs:
      dominio: { description: "dominio", required: true }
      conta:   { description: "código da outra conta (vazio = casa)", required: false, default: "" }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          U: ${{ (github.event.inputs.conta != '' && secrets[format('CPANEL_{0}_USER', github.event.inputs.conta)]) || secrets.CPANEL_USER }}
          H: ${{ (github.event.inputs.conta != '' && secrets[format('CPANEL_{0}_HOST', github.event.inputs.conta)]) || secrets.CPANEL_HOST }}
          T: ${{ (github.event.inputs.conta != '' && secrets[format('CPANEL_{0}_TOKEN', github.event.inputs.conta)]) || secrets.CPANEL_TOKEN }}
          D: ${{ github.event.inputs.dominio }}
        run: |
          python3 .github/scripts/ssl_geo.py
          echo "== CAA/DNS"; dig +short CAA "$D"; dig +short A "$D"; dig +short A "www.$D"
