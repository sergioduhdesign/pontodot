name: STRATESIGN — publicar site novo (stratesign.com.br/novo2026 ou raiz)
# Envia hg-envio/strat/ para a pasta novo2026 do site da Stratesign na conta HostGator da casa.
# Com raiz=sim publica na raiz do domínio: não apaga nada do WordPress, guarda o .htaccess anterior em .htaccess.wp-antes
# e grava por último o .htaccess do próprio site. Nunca envia _dados/ (artigos e senha do painel ficam só no servidor). Não sobrescreve _config.php nem os briefings recebidos.
on:
  workflow_dispatch:
    inputs:
      pasta: { description: "pasta de destino dentro de stratesign.com.br", required: false, default: "novo2026" }
      raiz: { description: "sim = publica na raiz do domínio (ignora pasta)", required: false, default: "sim" }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar
        env:
          U: ${{ secrets.CPANEL_USER }}
          H: ${{ secrets.CPANEL_HOST }}
          T: ${{ secrets.CPANEL_TOKEN }}
          PASTA: ${{ github.event.inputs.pasta }}
          NA_RAIZ: ${{ github.event.inputs.raiz }}
        run: |
          set -e
          case "$PASTA" in ""|*[!A-Za-z0-9_-]*) echo "pasta inválida"; exit 1;; esac
          H="${H#https://}"; H="${H%%/*}"; case "$H" in *:*) ;; *) H="$H:2083";; esac
          HOME_DIR=""
          for t in 1 2 3 4 5 6 7 8; do
            RESP=$(curl -sS --max-time 30 -w "\n[http=%{http_code}]" -H "Authorization: cpanel $U:$T" "https://$H/execute/Variables/get_user_information" || true)
            HOME_DIR=$(echo "$RESP" | sed '$d' | python3 -c "import json,sys;print(json.load(sys.stdin)['data']['home'])" 2>/dev/null || true)
            [ -n "$HOME_DIR" ] && break
            echo "tentativa $t: o painel não respondeu como esperado: $(echo "$RESP" | tail -1) $(echo "$RESP" | head -c 240 | tr '\n' ' ' | sed -E 's/<[^>]+>/ /g')"
            sleep 40
          done
          [ -n "$HOME_DIR" ] || { echo "O painel da hospedagem está recusando o acesso agora."; exit 1; }
          RAIZ="$HOME_DIR/stratesign.com.br"; BASE="$RAIZ/$PASTA"; SRC=hg-envio/strat
          mk() { curl -sS --max-time 30 -H "Authorization: cpanel $U:$T" "https://$H/execute/Fileman/mkdir" --data-urlencode "path=$1" --data-urlencode "name=$2" --data "permissions=0755" >/dev/null || true; }
          if [ "$NA_RAIZ" = "sim" ]; then
            BASE="$RAIZ"
            # guarda o .htaccess que estava na raiz (só na primeira vez) e grava o novo
            TEM=$(curl -sS --max-time 30 -H "Authorization: cpanel $U:$T" "https://$H/execute/Fileman/get_file_content" --data-urlencode "dir=$RAIZ" --data-urlencode "file=.htaccess.wp-antes" | python3 -c "import json,sys;print(json.load(sys.stdin).get('status'))" 2>/dev/null || echo 0)
            if [ "$TEM" != "1" ]; then
              curl -sS --max-time 30 -H "Authorization: cpanel $U:$T" "https://$H/execute/Fileman/get_file_content" --data-urlencode "dir=$RAIZ" --data-urlencode "file=.htaccess" | python3 -c "import json,sys;j=json.load(sys.stdin);assert j.get('status')==1;open('/tmp/ht-antes','w').write(j['data']['content'])"
              curl -sS --max-time 30 -H "Authorization: cpanel $U:$T" "https://$H/execute/Fileman/save_file_content" --data-urlencode "dir=$RAIZ" --data-urlencode "file=.htaccess.wp-antes" --data-urlencode "content@/tmp/ht-antes" | python3 -c "import json,sys;j=json.load(sys.stdin);assert j.get('status')==1,j;print('cópia do .htaccess anterior guardada')"
            else echo "cópia do .htaccess anterior já existia"; fi
          else
            mk "$RAIZ" "$PASTA"
          fi
          while IFS= read -r d; do rel="${d#$SRC/}"; [ "$rel" = "$SRC" ] && continue; mk "$BASE/$(dirname "$rel" | sed 's#^\.$##')" "$(basename "$rel")"; done < <(find "$SRC" -mindepth 1 -type d | sort)
          n=0; falhas=0
          while IFS= read -r f; do
            rel="${f#$SRC/}"
            case "$rel" in _config.php|_dados/*|_briefings/briefing-*|_briefings/.t-*) continue;; esac
            if [ "$NA_RAIZ" = "sim" ] && [ "$rel" = ".htaccess" ]; then continue; fi
            dir="$BASE/$(dirname "$rel")"; [ "$(dirname "$rel")" = "." ] && dir="$BASE"
            ok=erro
            for t in 1 2 3 4 5; do
              R=$(curl -sS --max-time 300 -H "Authorization: cpanel $U:$T" "https://$H/execute/Fileman/upload_files" -F "dir=$dir" -F "overwrite=1" -F "file-1=@$f;filename=$(basename "$f")" || echo '{}')
              ok=$(echo "$R" | python3 .github/scripts/up_ok.py)
              [ "$ok" = "ok" ] && break
              sleep $((t * 6))
            done
            sleep 0.5
            echo "$ok  $rel"; n=$((n+1)); [ "$ok" = "ok" ] || falhas=$((falhas+1))
          done < <(find "$SRC" -type f | sort)
          if [ "$NA_RAIZ" = "sim" ] && [ "$falhas" = "0" ]; then
            curl -sS --max-time 30 -H "Authorization: cpanel $U:$T" "https://$H/execute/Fileman/save_file_content" --data-urlencode "dir=$RAIZ" --data-urlencode "file=.htaccess" --data-urlencode "content@hg-envio/strat/.htaccess" | python3 -c "import json,sys;j=json.load(sys.stdin);assert j.get('status')==1,j;print('.htaccess da raiz gravado')"
          fi
          echo "== enviados: $n | falhas: $falhas"
          [ "$falhas" = "0" ]
