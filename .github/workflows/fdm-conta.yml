name: Futurologia do Morar — contar cadastros (só contagem)
# Sobe um PHP temporário (protegido por token), roda, mostra só contagens e apaga o arquivo do servidor.
on:
  workflow_dispatch:
    inputs:
      arquivo: { description: "nome do php em hg-envio/", required: true }
      token:   { description: "token do arquivo", required: true }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rodar e apagar
        env:
          U: ${{ secrets.CPANEL_USER }}
          H: ${{ secrets.CPANEL_HOST }}
          T: ${{ secrets.CPANEL_TOKEN }}
          ARQ: ${{ github.event.inputs.arquivo }}
          TOK: ${{ github.event.inputs.token }}
        run: |
          H="${H#https://}"; H="${H%%/*}"; case "$H" in *:*) ;; *) H="$H:2083";; esac
          HOME_DIR=$(curl -sS --max-time 30 -H "Authorization: cpanel $U:$T" "https://$H/execute/Variables/get_user_information" | python3 -c "import json,sys;print(json.load(sys.stdin)['data']['home'])")
          D="$HOME_DIR/futurologiadomorar.com.br"
          case "$ARQ" in zz-conta-*.php) ;; *) echo "nome inválido"; exit 1;; esac
          R=$(curl -sS --max-time 60 -H "Authorization: cpanel $U:$T" "https://$H/execute/Fileman/save_file_content" --data-urlencode "dir=$D" --data-urlencode "file=$ARQ" --data-urlencode "content@hg-envio/$ARQ")
          echo "$R" | python3 -c "import json,sys;j=json.load(sys.stdin);print('SUBIU' if j.get('status')==1 else 'ERRO '+str(j.get('errors')))"
          echo "===== resultado"
          curl -sS --max-time 60 "https://futurologiadomorar.com.br/$ARQ?k=$TOK" | head -60 || true
          echo "===== apagando"
          curl -sS --max-time 60 -H "Authorization: cpanel $U:$T" "https://$H/json-api/cpanel" --data-urlencode "cpanel_jsonapi_user=${U}" --data "cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=unlink" --data-urlencode "sourcefiles=$D/$ARQ" | head -c 300; echo
          curl -sS -o /dev/null -w "depois de apagar: http=%{http_code}\n" "https://futurologiadomorar.com.br/$ARQ?k=$TOK"
