name: Página pública — foto de um trecho
on:
  workflow_dispatch:
    inputs:
      url:      { description: "endereço", required: true }
      texto:    { description: "texto que aparece no trecho a fotografar", required: true }
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - run: pip install playwright >/dev/null && true
      - env: { U: "${{ github.event.inputs.url }}", T: "${{ github.event.inputs.texto }}" }
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome'); pg=b.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
              pg.goto(os.environ['U']+'?v=1',wait_until='networkidle'); pg.wait_for_timeout(1500)
              def medir(rot):
                  r=pg.evaluate("""t=>{const h=[...document.querySelectorAll('h2')].find(e=>e.textContent.includes(t));const row=h.closest('.e-con.e-parent');const img=row.querySelector('img[src*="book.pets"]');const a=img.getBoundingClientRect(),b=row.getBoundingClientRect();const cs=getComputedStyle(img);return {img:[a.x|0,a.y|0,a.width|0,a.height|0],faixa:[b.x|0,b.y|0,b.width|0,b.height|0],folga_base:Math.round(b.bottom-a.bottom),nat:[img.naturalWidth,img.naturalHeight],display:cs.display,fit:cs.objectFit}}""",os.environ['T'])
                  print('MEDIDA',rot,r)
              pg.get_by_text(os.environ['T']).first.scroll_into_view_if_needed(); pg.wait_for_timeout(2000); medir('desktop')
              pg.set_viewport_size({'width':390,'height':800}); pg.wait_for_timeout(1000); pg.get_by_text(os.environ['T']).first.scroll_into_view_if_needed(); pg.wait_for_timeout(2000); medir('celular')
              b.close()
          PY
