<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escola — bastidores — Pontodot</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--ink:#121212;--gray:#6c6c69;--line:rgba(0,0,0,.12);--soft:#f5f5f3;--ok:#1f8a55;--bad:#c63d32;--mid:#c8941a;--bg:#fff}
@media(prefers-color-scheme:dark){:root{--ink:#f2f2f0;--gray:#a3a3a0;--line:rgba(255,255,255,.14);--soft:#1b1c1e;--bg:#121212}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 "Inter Tight",system-ui,sans-serif}
/* barras de rolagem sempre visíveis */
*{scrollbar-width:auto;scrollbar-color:rgba(128,128,128,.6) transparent}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:rgba(128,128,128,.55);border-radius:8px;border:3px solid transparent;background-clip:content-box}
.app{display:grid;grid-template-columns:340px 1fr;height:100%}@media(max-width:820px){.app{grid-template-columns:1fr}.app.det .lista{display:none}.app:not(.det) .detalhe{display:none}}
.lista{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.topo{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.topo h1{font-size:19px;margin:0;letter-spacing:-.02em;font-weight:600}.sub{color:var(--gray);font-size:12.5px}
.rol{overflow-y:scroll;flex:1;padding:8px}
.btn{font:500 13px "Inter Tight";padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.r{color:var(--bad);border-color:var(--bad)}.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sk{padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;background:var(--soft)}.sk.on{border-color:var(--ink)}
.sk b{font-weight:600}.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--gray);margin-left:4px}.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.par{color:var(--mid);border-color:var(--mid)}
.faces{display:flex;margin-top:6px}.faces img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid var(--soft);margin-right:-6px;background:var(--line)}.faces img.off{filter:grayscale(1);opacity:.5}
.detalhe{overflow-y:scroll;min-height:0;display:flex;flex-direction:column}
.dtopo{position:sticky;top:0;background:var(--bg);z-index:3;padding:12px 18px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dc{padding:16px 18px 60px;max-width:860px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin:24px 0 8px;font-weight:600}
label{display:block;font-size:12px;color:var(--gray);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}textarea{min-height:90px;resize:vertical}
.al{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.al img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line)}.al .t{flex:1}
.box{border:1px dashed var(--line);border-radius:12px;padding:14px;background:var(--soft)}
.msg{padding:50px 20px;text-align:center;color:var(--gray)}.aviso{padding:9px 14px;font-size:13px;background:var(--soft);border-bottom:1px solid var(--line)}
.ver{font-size:12.5px;color:var(--gray);padding:3px 0}
</style></head><body>
<div class="app" id="app"><div class="msg" style="grid-column:1/-1">Carregando…</div></div>
<script>
const SB_URL='https://ibkflplbraltewsjjsqm.supabase.co',SB_KEY='sb_publishable_M5Wws9n27ONN9JmG_qXbSg_e3U1xFxD';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb,ses,SK=[],IAS=[],SEL=null,MODO='ver',PROP=null,PROP_ALVO='',MSG='',BUSY=false;
async function api(b){const r=await fetch('/pd-escola.php',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ses.access_token},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erro '+r.status);return j;}
async function boot(){sb=window.supabase.createClient(SB_URL,SB_KEY);ses=(await sb.auth.getSession()).data.session;
  if(!ses){$('#app').innerHTML='<div class="msg" style="grid-column:1/-1">Entre na plataforma para abrir os bastidores.</div>';return;}
  await carrega();}
async function carrega(){try{SK=(await api({acao:'esc_skills'})).skills;IAS=(await api({acao:'esc_ias'})).ias;}catch(e){$('#app').innerHTML='<div class="msg" style="grid-column:1/-1">'+esc(e.message)+'</div>';return;}draw();}
const face=p=>'/pd/personagens/'+encodeURIComponent(p||'')+'/avatar.jpg';
function cur(){return SK.find(s=>s.skill_id===SEL);}
function lista(){return `<div class="lista"><div class="topo"><h1>Escola — bastidores</h1><div class="sub">Cada skill é uma aula real. Inscreva as IAs, melhore, pare ou suba um documento novo.</div>
 <div class="row"><button class="btn p" onclick="novo('doc')">Subir documento</button><button class="btn" onclick="novo('manual')">Nova skill</button></div></div>
 <div class="rol">${SK.map(s=>{const ativos=s.alunos.filter(a=>a.ativa);return `<div class="sk ${s.skill_id===SEL&&MODO==='ver'?'on':''}" onclick="abre('${esc(s.skill_id)}')"><b>${esc(s.nome)}</b>
  <span class="tag">v${s.versao}</span><span class="tag ${s.pausada?'par':'ok'}">${s.pausada?'parada':'ativa'}</span>
  <div class="sub">${esc((s.finalidade||'').slice(0,110))}</div>
  <div class="faces">${s.alunos.slice(0,8).map(a=>`<img class="${a.ativa?'':'off'}" src="${face(a.personagem)}" title="${esc(a.nome)} · IA do ${esc(a.dona)}">`).join('')}</div>
  <div class="sub" style="margin-top:8px">${ativos.length} estudando · ${s.alunos.filter(a=>a.apta).length} aptas · ${s.aulas} aulas</div></div>`}).join('')||'<div class="msg">Nenhuma skill ainda.</div>'}</div></div>`;}
function campos(d,id){return `<label>Nome</label><input id="${id}n" value="${esc(d.nome)}">
 <label>Finalidade (o que a IA passa a saber fazer)</label><textarea id="${id}f">${esc(d.finalidade)}</textarea>
 <label>Entradas — o que precisa chegar (uma por linha)</label><textarea id="${id}e">${esc((d.entradas||[]).join('\n'))}</textarea>
 <label>Método — passos e o que a IA decide sozinha</label><textarea id="${id}m" style="min-height:200px">${esc(d.metodo)}</textarea>
 <label>Critérios observáveis de revisão (um por linha)</label><textarea id="${id}c">${esc((d.criterios||[]).join('\n'))}</textarea>
 <label>Limites — o que exige humano</label><textarea id="${id}l">${esc(d.limites)}</textarea>`;}
function ler(id){const L=x=>$('#'+id+x).value.split('\n').map(s=>s.trim()).filter(Boolean);return{nome:$('#'+id+'n').value,finalidade:$('#'+id+'f').value,entradas:L('e'),metodo:$('#'+id+'m').value,criterios:L('c'),limites:$('#'+id+'l').value};}
function detalhe(){
 if(MODO==='doc')return `<div class="detalhe"><div class="dtopo"><b style="flex:1">Subir documento</b><button class="btn" onclick="MODO='ver';draw()">Cancelar</button></div><div class="dc">
  <div class="box">Suba um documento feito com Claude ou GPT (.docx, .md, .txt) ou cole o texto. A plataforma lê e propõe uma skill — você revisa antes de salvar.</div>
  <label>O que fazer com ele</label><select id="alvo" onchange="PROP_ALVO=this.value"><option value="">Criar uma skill/aula NOVA</option>${SK.map(s=>`<option value="${esc(s.skill_id)}" ${PROP_ALVO===s.skill_id?'selected':''}>Melhorar: ${esc(s.nome)} (v${s.versao} → v${s.versao+1})</option>`).join('')}</select>
  <label>Arquivo</label><input type="file" id="arq" accept=".docx,.md,.txt,.markdown" onchange="lerArq(this)">
  <label>ou cole o texto</label><textarea id="txt" style="min-height:220px"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn p" id="bAnalisa" onclick="analisa()" ${BUSY?'disabled':''}>${BUSY?'Lendo…':'Ler e propor skill'}</button></div>
  ${PROP?`<h2>Proposta — revise e salve</h2>${campos(PROP,'p')}<label>O que esta versão traz de novo</label><input id="pnotas" value="${esc(PROP.notas||'')}">
  <div class="row" style="margin-top:14px"><button class="btn p" onclick="salvar('p',PROP_ALVO,'doc')">${PROP_ALVO?'Salvar como nova versão':'Criar skill'}</button></div>`:''}</div></div>`;
 if(MODO==='manual')return `<div class="detalhe"><div class="dtopo"><b style="flex:1">Nova skill</b><button class="btn p" onclick="salvar('n','','manual')">Criar skill</button><button class="btn" onclick="MODO='ver';draw()">Cancelar</button></div><div class="dc">${campos({},'n')}</div></div>`;
 const s=cur();if(!s)return `<div class="detalhe"><div class="msg">Escolha uma skill à esquerda ou suba um documento.</div></div>`;
 const livres=IAS.filter(i=>!s.alunos.some(a=>a.ia_user_id===i.ia_user_id));
 return `<div class="detalhe"><div class="dtopo"><b style="flex:1;font-size:16px">${esc(s.nome)} <span class="tag">v${s.versao}</span><span class="tag ${s.pausada?'par':'ok'}">${s.pausada?'parada':'ativa'}</span></b>
  <button class="btn p" onclick="salvar('d','${esc(s.skill_id)}','manual')">Salvar nova versão</button>
  <button class="btn" onclick="pausar('${esc(s.skill_id)}',${!s.pausada})">${s.pausada?'Voltar com a aula':'Parar a aula'}</button>
  <button class="btn" onclick="novo('doc','${esc(s.skill_id)}')">Melhorar com documento</button>
  <button class="btn r" onclick="apagar('${esc(s.skill_id)}')">Apagar</button><button class="btn" onclick="fecha()" style="display:none" id="bvolta">Voltar</button></div>
  ${MSG?`<div class="aviso">${esc(MSG)}</div>`:''}<div class="dc">
  <h2>Quem está estudando (${s.alunos.length})</h2>
  ${s.alunos.map(a=>`<div class="al"><img src="${face(a.personagem)}"><div class="t"><b>${esc(a.nome)}</b> · IA do ${esc(a.dona||'—')}<div class="sub">${a.apta?'apta':'estudando'}${a.ativa?'':' · parada'}</div></div>
   <button class="btn" onclick="aluno('${esc(s.skill_id)}','${a.ia_user_id}','${a.ativa?'parar':'retomar'}')">${a.ativa?'Parar':'Retomar'}</button><button class="btn r" onclick="aluno('${esc(s.skill_id)}','${a.ia_user_id}','remover')">Tirar</button></div>`).join('')||'<div class="sub">Ninguém inscrito ainda.</div>'}
  <div class="row" style="margin-top:12px"><select id="insc" style="max-width:340px"><option value="">Inscrever uma IA…</option>${livres.map(i=>`<option value="${i.ia_user_id}">${esc(i.nome)} · IA do ${esc(i.dona)}</option>`).join('')}</select><button class="btn" onclick="aluno('${esc(s.skill_id)}',$('#insc').value,'matricular')">Inscrever</button></div>
  <h2>Conteúdo da aula (editável)</h2>${campos(s,'d')}<label>O que muda nesta versão</label><input id="dnotas" placeholder="ex.: incluí regra de CTA">
  <h2>Versões</h2>${s.versoes.map(v=>`<div class="ver">v${v.versao} · ${new Date(v.criada_em).toLocaleDateString('pt-BR')}${v.origem?' · '+esc(v.origem):''}${v.notas?' — '+esc(v.notas):''}</div>`).join('')}
  <div class="sub" style="margin-top:14px">${s.aulas} aulas feitas · ${s.validadas} validadas</div></div></div>`;}
function draw(){$('#app').className='app'+(SEL||MODO!=='ver'?' det':'');$('#app').innerHTML=lista()+detalhe();const b=$('#bvolta');if(b&&innerWidth<=820)b.style.display='';}
function abre(id){SEL=id;MODO='ver';MSG='';draw();}
function fecha(){SEL=null;MODO='ver';draw();}
function novo(m,alvo){MODO=m;PROP=null;PROP_ALVO=alvo||'';MSG='';draw();}
async function lerArq(inp){const f=inp.files[0];if(!f)return;let t='';try{if(/\.docx$/i.test(f.name)){t=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;}else t=await f.text();}catch(e){MSG='Não consegui ler o arquivo.';}$('#txt').value=t;}
async function analisa(){const t=$('#txt').value;PROP_ALVO=$('#alvo').value;BUSY=true;draw();$('#txt').value=t;
 try{const r=await api({acao:'esc_skill_doc',texto:t,skill_id:PROP_ALVO});PROP=Object.assign({},r.proposta);}catch(e){alert(e.message);}BUSY=false;const keep=t;draw();$('#txt').value=keep;}
async function salvar(id,skill,origem){const d=ler(id);d.acao='esc_skill_salvar';d.skill_id=skill;d.origem=origem;d.notas=(id==='p'?$('#pnotas'):id==='d'?$('#dnotas'):{value:''}).value;
 try{const r=await api(d);SEL=r.skill_id;MODO='ver';PROP=null;await carrega();MSG='Salva: versão '+r.versao+'.';draw();}catch(e){alert(e.message);}}
async function pausar(id,pz){try{await api({acao:'esc_skill_pausar',skill_id:id,pausada:pz});await carrega();MSG=pz?'Aula parada: nenhuma prova nova nasce.':'Aula de volta.';draw();}catch(e){alert(e.message);}}
async function apagar(id){if(!confirm('Apagar esta skill e as inscrições? As aulas já feitas ficam no histórico.'))return;try{await api({acao:'esc_skill_apagar',skill_id:id,confirmo:true});SEL=null;await carrega();}catch(e){alert(e.message);}}
async function aluno(sk,ia,fz){if(!ia)return;try{await api({acao:'esc_aluno',skill_id:sk,ia_user_id:ia,fazer:fz});await carrega();}catch(e){alert(e.message);}}
boot();
</script></body></html>
