<script>
const SB_URL='https://ibkflplbraltewsjjsqm.supabase.co',SB_KEY='sb_publishable_M5Wws9n27ONN9JmG_qXbSg_e3U1xFxD';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ESTS=['novo','abordado','engajado','qualificando','proposta','negociando','ganho','perdido'];
const SINAL={RODA_META_ADS:'anuncia na Meta',RODA_GOOGLE_ADS:'anuncia no Google',SEM_WHATSAPP:'sem WhatsApp no site',SEM_SCHEMA:'sem SEO estruturado',LANCAMENTO:'lançamento em curso',CONTRATANDO:'contratando',SITE_FORA:'site não abriu'};
let CX=[],CXED=null,CXRES=null,ses,CART=new URLSearchParams(location.search).has('cart')?new URLSearchParams(location.search).get('cart'):'todas',TAB=new URLSearchParams(location.search).get('aba')||'funil',EST='',FUN={},CARTS=[],LEADS=[],TOTAL=0,PAG=0,FIL={q:'',uf:'',segmento:'',nota_min:0},CAIXA=[],HOJE=0,TETO=40,LOG='',FILA=0,IMAP=false,PLAN=null;
async function api(b){const r=await fetch('/pd-vendas.php',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ses.access_token},body:JSON.stringify({carteira:CART,...b})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('servidor '+r.status));return j;}
async function boot(){const sb=window.supabase.createClient(SB_URL,SB_KEY);ses=(await sb.auth.getSession()).data.session;
  if(!ses){$('#app').innerHTML='<div class="msg">Entre na plataforma para abrir Vendas.</div>';return;}
  try{const f=await api({acao:'funil'});CARTS=f.carteiras;}catch(e){$('#app').innerHTML='<div class="msg">'+esc(e.message)+'</div>';return;}
  await carrega();}
function corDe(c){const h=String(c||'#444').replace('#','');const v=h.length===3?h.split('').map(x=>x+x).join(''):h.padEnd(6,'0');const r=parseInt(v.slice(0,2),16),g=parseInt(v.slice(2,4),16),b=parseInt(v.slice(4,6),16);return {bg:'#'+v.slice(0,6),fg:(r*299+g*587+b*114)/1000>150?'#111':'#fff'};}
function avDe(c,big){return c.logo_url?`<span class="av"><img src="${esc(c.logo_url)}" alt=""></span>`:`<span class="av" style="background:${esc(c.color||'#555')}">${esc((c.name||'?').slice(0,2).toUpperCase())}</span>`;}
function chips(){
  const todos=[{id:'todas',name:'Todos os clientes',color:'#3a3d3b',logo_url:''},...CARTS];
  $('#carts').innerHTML=todos.map(c=>`<button class="ct ${CART===c.id?'on':''}" data-id="${c.id}" onclick="troca('${c.id}')">${avDe(c)}${esc(c.name)}</button>`).join('');
  const el=$('#carts');if(!el._w){el._w=1;el.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
    let dn=false,x0=0,s0=0,mv=false;el.addEventListener('mousedown',e=>{dn=true;mv=false;x0=e.pageX;s0=el.scrollLeft;});window.addEventListener('mouseup',()=>{dn=false;});el.addEventListener('mousemove',e=>{if(!dn)return;const d=e.pageX-x0;if(Math.abs(d)>4)mv=true;el.scrollLeft=s0-d;});el.addEventListener('click',e=>{if(mv){e.stopPropagation();e.preventDefault();mv=false;}},true);}
  const on=el.querySelector('.ct.on');if(on&&!el._ok){el._ok=1;el.scrollLeft=on.offsetLeft-60;}
  faixa();}
function rola(d){$('#carts').scrollBy({left:d*260,behavior:'smooth'});}
function faixa(){const f=$('#faixa');if(!f)return;
  if(CART==='todas'){f.style.display='none';return;}
  const c=CARTS.find(x=>x.id===CART)||{name:'Cliente'};const k=corDe(c.color);
  const tot=Object.values(FUN).reduce((a,b)=>a+b,0),conv=['engajado','qualificando','proposta','negociando'].reduce((a,e)=>a+(FUN[e]||0),0);
  f.style.cssText=`display:flex;background:${k.bg};color:${k.fg}`;
  f.innerHTML=`${avDe(c)}<div><div class="nm">${esc(c.name)}</div><div class="nu">${tot.toLocaleString('pt-BR')} leads · ${conv} em conversa · ${CAIXA.length} na caixa de saída</div></div><button class="x" onclick="troca('todas')">ver todos</button>`;}
async function troca(id){CART=id;EST='';PAG=0;await carrega();}
async function carrega(){try{const[f,l,c]=await Promise.all([api({acao:'funil'}),api({acao:'listar',estagio:EST,...FIL,de:PAG*100}),api({acao:'caixa'})]);try{CX=(await api({acao:'caixas'})).caixas||[];}catch(e){CX=[];}FUN=f.funil;FILA=f.fila;IMAP=f.imap;CARTS=f.carteiras;LEADS=l.leads;TOTAL=l.total;CAIXA=c.caixa;HOJE=c.hoje;TETO=c.teto;}catch(e){$('#app').innerHTML='<div class="msg">'+esc(e.message)+'</div>';return;}draw();}
function draw(){
  chips();
  $('#tabs').innerHTML=[['funil','Leads'],['caixa','Caixa de saída'+(CAIXA.length?' ('+CAIXA.length+')':'')],['entrar','Adicionar leads']].map(([k,n])=>`<button class="${TAB===k?'on':''}" onclick="TAB='${k}';draw()">${n}</button>`).join('');
  $('#app').innerHTML=TAB==='funil'?vFunil():TAB==='caixa'?vCaixa():vEntrar();}
function vFunil(){
  const tot=Object.values(FUN).reduce((a,b)=>a+b,0);
  const f=`<div class="fun"><button class="${EST===''?'on':''}" onclick="EST='';PAG=0;carrega()"><b>${tot.toLocaleString('pt-BR')}</b><small>todos</small></button>${ESTS.map(e=>`<button class="${EST===e?'on':''}" onclick="EST='${e}';PAG=0;carrega()"><b>${(FUN[e]||0).toLocaleString('pt-BR')}</b><small>${e}</small></button>`).join('')}</div>`;
  const UFS='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
  const fil=`<div class="fil"><input id="fq" placeholder="Buscar empresa" value="${esc(FIL.q)}" style="flex:1;min-width:150px" onkeydown="if(event.key==='Enter')filtra()"><select id="fu"><option value="">UF</option>${UFS.map(u=>`<option ${FIL.uf===u?'selected':''}>${u}</option>`).join('')}</select><input id="fs" placeholder="Segmento" value="${esc(FIL.segmento)}" style="width:130px" onkeydown="if(event.key==='Enter')filtra()"><select id="fn"><option value="0">Nota</option><option value="40" ${FIL.nota_min==40?'selected':''}>40+</option><option value="60" ${FIL.nota_min==60?'selected':''}>60+</option><option value="75" ${FIL.nota_min==75?'selected':''}>75+</option></select><button class="btn s" onclick="filtra()">Filtrar</button></div>`;
  const lote=TOTAL?`<div class="card" style="padding:12px 14px"><div class="sub" style="margin-bottom:8px"><b>${TOTAL.toLocaleString('pt-BR')}</b> leads neste filtro. Transforme em <b>lote</b>: os melhores entram na fila e eu leio o site de cada um em segundo plano (${FILA?FILA.toLocaleString('pt-BR')+' na fila agora':'fila vazia'}).</div><div class="row"><input id="ln" placeholder="Nome do lote" style="flex:1;min-width:150px"><input id="lm" type="number" value="500" min="1" max="5000" style="width:90px"><button class="btn ia s" onclick="loteCriar(this)">Criar lote e ler os sites</button></div></div>`:'';
  const lista=LEADS.map(l=>`<div class="lead" onclick="abre('${l.id}')"><div class="nota ${l.nota>=60?'alta':l.nota>=40?'media':''}">${l.nota??'–'}</div><div class="t"><b>${esc(l.nome)}</b><small>${esc([l.cidade&&(l.cidade+(l.uf?'/'+l.uf:'')),l.segmento,l.estagio].filter(Boolean).join(' · '))}${l.angulo?' — '+esc(l.angulo):''}</small></div>${l.enriquecido_em?'':'<span class="tag" title="site ainda não lido">pré-nota</span>'}</div>`).join('')||'<div class="msg">Nenhum lead aqui. Vá em “Adicionar leads”.</div>';
  const pg=TOTAL>100?`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn s" ${PAG?'':'disabled'} onclick="PAG--;carrega()">‹</button><span class="sub">${PAG*100+1}–${Math.min(TOTAL,PAG*100+100)} de ${TOTAL.toLocaleString('pt-BR')}</span><button class="btn s" ${(PAG+1)*100>=TOTAL?'disabled':''} onclick="PAG++;carrega()">›</button></div>`:'';
  return f+fil+lote+`<div class="row" style="margin-bottom:10px"><button class="btn s" onclick="cad()">Quem pede follow-up</button><span class="log">${esc(LOG)}</span></div>`+lista+pg;}
function filtra(){FIL={q:$('#fq').value.trim(),uf:$('#fu').value,segmento:$('#fs').value.trim(),nota_min:+$('#fn').value};PAG=0;carrega();}
function loteCriar(b){run(b,'Criando…',async()=>{const r=(await api({acao:'lote_criar',...FIL,estagio:EST,nome:$('#ln').value,max:+$('#lm').value})).r;LOG=`✅ Lote com ${r.dentro.toLocaleString('pt-BR')} leads. Estou lendo os sites em segundo plano (uns 40 a cada 5 min); os melhores sobem primeiro.`;});}
function vCaixa(){
  const c=CAIXA.map(x=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(x.pd_prospects?.nome||'')}</b><span class="sub">${x.canal} · msg ${x.sequencia||1} · por ${esc(x.escrito_por||'')}</span></div>

/* ---- e-mail de cada cliente: entra e sai pela caixa DELE ---- */
function cxDe(id){return CX.find(x=>x.client_id===id);}

  const alvo=CART==='todas'?CARTS:CARTS.filter(c=>c.id===CART);

    return `<div class="row" style="justify-content:space-between;padding:7px 0;border-top:.5px solid var(--linha,rgba(255,255,255,.12))"><span class="row" style="gap:10px">${avDe(c)}<span><b>${esc(c.name)}</b><br><span class="sub">${x?esc(x.email)+' · ':''}${st}</span></span></span><button class="btn s" onclick="cxAbrir('${c.id}')">${x?'Editar':'Ligar e-mail'}</button></div>`;}).join('');
  const f=CXED?cxForm():'';

function cxForm(){const c=CARTS.find(x=>x.id===CXED)||{name:''},x=cxDe(CXED)||{};
  return `<div style="margin-top:12px;padding-top:12px;border-top:.5px solid var(--linha,rgba(255,255,255,.12))"><b>${esc(c.name)}</b>
  <div class="row" style="margin:8px 0;gap:8px"><input id="cxe" placeholder="e-mail (vendas@cliente.com.br)" value="${esc(x.email||'')}" style="flex:1;min-width:220px"><input id="cxs" type="password" autocomplete="new-password" placeholder="${x.tem_senha?'senha (deixe vazio pra manter)':'senha do e-mail'}" style="flex:1;min-width:180px"></div>
  <details ${CXRES&&(CXRES.entrada!==true||CXRES.saida!==true)?'open':''}><summary class="sub" style="cursor:pointer">Servidores (eu descubro sozinho — só mexa se o teste pedir)</summary>
  <div class="row" style="margin:8px 0;gap:8px"><input id="cxu" placeholder="usuário (padrão: o e-mail)" value="${esc(x.usuario&&x.usuario!==x.email?x.usuario:'')}" style="flex:1;min-width:180px">
  <input id="cxih" placeholder="entrada IMAP (vazio = automático)" value="${esc(x.imap_host||'')}" style="flex:1;min-width:180px"><input id="cxip" type="number" value="${x.imap_porta||993}" style="width:80px">
  <input id="cxsh" placeholder="saída SMTP (vazio = automático)" value="${esc(x.smtp_host||'')}" style="flex:1;min-width:180px"><input id="cxsp" type="number" value="${x.smtp_porta||465}" style="width:80px"></div></details>
  <div class="row" style="gap:8px"><button class="btn p s" onclick="cxSalvar(this)">Salvar e testar</button>${x.email?'<button class="btn s" onclick="cxTestar(this)">Só testar</button><button class="btn s" onclick="cxRemover(this)">Desligar</button>':''}<button class="btn s" onclick="CXED=null;CXRES=null;draw()">Fechar</button></div>${cxRes(CXRES)}</div>`;}
function cxAbrir(id){CXED=id;CXRES=null;draw();}
function cxDica(m){m=String(m||'');
  if(/recusou o login/.test(m))return{t:'Usuário ou senha não conferem.',p:['O usuário é o e-mail completo (ex.: vendas@sergioduh.com).','Confira a senha entrando no webmail da hospedagem com ela.','Não lembra? cPanel › Contas de e-mail › Gerenciar › definir nova senha. Depois cole aqui.']};
  if(/não existe/.test(m))return{t:'O endereço do servidor está errado.',p:['Onde achar: cPanel › Contas de e-mail › Conectar dispositivos (ou “Configurar dispositivo de e-mail”).','Copie “Servidor de entrada” (IMAP) e “Servidor de saída” (SMTP) da parte SSL/TLS.','Cole em “Servidores” aqui embaixo e salve de novo.']};
  if(/não atende na porta/.test(m))return{t:'O servidor não respondeu nessa porta.',p:['Confira as portas na mesma tela do cPanel (Conectar dispositivos): em geral IMAP 993 e SMTP 465.','Ajuste em “Servidores” aqui embaixo.','Se já estiverem certas, a hospedagem pode estar bloqueando acesso externo: peça ao suporte para liberar IMAP/SMTP para a plataforma.']};
  if(/certificado/.test(m))return{t:'O servidor existe, mas o certificado é de outro nome.',p:['Use o nome do servidor da hospedagem, não o do domínio. Ele aparece em cPanel › Conectar dispositivos (tipo br123.hostgator.com.br).','Cole em “Servidores” (entrada e saída) e salve de novo.']};
  return{t:m,p:['Confira os dados em cPanel › Conectar dispositivos e tente de novo.']};}
function cxMsg(t){return '';}
function cxRes(t){if(!t)return'';
  const lado=(nome,v)=>{if(v===true)return`<div style="color:#7ee2a2;padding:4px 0">✅ ${nome}: funcionando</div>`;const d=cxDica(v);return`<div style="padding:8px 0 4px"><b style="color:#f0b15a">⚠️ ${nome}: ${esc(d.t)}</b><div class="sub" style="margin:2px 0 0">${esc(v)}</div><ol style="margin:6px 0 0 18px;padding:0;color:var(--branco2)">${d.p.map(x=>`<li style="margin:3px 0">${esc(x)}</li>`).join('')}</ol></div>`;};
  return`<div class="card" style="margin-top:10px;background:rgba(255,255,255,.04)">${lado('Receber e-mails',t.entrada)}${lado('Enviar e-mails',t.saida)}</div>`;}
function cxMsgOld(t){return t.entrada===true&&t.saida===true?'✅ E-mail ligado: recebe e envia.':`${t.entrada===true?'✅ Recebe':'⚠️ Receber: '+t.entrada} · ${t.saida===true?'✅ Envia':'⚠️ Enviar: '+t.saida}`;}
function cxSalvar(b){run(b,'Testando…',async()=>{const r=await api({acao:'caixa_salvar',client_id:CXED,email:$('#cxe').value,senha:$('#cxs').value,usuario:$('#cxu').value,imap_host:$('#cxih').value,imap_porta:+$('#cxip').value,smtp_host:$('#cxsh').value,smtp_porta:+$('#cxsp').value});CXRES=r.teste||null;LOG=r.teste&&r.teste.entrada===true&&r.teste.saida===true?'✅ E-mail do cliente ligado.':'';});}
function cxTestar(b){run(b,'Testando…',async()=>{CXRES=(await api({acao:'caixa_testar',client_id:CXED})).teste;LOG='';});}
function cxRemover(b){if(!confirm('Desligar o e-mail deste cliente?'))return;run(b,'…',async()=>{await api({acao:'caixa_remover',client_id:CXED});CXED=null;LOG='E-mail desligado.';});}
function lerInbox(b){run(b,'Lendo…',async()=>{const r=(await api({acao:'inbox'})).r;LOG=r.erro?'⚠️ '+r.erro+' — abra “E-mail dos clientes” acima, clique em Editar e Salvar e testar: mostro o que corrigir.':`📥 ${r.lidas||0} e-mail(s) novos: ${r.respostas||0} resposta(s) de lead, ${r.bounces||0} endereço(s) inválido(s), ${r.ignoradas||0} ignorado(s).`;});}
function vEntrar(){return `<div class="card"><b>1 · Subir a base inteira</b><div class="sub" style="margin:4px 0 10px">Excel ou CSV, até dezenas de milhares de linhas. Eu reconheço as colunas, tiro duplicados (pelo site ou nome+cidade) e dou uma pré-nota só com o que a planilha já diz. Os sites são lidos depois, só dos lotes que você montar.</div>
  <input type="file" id="arq" accept=".xlsx,.xls,.csv" onchange="lerPlan(this)">${PLAN?planUI():''}</div>
  <div class="card"><b>2 · Deixar a IA achar leads</b><div class="sub" style="margin:4px 0 10px">Ela pesquisa na web, só traz empresa real com site confirmado e já lê o site. Até 10 buscas por dia.</div>
  <div class="row"><input id="dq" placeholder="ex.: incorporadoras com lançamento em Campinas" style="flex:1;min-width:240px"><input id="dn" type="number" min="3" max="15" value="10" style="width:70px"><button class="btn ia" onclick="desc(this)">Descobrir</button></div></div>
  <div class="card"><b>3 · Colar uma lista pequena</b><div class="sub" style="margin:4px 0 8px"><code>Empresa; site; cidade; segmento; contato; e-mail; zap</code></div>
  <textarea id="lin" rows="4"></textarea><div class="row" style="margin-top:8px"><button class="btn p" onclick="imp(this)">Importar e ler os sites</button></div></div>
  <div class="card"><b>4 · A IA escreve as aberturas</b><div class="sub" style="margin:4px 0 8px">Pega os melhores leads novos, um ângulo por lead (só com sinal verificado) e deixa na Caixa de saída.</div>
  <div class="row"><select id="cn"><option value="email">E-mail</option><option value="zap">WhatsApp</option></select><input id="qt" type="number" min="1" max="10" value="5" style="width:70px"><input id="of" placeholder="O que oferecemos (1 frase)" style="flex:1;min-width:220px"><button class="btn ia" onclick="abord(this)">Escrever rascunhos</button></div></div><div class="log">${esc(LOG)}</div>`;}
async function run(b,msg,fn){const o=b.textContent;b.disabled=true;b.textContent=msg;try{await fn();}catch(e){LOG='⚠️ '+e.message;}b.disabled=false;b.textContent=o;await carrega();}
// ---- planilha grande
const CAMPOS=[['nome','Empresa',/fantasia|razao|empresa|nome/],['site','Site',/site|web|url|dominio/],['email','E-mail',/e-?mail/],['zap','Telefone/Zap',/whats|celular|zap|telefone|fone|tel/],['cidade','Cidade',/cidade|municipio/],['uf','UF',/^uf$|estado/],['segmento','Segmento',/cnae|segmento|atividade|ramo/],['porte','Porte',/porte/],['contato','Contato',/contato|socio|responsavel|decisor/],['cargo','Cargo',/cargo|qualificacao/]];
const nrm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
async function lerPlan(inp){const f=inp.files[0];if(!f)return;LOG='Lendo '+f.name+'…';PLAN={nome:f.name,carregando:true};draw();
  try{if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('não consegui carregar o leitor de Excel'));document.head.appendChild(s);});
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',dense:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
    const cab=(rows[0]||[]).map(x=>String(x));const map={};CAMPOS.forEach(([k,,re])=>{let i=cab.findIndex(h=>re.test(nrm(h)));if(k==='nome'){const j=cab.findIndex(h=>/fantasia/.test(nrm(h)));if(j>=0)i=j;}map[k]=i;});
    PLAN={nome:f.name,cab,rows:rows.slice(1).filter(r=>r.some(c=>String(c).trim())),map};LOG='';}catch(e){PLAN=null;LOG='⚠️ '+e.message;}draw();}
function planUI(){if(PLAN.carregando)return '<div class="sub" style="margin-top:10px">Lendo a planilha…</div>';
  return `<div class="sub" style="margin-top:12px"><b>${PLAN.rows.length.toLocaleString('pt-BR')}</b> linhas em “${esc(PLAN.nome)}”. Confira as colunas:</div><div class="map">${CAMPOS.map(([k,n])=>`<label>${n}</label><select onchange="PLAN.map.${k}=+this.value"><option value="-1">— não tem —</option>${PLAN.cab.map((h,i)=>`<option value="${i}" ${PLAN.map[k]===i?'selected':''}>${esc(h)}</option>`).join('')}</select>`).join('')}</div>
  <div class="sub">Exemplo: ${esc(PLAN.rows.slice(0,2).map(r=>(r[PLAN.map.nome]||'')+' · '+(r[PLAN.map.cidade]||'')).join('  |  '))}</div>
  <div class="row" style="margin-top:10px"><button class="btn p" id="bimp" onclick="impPlan(this)">Importar ${PLAN.rows.length.toLocaleString('pt-BR')} linhas</button><span class="sub" id="pg"></span></div><div class="bar"><i id="pgb"></i></div>`;}
async function impPlan(b){if(PLAN.map.nome<0){alert('Escolha a coluna da empresa.');return;}b.disabled=true;const T=PLAN.rows.length,tam=400;let novos=0,dup=0,ign=0;
  try{for(let i=0;i<T;i+=tam){const rows=PLAN.rows.slice(i,i+tam).map(r=>{const o={};CAMPOS.forEach(([k])=>{const j=PLAN.map[k];o[k]=j>=0?String(r[j]??'').trim():'';});return o;});
    const r=(await api({acao:'importar_linhas',rows})).r;novos+=r.novos;dup+=r.duplicados;ign+=r.ignorados;$('#pg').textContent=Math.min(T,i+tam).toLocaleString('pt-BR')+' de '+T.toLocaleString('pt-BR');$('#pgb').style.width=(Math.min(T,i+tam)/T*100)+'%';}
    LOG=`✅ ${novos.toLocaleString('pt-BR')} novos, ${dup.toLocaleString('pt-BR')} repetidos, ${ign.toLocaleString('pt-BR')} ignorados. Agora filtre em “Leads” (UF, segmento, nota) e crie um lote.`;PLAN=null;TAB='funil';}
  catch(e){LOG='⚠️ parou no meio: '+e.message+' (o que já entrou fica; pode subir de novo, os repetidos são ignorados)';}await carrega();}
function desc(b){run(b,'Pesquisando…',async()=>{const r=(await api({acao:'descobrir',consulta:$('#dq').value,quantos:+$('#dn').value})).r;LOG=`🔎 ${r.novos} empresa(s) nova(s)${r.duplicados?`, ${r.duplicados} já existiam`:''}. Sites lidos — veja em Leads.`;TAB='funil';});}
function imp(b){run(b,'Lendo…',async()=>{const linhas=$('#lin').value.split(/\n/).map(l=>l.split(/;|\t/).map(x=>x.trim()));const rows=linhas.filter(c=>c[0]).map(c=>({nome:c[0],site:c[1]||'',cidade:c[2]||'',segmento:c[3]||'',contato:c[4]||'',email:(c.find(x=>/@/.test(x))||''),zap:(c.slice(2).find(x=>/^\+?[\d\s().-]{10,}$/.test(x))||'')}));
  const r=(await api({acao:'importar_linhas',rows})).r;const e=await api({acao:'enriquecer'});LOG=`✅ ${r.novos} novos${r.duplicados?`, ${r.duplicados} já existiam`:''}. Li o site de ${e.feitos}.`;TAB='funil';});}
function abord(b){run(b,'Escrevendo…',async()=>{await api({acao:'enriquecer'});const r=(await api({acao:'escrever_lote',canal:$('#cn').value,quantos:+$('#qt').value,oferta:$('#of').value})).feitos;const ok=r.filter(x=>x.ok).length;
  LOG=`✍️ ${ok} rascunho(s) na Caixa de saída.`+r.filter(x=>!x.ok).map(x=>`\n• ${x.lead}: ${x.erro}`).join('');TAB='caixa';});}
function cad(){run($('.row .btn.s'),'Vendo…',async()=>{const r=(await api({acao:'cadencia'})).feitos;LOG=r.length?`${r.filter(x=>x.ok).length} follow-up(s) escritos — veja a Caixa de saída.`:'Ninguém pede follow-up agora.';});}
async function ed(id,d){try{await api({acao:'editar',conversa:id,...d});}catch(e){alert(e.message);}}
function env(id,b){run(b,'Enviando…',async()=>{const r=(await api({acao:'enviar',conversa:id})).r[0];LOG=r.ok?'📤 Enviada.':'⚠️ '+r.erro;});}
function envTodos(b){run(b,'Enviando…',async()=>{const r=(await api({acao:'enviar',ids:CAIXA.map(x=>x.id)})).r;LOG=`📤 ${r.filter(x=>x.ok).length} enviada(s).`+r.filter(x=>!x.ok).map(x=>'\n• '+x.erro).join('');});}
async function rej(id){await api({acao:'rejeitar',conversa:id});await carrega();}
// ---- ficha do lead
async function abre(id){$('#dr').style.display='block';$('#drc').innerHTML='<div class="msg">…</div>';await ficha(id);}
function fecha(){$('#dr').style.display='none';carrega();}
async function ficha(id){const d=await api({acao:'ver',id}),l=d.lead,s=l.sinais||{};
  const tags=Object.entries(s).filter(([k,v])=>v&&SINAL[k]).map(([k])=>`<span class="tag">${SINAL[k]}</span>`).join('')+(s.TECNOLOGIA?`<span class="tag">${esc(s.TECNOLOGIA)}</span>`:'')+(s.INSTAGRAM?`<span class="tag">${esc(s.INSTAGRAM)}</span>`:'')+(s.AGENCIA_ATUAL?`<span class="tag">site por ${esc(s.AGENCIA_ATUAL)}</span>`:'');
  $('#drc').innerHTML=`<div class="row" style="justify-content:space-between"><h1 style="font-size:21px">${esc(l.nome)}</h1><button class="btn s" onclick="fecha()">Fechar</button></div>
  <div class="sub">${esc([l.cidade,l.segmento].filter(Boolean).join(' · '))} ${l.site?`· <a href="https://${esc(l.dominio)}" target="_blank" rel="noopener">${esc(l.dominio)}</a>`:''}</div>
  <div style="margin:10px 0"><span class="tag">nota ${l.nota??'–'}</span><span class="tag">${l.estagio}</span>${tags}</div>
  ${l.angulo?`<div class="card"><small class="sub">Ângulo</small><br>${esc(l.angulo)}</div>`:''}
  <div class="row"><select id="mv">${ESTS.map(e=>`<option ${e===l.estagio?'selected':''}>${e}</option>`).join('')}</select><button class="btn s" onclick="mover('${id}')">Mover</button><button class="btn s" onclick="enr('${id}',this)">Reler o site</button><button class="btn s" onclick="esc1('${id}','email',this)">Escrever e-mail</button><button class="btn s" onclick="esc1('${id}','zap',this)">Escrever zap</button><button class="btn s" onclick="ganhou('${id}')">Ganhou → virar cliente</button></div>
  <div style="margin:14px 0 6px"><b>Contatos</b></div>${d.contatos.map(c=>`<div class="sub">${esc(c.nome)}${c.cargo?' ('+esc(c.cargo)+')':''} · ${esc(c.email||'')} ${esc(c.zap||'')} ${c.opt_out?'· <b style="color:var(--bad)">pediu pra sair</b>':''}</div>`).join('')||'<div class="sub">nenhum</div>'}
  <div class="row" style="margin-top:6px"><input id="cn_" placeholder="Nome" style="width:120px"><input id="ce_" placeholder="e-mail" style="width:170px"><input id="cz_" placeholder="zap" style="width:120px"><button class="btn s" onclick="addC('${id}')">Adicionar</button></div>
  <div style="margin:16px 0 6px"><b>Conversa</b></div>${d.conversas.map(c=>`<div class="bub ${c.direcao==='entrada'?'e':'s'}">${c.assunto?'<b>'+esc(c.assunto)+'</b><br>':''}${esc(c.corpo)}<small>${c.canal} · ${c.status}${c.intencao?' · '+c.intencao:''} · ${new Date(c.created_at).toLocaleString('pt-BR')}</small></div>`).join('')||'<div class="sub">sem mensagens</div>'}
  <div style="margin:14px 0 6px"><b>Ele(a) respondeu?</b> <span class="sub">cole aqui — a IA classifica e prepara a resposta</span></div><textarea id="rp" rows="3"></textarea>
  <div class="row" style="margin-top:6px"><select id="rc"><option value="email">e-mail</option><option value="zap">zap</option><option value="dm">DM</option></select><button class="btn p s" onclick="resp('${id}',this)">Registrar resposta</button></div><div class="log" id="dl"></div>`;}
async function mover(id){const e=$('#mv').value;let motivo='';if(e==='perdido')motivo=prompt('Motivo (opcional)')||'';await api({acao:'mover',id,estagio:e,motivo});await ficha(id);}
async function enr(id,b){b.disabled=true;b.textContent='Lendo…';await api({acao:'enriquecer',id});await ficha(id);}
async function esc1(id,canal,b){b.disabled=true;b.textContent='Escrevendo…';try{await api({acao:'escrever',id,canal,seq:1+(await api({acao:'ver',id})).conversas.filter(c=>c.direcao==='saida'&&c.status==='enviada').length});$('#dl')&&0;TAB='caixa';alert('Rascunho na Caixa de saída.');}catch(e){alert(e.message);}fecha();}
async function addC(id){await api({acao:'contato',id,nome:$('#cn_').value,email:$('#ce_').value,zap:$('#cz_').value}).catch(e=>alert(e.message));await ficha(id);}
async function resp(id,b){const t=$('#rp').value.trim();if(!t)return;b.disabled=true;try{const r=(await api({acao:'entrada',id,texto:t,canal:$('#rc').value})).r;$('#dl').textContent='Classifiquei como: '+r.intencao+(r.rascunho?' — rascunho de resposta na Caixa de saída.':'');}catch(e){$('#dl').textContent='⚠️ '+e.message;}b.disabled=false;setTimeout(()=>ficha(id),900);}
async function ganhou(id){if(!confirm('Marcar como ganho e criar o cliente?'))return;try{await api({acao:'ganhou',id});}catch(e){alert(e.message);}await ficha(id);}
boot();
</script></body></html>
