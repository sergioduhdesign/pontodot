  if (Math.hypot(eu.vx, eu.vy) > 3) { const nx = eu.x + eu.vx * dt, ny = eu.y + eu.vy * dt; let andou = false;
    if (podeIr(eu, nx, eu.y)) { eu.x = nx; andou = true; } else eu.vx = 0; if (podeIr(eu, eu.x, ny)) { eu.y = ny; andou = true; } else eu.vy = 0;
    if (!andou && m) { const px = -dy / m, py = dx / m; for (const k of [3, -3, 6, -6]) { const qx = eu.x + px * k + dx / m * 2, qy = eu.y + py * k + dy / m * 2; if (podeIr(eu, qx, qy)) { eu.x += px * Math.sign(k) * 40 * dt; eu.y += py * Math.sign(k) * 40 * dt; andou = true; break; } } }     // esbarrou numa quina: escorrega para o lado livre
    eu.anda = andou; if (m) eu.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 2 : 3) : (dy < 0 ? 1 : 0); if (!andou) eu.alvo = null; }
  // portas
  if (t > trocaAte && !trocando) {
    if (CENA === 'bairro') { for (const L of LUG) { if (!L.porta) continue; const s = soleira(L), d = dist(eu.x, eu.y, s[0], s[1]);
        if (L.trava) { if (d > 42) L.trava = false; L.emp = 0; continue; }             // acabei de sair por aqui: só rearma quando eu me afastar
        if (m && d < 28 && (dx * L.dv[0] + dy * L.dv[1]) > .6 * m) { L.emp = (L.emp || 0) + dt; if (L.emp > .35) { L.emp = 0; pilha.length = 0; vai(L.id, null, null, t); break; } } else L.emp = 0; } }
    else if (CENA === 'regiao') { /* a volta é pelo cais */ }
    else if (eu.y > C.h - 7 && dy > .5 * m) { eu.emp = (eu.emp || 0) + dt; if (eu.emp > .3) { eu.emp = 0; sairPara(t); } }
    else if (CENA === 'escola' && dist(eu.x, eu.y, ...perto(C, C.w * PORTAL.de[0], C.h * PORTAL.de[1])) < 12) vai('escritorio', null, null, t);
  }
  if (canal && eu.anda && t - enviadoEm > 110) { enviadoEm = t; try { canal.send({ type:'broadcast', event:'p', payload:{ i: eu.id, x: Math.round(eu.x), y: Math.round(eu.y), r: CENA, d: eu.dir } }); } catch(_){} }
  if (canal && pronto && t - rastroEm > 6000) { rastroEm = t; try { canal.track(meuRastro()); } catch(_){} }
  outros.forEach(o => { const ax = o.tx - o.x, ay = o.ty - o.y, d = Math.hypot(ax, ay); o.anda = d > 1; if (d > 120) { o.x = o.tx; o.y = o.ty; } else if (o.anda) { const v = Math.min(d, 70 * dt); o.x += ax / d * v; o.y += ay / d * v; } });
  // IAs visíveis nesta cena
  const vis = [];
  npcs.forEach(n => { posIA(n, agora); n.v = null;
    if (n.guia) { passoGuia(n, dt, t); if (n.guia) { if (CENA === 'bairro') vis.push(n.v = n); return; } }
    if (n.segue) { passoSeguir(n, dt); if (n.segue) { vis.push(n.v = n); return; } }
    if (n.onde !== CENA) return;
    if (CENA !== 'bairro') { const p = lugarDentro(n, C); n.x = p[0]; n.y = p[1]; n.dir = 0; }
    vis.push(n.v = n); });
  const gente = [...outros.values()].filter(o => (o.r || 'bairro') === CENA);
  // câmera: aproxima aos poucos, arredonda no pixel lógico, respeita as bordas
  const vw = VW / SC, vh = VH / SC; let tx = Math.max(0, Math.min(C.w - vw, eu.x - vw / 2)), ty = Math.max(0, Math.min(C.h - vh, eu.y - 16 - vh / 2)); if (vw > C.w) tx = (C.w - vw) / 2; if (vh > C.h) ty = (C.h - vh) / 2;
  if (!camPronta) { camX = tx; camY = ty; camPronta = true; } else { camX += (tx - camX) * Math.min(1, dt * 7); camY += (ty - camY) * Math.min(1, dt * 7); }
  const k = SC * DPR, ox = Math.round(camX), oy = Math.round(camY); cx.setTransform(1, 0, 0, 1, 0, 0); cx.imageSmoothingEnabled = false; cx.fillStyle = '#12101c'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.setTransform(k, 0, 0, k, -ox * k, -oy * k); cx.drawImage(C.img, 0, 0);
  if (C.agua) { cx.fillStyle = '#a5e2d6'; for (const p of C.agua) { const s = Math.sin(t * .0018 + p.f * 3); if (s < .38) continue; cx.globalAlpha = Math.min(.38, (s - .38) * .65); cx.fillRect(p.x + Math.round(Math.sin(t * .001 + p.f)), p.y, p.n, 1); } cx.globalAlpha = 1; }
  // estações do lugar (marquinha que pisca)
  const sts = CENA === 'bairro' ? [] : CENA === 'regiao' ? estacoesReg() : estacoes(CENA); sts.forEach(s => { const a = .55 + .45 * Math.sin(t * .005 + s.i); cx.globalAlpha = a; cx.fillStyle = '#ffe27a'; cx.fillRect(s.x - 2, s.y - 7, 4, 4); cx.fillStyle = '#1d1b2a'; cx.fillRect(s.x - 1, s.y - 6, 2, 2); cx.globalAlpha = 1; });
  // quem está mais perto
  let pertoN = null, pd = 26; vis.forEach(n => { const d = dist(n.x, n.y, eu.x, eu.y); if (d < pd) { pd = d; pertoN = n; } });
  if (CENA === 'bairro') { passoBola(dt, [eu, ...vis, ...gente]); desenhaBola(); }
  [...vis, ...gente, eu].sort((a, b) => a.y - b.y).forEach(e => boneco(e, t));
  // textos (em tela)
  camX = ox + (camX - ox); cx.setTransform(DPR, 0, 0, DPR, 0, 0); const cxa = camX, cya = camY; camX = ox; camY = oy;
  if (CENA === 'bairro') LUG.forEach(L => { if (!L.porta) return; const s = soleira(L), d = dist(s[0], s[1], eu.x, eu.y); if (d < 150) etiqueta(L.nome.toUpperCase(), L.porta[0], L.porta[1] - 30, '#1d1b2a', '#fffdf5', 10); if (d < 40 && !L.trava) etiqueta('ENTRAR: SEGURE NA DIREÇÃO DA PORTA', s[0], s[1] + 12, '#ffe27a', '#1d1b2a', 9); });
  else { if (CENA !== 'regiao' && eu.y > C.h - 70) etiqueta('SAÍDA', C.w / 2, C.h - 2, '#ffe27a', '#1d1b2a', 9);
    if (CENA === 'escola') { const p = perto(C, C.w * PORTAL.de[0], C.h * PORTAL.de[1]); if (dist(p[0], p[1], eu.x, eu.y) < 160) etiqueta('ESCRITÓRIO PONTODOT', p[0], p[1] - 16, '#1d1b2a', '#fffdf5', 10); }
    sts.forEach(s => { if (dist(s.x, s.y, eu.x, eu.y) < (CENA === 'regiao' ? 400 : 90)) etiqueta(s.e.rotulo.toUpperCase(), s.x, s.y - 9, 'rgba(29,27,42,.82)', '#ffe27a', 9); }); }
  vis.forEach(n => { etiqueta(n.nome, n.x, n.y - altura(n), n === pertoN ? '#ffe27a' : 'rgba(29,27,42,.78)', n === pertoN ? '#1d1b2a' : '#fff', 9); if (n.fala && agora - n.falaEm < 9000) balao(n.fala.length > 64 ? n.fala.slice(0, 62) + '…' : n.fala, n.x, n.y - altura(n) - 6); });
  gente.forEach(o => { etiqueta(o.nome, o.x, o.y - altura(o), '#fffdf5', '#1d1b2a', 9); if (o.fala && agora - o.falaEm < 6000) balao(o.fala, o.x, o.y - altura(o) - 6); });
  etiqueta(eu.nome, eu.x, eu.y - altura(eu), '#ffe27a', '#1d1b2a', 9); if (eu.fala && agora - eu.falaEm < 6000) balao(eu.fala, eu.x, eu.y - altura(eu) - 6);
  camX = cxa; camY = cya;
  // cartão: IA do lado, ou a estação em que parei
  if (eu.anda) eu.parouEm = t;
  if (pertoN && (pertoN.guia || pertoN.segue) && t - (eu.parouEm || 0) < 1500) pertoN = null;
  if (pertoN && cardFechado !== pertoN.id) pertoN.preso = Math.max(pertoN.preso || 0, agora + 1200);
  let st = null; if (!pertoN) { let sd = CENA === 'regiao' ? 26 : 18; sts.forEach(s => { const d = dist(s.x, s.y, eu.x, eu.y); if (d < sd) { sd = d; st = s; } }); }
  if (pertoN) abreCard(pertoN); else if (st) (CENA === 'regiao' ? abreRegiao(st) : abreEstacao(st)); else { if (cardDe) fechaCard(false); cardFechado = null; }
  const nome = CENA === 'bairro' ? '' : CENA === 'regiao' ? 'Baía de Catum' : lug(CENA).nome; if (nome !== lugarAtual) { lugarAtual = nome; lugarEl.textContent = nome; lugarEl.classList.toggle('on', !!nome); }
}

/* ---------- ao vivo (Supabase Realtime) ---------- */
let canal = null, pronto = false;
const meuRastro = () => ({ i: eu.id, n: eu.nome, s: CFG.skin || null, c: CFG.corpo, x: Math.round(eu.x), y: Math.round(eu.y), r: CENA });
function conta(){ document.getElementById('gente').textContent = (outros.size + 1) + ' aqui'; }
function liga(){
  canal = sb.channel('catum-v2', { config: { presence: { key: eu.id }, broadcast: { self: false } } });
  canal.on('presence', { event: 'sync' }, () => { const st = canal.presenceState(), vivos = new Set();
    Object.keys(st).forEach(k => { const p = (st[k] || [])[0]; if (!p || p.i === eu.id) return; vivos.add(p.i);
      let o = outros.get(p.i); if (!o) { o = { id: p.i, nome: String(p.n || 'Alguém').slice(0, 18), x: +p.x || 528, y: +p.y || 440, tx: +p.x || 528, ty: +p.y || 440, fala: '', falaEm: 0, anda: false, dir: 0, humano: true, sk: null, r: String(p.r || 'bairro') }; outros.set(p.i, o); }
      if (p.s && typeof p.s === 'object') o.sk = limpaSkin(p.s); o.corpo = NPC_IDS.includes(p.c) ? p.c : 'humano'; if (o.corpo !== 'humano') folha(o.corpo); });
    [...outros.keys()].forEach(id => { if (!vivos.has(id)) outros.delete(id); }); conta(); });
  canal.on('broadcast', { event: 'p' }, ({ payload: p }) => { const o = outros.get(p && p.i); if (o && isFinite(p.x) && isFinite(p.y)) { const r = String(p.r || 'bairro'); o.tx = Math.max(0, Math.min(2000, +p.x)); o.ty = Math.max(0, Math.min(1400, +p.y)); if ([0, 1, 2, 3].includes(p.d)) o.dir = p.d; if (r !== o.r) { o.r = r; o.x = o.tx; o.y = o.ty; } } });
  canal.on('broadcast', { event: 'f' }, ({ payload: p }) => { const o = outros.get(p && p.i); if (o) { o.fala = String(p.t || '').slice(0, 90); o.falaEm = Date.now(); if ((o.r || 'bairro') === CENA && dist(o.x, o.y, eu.x, eu.y) < 160) vozinha(o.id, o.fala); } });
  canal.subscribe(st => { if (st === 'SUBSCRIBED') { pronto = true; canal.track(meuRastro()); } });
}

/* ---------- começo ---------- */
async function comeca(){
  const porta = document.getElementById('porta'), ptxt = document.getElementById('portaTxt');
  let sess = null; try { sess = (await sb.auth.getSession()).data.session; } catch(_){}
  if (!sess) { ptxt.innerHTML = 'Catum &eacute; para quem j&aacute; est&aacute; na PD. <a href="/index.html">Entre na PD</a> e volte aqui.'; return; }
  eu.id = sess.user.id;
  try { const { data } = await sb.from('profiles').select('name,avatar_url').eq('id', eu.id).maybeSingle(); if (data) { eu.nome = String(data.name || 'Você').split(' ')[0].slice(0, 14); eu.av = data.avatar_url || ''; } } catch(_){}
  ajusta();
  try { const [b, pf, mi] = await Promise.all([cena('bairro'), fetch(ARTE + 'perfis.json' + VA).then(r => r.json()), fetch(ARTE + 'cenas-e-missoes.json' + VA).then(r => r.json()).catch(() => null), carregaCfg()]);
    PERF = pf || {}; MIS = mi; C = b; const p = perto(b, 528 + (hash(eu.id) % 40) - 20, 440); eu.x = p[0]; eu.y = p[1];
  } catch(e) { ptxt.textContent = 'Não consegui abrir a cidade. Atualize a página.'; console.warn(e); return; }
  NPC_IDS.forEach(folha); folhaHumana(CFG.skin); carregaProg(); document.getElementById('btDia').onclick = abreDiario;
  fetch('/pd/universo.json').then(r => r.ok ? r.json() : null).then(u => { if (!u) return; npcs.forEach(n => { const c = (u.characters || []).find(x => x.id === n.id); if (c) { n.c = c; n.nome = c.name || n.nome; } }); }).catch(() => {});
  carregaEscola(); setInterval(() => { if (!document.hidden) carregaEscola(); }, 300000);
  try { liga(); } catch(e){ console.warn('ao vivo fora:', e); }
  porta.style.opacity = 0; setTimeout(() => porta.remove(), 450);
  requestAnimationFrame(quadro); abertura(false);
}
window.CATUM = { eu, LUG, npcs, bola, vai, estacoes, get cena(){ return CENA; }, get trocando(){ return trocando; }, get prog(){ return PROG; }, get som(){ return { ac: AC && AC.state, tocando: TEMA.ativo, i: TEMA.i }; } };
comeca();
})();
