<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aprovação — Pontodot</title>
<link rel="icon" href="/assets/icon-pwa.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/css/main.css">
<style>
/* ==================================================================
   APROVAÇÃO — estética SD
   Preto e branco, muito espaço, caixas de canto arredondado.
   A estrutura de informação vem do painel que o Juan montou; a
   linguagem visual é a da SD, não a do cliente.
   ================================================================== */

body{background:var(--bg);color:var(--text);padding-bottom:80px}
/* Dentro do popup da tarefa o cabeçalho grande é redundante:
   o próprio popup já mostra cliente e projeto. */
body.embed .ap-top{display:none}
body.embed .ap-bar{border-top:none}
body.embed .ap-board{padding-top:16px}

/* ---------- Topo ---------- */
.ap-top{
  background:var(--accent);color:var(--accent-fg);
  padding:26px clamp(16px,4vw,44px) 22px;
}
.ap-top-inner{max-width:1400px;margin:0 auto}
.ap-eyebrow{
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  opacity:.55;font-weight:700;margin-bottom:8px
}
.ap-title{font-size:clamp(21px,3vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.ap-sub{font-size:13.5px;opacity:.6;margin-top:6px;max-width:620px;line-height:1.5}

.ap-progress{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.ap-track{
  flex:1;min-width:160px;max-width:380px;height:6px;
  background:rgba(128,128,128,.28);border-radius:20px;overflow:hidden
}
.ap-fill{height:100%;background:var(--accent-fg);width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}
.ap-count{font-size:12.5px;opacity:.75;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- Filtros ---------- */
.ap-bar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px clamp(16px,4vw,44px);
  background:var(--surface);border-bottom:1px solid var(--border);
}
.ap-chip{
  border:1px solid var(--border);background:transparent;color:var(--text2);
  padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:600;
  cursor:pointer;transition:var(--transition);font-family:inherit
}
.ap-chip:hover{border-color:var(--text3);color:var(--text)}
.ap-chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ap-chip[data-f="ajustar"].on{background:#db2777;border-color:#db2777;color:#fff}
.ap-chip .n{opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}


/* ---------- celular: filtro num seletor só + ações num menu ⋯ ---------- */
.ap-sel,.ap-mais,.ap-mais-pop{display:none}
@media(max-width:700px){
  .ap-bar{flex-wrap:nowrap;gap:8px;padding:8px 12px}
  .ap-chip{display:none}
  .ap-sel{display:block;flex:1;min-width:0;height:38px;border:1px solid var(--border);border-radius:20px;background:var(--surface2,transparent);color:var(--text);font:inherit;font-size:13.5px;font-weight:600;padding:0 14px}
  .ap-bar #btnAgendar,.ap-bar #btnTudo{margin-left:0!important;white-space:nowrap;padding:8px 14px!important;font-size:12.5px!important;flex:0 0 auto}
  .ap-mais{display:grid!important;place-items:center;flex:0 0 38px;width:38px;height:38px;border:1px solid var(--border);border-radius:50%;background:transparent;color:var(--text);font-size:20px;line-height:1;cursor:pointer;margin-left:0;order:99}
  .ap-mais-pop{position:fixed;right:12px;top:var(--ap-pop-top,110px);z-index:60;flex-direction:column;gap:6px;padding:10px;min-width:220px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
  .ap-mais-pop.on{display:flex}
  .ap-mais-pop>button{width:100%;margin:0!important;justify-content:flex-start;text-align:left;border-radius:10px!important}
}

/* ---------- Board ---------- */
.ap-board{padding:24px clamp(16px,4vw,44px) 60px;max-width:1400px;margin:0 auto}
.ap-cols{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding-bottom:12px}
.ap-col{flex:0 0 336px;width:336px;display:flex;flex-direction:column;gap:14px}
.ap-col-head{padding:0 2px 8px;border-bottom:2px solid var(--accent)}
.ap-col-head h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.ap-col-head .theme{font-size:11.5px;color:var(--text3);margin-top:3px;line-height:1.4}

/* Galeria: grade em vez de colunas */
.ap-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

/* ---------- Card ---------- */
.ap-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);overflow:hidden;transition:var(--transition)
}
.ap-card.hide{display:none}
.ap-card[data-status="aprovado"]{border-color:#16a34a}
.ap-card[data-status="ajustar"]{border-color:#db2777;box-shadow:0 0 0 3px rgba(219,39,119,.10)}

.ap-card-top{padding:14px 16px 10px;border-left:3px solid var(--text3)}
.ap-card[data-status="aprovado"] .ap-card-top{border-left-color:#16a34a}
.ap-card[data-status="ajustar"]  .ap-card-top{border-left-color:#db2777}

.ap-tags{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ap-kind{
  font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  padding:3px 9px;border-radius:20px;background:var(--accent);color:var(--accent-fg)
}
.ap-badge{
  font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;
  background:var(--surface2);color:var(--text3)
}
.ap-badge.aprovado{background:rgba(22,163,74,.12);color:#16a34a}
.ap-badge.ajustar{background:#db2777;color:#fff}
.ap-card-title{font-size:13.5px;font-weight:700;line-height:1.3;letter-spacing:-.01em}

/* ---------- Mídia ---------- */
.ap-media{position:relative;background:var(--surface2);line-height:0}
.ap-media img{width:100%;height:auto;display:block;cursor:zoom-in}
.ap-media video{width:100%;height:auto;display:block;background:#0b0b0d}
.ap-media .n{
  position:absolute;top:10px;right:10px;background:rgba(10,10,10,.72);color:#fff;
  font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:700;line-height:1.4
}
.ap-strip{display:flex;gap:4px;padding:6px;background:var(--surface2);overflow-x:auto}
.ap-strip img{
  width:44px;height:44px;object-fit:cover;border-radius:5px;cursor:pointer;background:#0b0b0d;
  border:2px solid transparent;opacity:.5;flex:0 0 auto;transition:var(--transition)
}
.ap-strip img.on{opacity:1;border-color:var(--accent)}

/* ---------- Corpo ---------- */
.ap-body{padding:12px 16px 4px}
.ap-headline{
  font-size:12.5px;font-weight:700;white-space:pre-line;line-height:1.35;
  margin-bottom:8px;letter-spacing:-.01em
}
.ap-note{font-size:11.5px;color:var(--text3);line-height:1.45;margin-bottom:8px}
details.ap-cap{margin-bottom:8px}
details.ap-cap summary{
  font-size:11.5px;font-weight:700;color:var(--text2);cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:5px;padding:3px 0
}
details.ap-cap summary::-webkit-details-marker{display:none}
details.ap-cap summary::before{content:"▸";font-size:9px;transition:var(--transition)}
details.ap-cap[open] summary::before{content:"▾"}
.ap-cap-text{font-size:12.5px;line-height:1.6;white-space:pre-line;padding:8px 0 2px;color:var(--text2)}
.ap-hash{font-size:11.5px;color:var(--text3);word-break:break-word;padding-bottom:6px}

.ap-sb{font-size:11.5px;padding:2px 0 6px}
.ap-sb .sc{padding:7px 0;border-top:1px dashed var(--border)}
.ap-sb .sc:first-child{border-top:none}
.ap-sb .sc b{font-weight:700}
.ap-sb .sc .d{color:var(--text3)}
.ap-sb .sc .t{font-style:italic;margin-top:3px;color:var(--text2)}

/* ---------- Zona de decisão ---------- */
.ap-zone{border-top:1px solid var(--border);padding:12px 16px 14px;background:var(--surface2)}
.ap-lab{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:5px}
.ap-tip{font-size:11px;color:var(--text3);line-height:1.45;margin-top:7px}

/* ---------- Modo edição (só equipe) ---------- */
.ed-zone{border-top:1px solid var(--border);padding:12px 16px 14px;background:var(--surface)}
.ed-f{margin-bottom:9px}
.ed-f label{display:block;font-size:10.5px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.ed-f input,.ed-f textarea{width:100%;padding:8px 10px;border:1px solid var(--border);
  border-radius:8px;background:var(--surface2);color:var(--text);font-size:12.5px;
  font-family:inherit;line-height:1.5}
.ed-f input:focus,.ed-f textarea:focus{outline:none;border-color:var(--text3)}
.ed-f textarea{resize:vertical;min-height:60px}
.ed-drop{border:1.5px dashed var(--border2);border-radius:8px;padding:14px;text-align:center;
  cursor:pointer;font-size:12px;color:var(--text3);transition:var(--transition);background:var(--surface2)}
.ed-drop:hover,.ed-drop.over{border-color:var(--accent);color:var(--text)}
.ed-arts{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.ed-art{position:relative;width:52px;height:52px}
.ed-art img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.ed-art button{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;
  border:none;background:#db2777;color:#fff;font-size:10px;cursor:pointer;line-height:1;padding:0}
.ed-save{background:var(--accent);color:var(--accent-fg);border:none;padding:9px 18px;
  border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
.ed-save:disabled{opacity:.5;cursor:default}
.ed-toggle{background:none;border:1px solid var(--border);color:var(--text2);padding:6px 12px;
  border-radius:20px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
.ed-toggle:hover{border-color:var(--text3);color:var(--text)}
.ap-btns{display:flex;gap:8px;margin-bottom:9px}
.ap-btn{
  flex:1;border:1px solid var(--border);background:var(--surface);color:var(--text2);
  padding:9px 6px;font-size:12px;font-weight:700;border-radius:9px;cursor:pointer;
  transition:var(--transition);font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:5px
}
.ap-btn:hover{border-color:var(--text3);color:var(--text)}
.ap-btn.ok.on{background:#16a34a;border-color:#16a34a;color:#fff}
.ap-btn.fix.on{background:#db2777;border-color:#db2777;color:#fff;
  box-shadow:0 0 0 3px rgba(219,39,119,.18)}
.ap-btn:disabled{opacity:.5;cursor:default}

/* Já decidido: o botão vira estado, não ação */
.ap-btn.travado{background:#d97706;border-color:#d97706;color:#fff;cursor:default;opacity:1}
.ap-btn.travado:hover{border-color:#d97706}
.ap-btn.rever{background:transparent;border-color:var(--border2);color:var(--text3);font-weight:600}
.ap-btn.rever:hover{border-color:var(--text3);color:var(--text2)}

/* Aviso antes de reabrir algo aprovado */
.ap-warn{position:fixed;inset:0;z-index:99500;display:flex;align-items:center;
  justify-content:center;padding:24px;background:rgba(10,10,12,.6);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ap-warn-box{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);max-width:420px;width:100%;padding:26px 26px 22px;
  box-shadow:0 24px 60px rgba(0,0,0,.4)}
.ap-warn-box h3{font-size:16px;font-weight:700;margin-bottom:10px;letter-spacing:-.01em}
.ap-warn-box p{font-size:13.5px;color:var(--text2);line-height:1.6;margin-bottom:20px}
.ap-warn-acts{display:flex;gap:8px}
.ap-warn-acts button{flex:1;height:40px;border-radius:9px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;border:1px solid var(--border)}
.ap-warn-acts .no{background:transparent;color:var(--text2)}
.ap-warn-acts .no:hover{border-color:var(--text3);color:var(--text)}
.ap-warn-acts .yes{background:#db2777;border-color:#db2777;color:#fff}
.ap-warn-acts .yes:hover{opacity:.88}

.ap-ta{
  width:100%;resize:vertical;min-height:54px;border:1px solid var(--border);
  border-radius:9px;padding:9px 10px;font-size:12.5px;font-family:inherit;
  color:var(--text);background:var(--surface);line-height:1.5
}
.ap-ta:focus{outline:none;border-color:var(--text3)}
.ap-send{
  background:var(--accent);color:var(--accent-fg);border:none;padding:7px 16px;
  font-size:12px;font-weight:700;border-radius:9px;cursor:pointer;font-family:inherit
}
.ap-send:hover{opacity:.85}
.ap-row{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:8px}
.ap-when{font-size:10.5px;color:var(--text3)}

/* ---------- Conversa ---------- */
.ap-talk{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.ap-msg{font-size:12px;line-height:1.5;padding:8px 10px;border-radius:9px;background:var(--surface)}
.ap-msg.cli{background:rgba(219,39,119,.07);border-left:2px solid #db2777}
.ap-msg .who{font-weight:700;font-size:11px;margin-bottom:2px}
.ap-msg .when{font-size:10px;color:var(--text3);margin-left:6px;font-weight:400}

/* ---------- Lightbox ---------- */
.ap-lb{
  position:fixed;inset:0;background:rgba(8,8,10,.94);z-index:9999;
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px
}
.ap-lb.on{display:flex}
.ap-lb img,.ap-lb video{max-width:min(92vw,760px);max-height:76vh;border-radius:9px;object-fit:contain}
.ap-lb-nav{display:flex;gap:22px;align-items:center}
.ap-lb button{
  background:rgba(255,255,255,.13);color:#fff;border:none;width:40px;height:40px;
  border-radius:50%;font-size:18px;cursor:pointer;transition:var(--transition)
}
.ap-lb button:hover{background:rgba(255,255,255,.26)}
.ap-lb-x{position:absolute;top:20px;right:24px}
.ap-lb-cap{color:rgba(255,255,255,.68);font-size:12px;text-align:center;max-width:600px}

/* ---------- Estados ---------- */
.ap-empty{text-align:center;padding:80px 24px;color:var(--text3)}
.ap-empty .ic{font-size:38px;opacity:.35;margin-bottom:14px}
.ap-empty h3{font-size:17px;font-weight:700;color:var(--text);margin-bottom:7px}
.ap-empty p{font-size:13.5px;max-width:340px;margin:0 auto;line-height:1.55}
.ap-load{text-align:center;padding:70px 24px;color:var(--text3);font-size:13.5px}

/* ---------- Ferramentas da equipe ---------- */
.ap-tool{background:transparent;color:var(--text2);border:1px solid var(--border);padding:7px 13px;
  border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:var(--transition)}
.ap-tool:hover{border-color:var(--text3);color:var(--text)}
.ap-tool:disabled{opacity:.5;cursor:default}
#btnIA{margin-left:auto}
#btnCorr{margin-left:auto}
#btnIA[style*="block"] + #btnCorr{margin-left:0}
.ap-ver{font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:6px;
  background:var(--surface2);color:var(--text2);border:1px solid var(--border);margin-right:6px}

/* Comentário do cliente em dois campos */
.ap-lab2{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.07em;margin:8px 0 4px}
.ap-lab2:first-of-type{margin-top:0}

/* Troca de arte no lugar */
.ed-art .sw{position:absolute;left:-5px;bottom:-5px;width:19px;height:19px;border-radius:50%;
  border:none;background:var(--accent);color:var(--accent-fg);font-size:11px;cursor:pointer;
  line-height:1;padding:0;top:auto;right:auto}
.ed-art.trocada img{outline:2px solid #16a34a;outline-offset:1px}
.ed-art .num{position:absolute;top:2px;left:3px;font-size:9px;font-weight:800;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.8)}
.ed-hist{margin-top:6px;font-size:11px}
.ed-hist button{background:none;border:none;color:var(--text3);font:inherit;font-weight:700;
  cursor:pointer;padding:0;text-decoration:underline}
.ed-hist .v{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
.ed-hist .v b{font-size:10.5px;min-width:76px;color:var(--text2)}
.ed-hist .v img{width:34px;height:34px;object-fit:cover;border-radius:5px;cursor:zoom-in;border:1px solid var(--border)}

/* ---------- Revisão interna ---------- */
.ap-interno{max-width:1400px;margin:16px auto 0;padding:0 clamp(16px,4vw,44px)}
.ap-interno > div{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:13px 16px;border-radius:var(--radius);
  border:1.5px dashed #7c3aed;background:rgba(124,58,237,.06)}
.ap-interno b{font-size:13.5px;color:#6d28d9;display:block}
.ap-interno span{font-size:12px;color:var(--text3);line-height:1.5}
.ap-msg.int{background:rgba(124,58,237,.07);border-left:2px dashed #7c3aed}
.ap-lib{background:#16a34a;color:#fff;border:none;padding:9px 16px;border-radius:7px;font-weight:700;
  font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}

/* ---------- Subir correções (modal) ---------- */
.cz-ov{position:fixed;inset:0;z-index:99400;background:rgba(10,10,12,.6);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;
  padding:clamp(10px,4vh,40px) 14px;overflow-y:auto}
.cz-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  width:100%;max-width:880px;box-shadow:0 24px 60px rgba(0,0,0,.4);overflow:hidden}
.cz-head{padding:20px 22px 14px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.cz-head h3{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.cz-head p{font-size:12.5px;color:var(--text3);line-height:1.5}
.cz-x{margin-left:auto;background:none;border:1px solid var(--border);color:var(--text2);width:32px;height:32px;
  border-radius:7px;cursor:pointer;font-size:14px;flex-shrink:0}
.cz-body{padding:18px 22px}
.cz-drop{border:1.5px dashed var(--border2);border-radius:var(--radius-lg);padding:30px 20px;text-align:center;
  cursor:pointer;background:var(--surface2);transition:var(--transition)}
.cz-drop:hover,.cz-drop.over{border-color:var(--accent);background:var(--surface3)}
.cz-drop b{display:block;font-size:14px;margin-bottom:5px}
.cz-drop small{font-size:12px;color:var(--text3);line-height:1.55;display:block}
.cz-modo{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.cz-modo label{flex:1;min-width:220px;display:flex;gap:9px;align-items:flex-start;padding:11px 12px;
  border:1.5px solid var(--border);border-radius:9px;cursor:pointer;font-size:12.5px;line-height:1.45}
.cz-modo label.on{border-color:var(--accent);background:var(--surface2)}
.cz-modo label small{display:block;color:var(--text3);font-size:11.5px;margin-top:2px}
.cz-st{font-size:12.5px;color:var(--text3);margin:12px 0 0;line-height:1.5}
.cz-row{border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:10px;background:var(--surface2)}
.cz-row.off{opacity:.5}
.cz-row .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.cz-row .hd .nm{font-size:13px;font-weight:700;flex:1;min-width:140px;word-break:break-word}
.cz-row .hd .src{font-size:11px;color:var(--text3);font-weight:400;display:block;margin-top:2px}
.cz-row select{padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);
  color:var(--text);font:inherit;font-size:12px;max-width:100%}
.cz-cmp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cz-cmp .lado{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.cz-cmp img,.cz-cmp video,.cz-cmp .ph{width:46px;height:46px;object-fit:cover;border-radius:6px;
  border:1px solid var(--border);background:#0b0b0d}
.cz-cmp .ph{display:flex;align-items:center;justify-content:center;font-size:9px;color:#999}
.cz-cmp .novo{outline:2px solid #16a34a;outline-offset:1px}
.cz-cmp .seta{font-size:16px;color:var(--text3);padding:0 2px}
.cz-tx{font-size:11.5px;color:var(--text2);margin-top:8px;line-height:1.5;white-space:pre-line;
  padding:8px 10px;border-radius:7px;background:var(--surface);border-left:3px solid #16a34a}
.cz-tx b{font-size:10px;letter-spacing:.06em;color:var(--text3);display:block;margin-bottom:2px}
.cz-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;
  justify-content:space-between;flex-wrap:wrap;background:var(--surface)}
.cz-foot .info{font-size:12px;color:var(--text3)}
.cz-prog{height:5px;background:var(--surface2);border-radius:7px;overflow:hidden;margin-top:12px;display:none}
.cz-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

@media (max-width:640px){
  .ap-col{flex-basis:84vw;width:84vw}
  .ap-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="ap-top">
  <div class="ap-top-inner">
    <a id="apVoltar" href="#" style="display:none;font-size:12.5px;font-weight:700;color:inherit;opacity:.75;text-decoration:none;margin-bottom:8px">← Voltar</a>
    <p class="ap-eyebrow" id="apEyebrow">Pontodot</p>
    <h1 class="ap-title" id="apTitle">Carregando…</h1>
    <p class="ap-sub" id="apSub"></p>
    <div class="ap-progress">
      <div class="ap-track"><div class="ap-fill" id="apFill"></div></div>
      <div class="ap-count" id="apCount">—</div>
    </div>
  </div>
</div>

<div class="ap-bar">
  <select id="apSel" class="ap-sel" aria-label="Filtrar peças"></select>
  <button class="ap-chip on" data-f="all">Tudo <span class="n" id="nAll"></span></button>
  <button class="ap-chip" data-f="pendente">Pendentes <span class="n" id="nPend"></span></button>
  <button class="ap-chip" data-f="aprovado">Aprovados <span class="n" id="nOk"></span></button>
  <button class="ap-chip" data-f="ajustar">Com ajustes <span class="n" id="nFix"></span></button>
  <button id="btnAgendar" style="display:none;margin-left:auto;background:#16a34a;
    color:#fff;border:none;padding:7px 16px;border-radius:20px;font-size:12.5px;
    font-weight:700;cursor:pointer;font-family:inherit">📤 Agendar aprovadas</button>
  <button id="btnTudo" style="display:none;margin-left:auto;background:#16a34a;color:#fff;border:none;padding:9px 20px;
    border-radius:7px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(22,163,74,.35)">✓ Aprovar tudo</button>
  <button id="btnIA" class="ap-tool" style="display:none" title="Grava o Excel de correções na pasta ENTRADA do Drive e avisa a IA (status CORRIGIR)">⇢ Correções pra IA</button>
  <button id="btnCorr" class="ap-tool" style="display:none" title="Subir artes e textos corrigidos — peça por peça ou o pacote inteiro">⤒ Subir correções</button>
  <button id="btnXls" class="ap-tool" style="display:none" title="Excel no modelo do upload, com as correções do cliente post a post">⤓ Baixar correções (Excel)</button>
  <button id="btnPdf" style="background:transparent;color:var(--text2);
    border:1px solid var(--border);padding:7px 15px;border-radius:20px;font-size:12.5px;
    font-weight:700;cursor:pointer;font-family:inherit">⎙ PDF</button>
  <button id="btnZip" style="display:none;background:var(--accent);
    color:var(--accent-fg);border:none;padding:7px 16px;border-radius:20px;font-size:12.5px;
    font-weight:700;cursor:pointer;font-family:inherit">⤓ Baixar conteúdo</button>
</div>

<button id="apMaisBtn" class="ap-mais" aria-label="Mais ações" style="display:none">⋯</button>
<div id="apMaisPop" class="ap-mais-pop"></div>
<div id="apAviso"></div>

<div class="ap-board" id="apBoard">
  <div class="ap-load">Carregando material…</div>
</div>

<div class="ap-lb" id="apLb">
  <button class="ap-lb-x" onclick="lbClose()">✕</button>
  <video id="apLbVid" controls playsinline style="display:none"></video>
  <img id="apLbImg" src="" alt="">
  <div class="ap-lb-nav">
    <button onclick="lbGo(-1)">‹</button>
    <div class="ap-lb-cap" id="apLbCap"></div>
    <button onclick="lbGo(1)">›</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/js/supabase.js"></script>
<script src="/js/aprovacao-comum.js?v=20"></script>
<script src="/js/briefing-ia.js?v=1"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script>
// ==================================================================
// ESTADO
// ==================================================================
let profile = null, apSet = null, items = [], filter = 'all';
let versoes = {};          // itemId -> [versões anteriores, mais nova primeiro]
let drive = null;          // pasta do Drive da tarefa (task_drive), se houver
let lb = { list: [], i: 0 };

const qs = new URLSearchParams(location.search);
// ROBÔ DO LOTE: a frente abre esta tela escondida quando a IA devolve a
// correção. Ela lê a SAIDA, casa com as peças do lote e aplica — só se
// TODA peça que voltou tiver par certo. Na dúvida, para e chama alguém.
const AUTO = qs.get('auto') === '1' && window.self !== window.top && qs.get('drive') === '1';
let _roboContou = false;
function roboAvisa(r){
  if (!AUTO || _roboContou) return;
  _roboContou = true;
  try { window.parent.postMessage(Object.assign({ pdRobo: true, tipo: 'correcao', set_id: SET_ID }, r), location.origin); } catch(e){}
}
async function roboDecide(){
  if (!AUTO || !cz) return;
  const semPar = cz.entradas.filter(e => e.peca && (!e.alvo || e.alvo === 'novo'));
  if (!cz.entradas.length) return roboAvisa({ ok:false, motivo: document.getElementById('czSt')?.textContent || 'não achei a entrega na SAIDA' });
  if (semPar.length) return roboAvisa({ ok:false, motivo: semPar.length + ' peça(s) da IA sem par no lote (o nome do arquivo mudou?)' });
  const { mudou, novas } = czPlano();
  if (!mudou.length && !novas.length) return roboAvisa({ ok:false, motivo:'a IA entregou, mas nada mudou em relação ao lote' });
  const r = await czAplicar();
  roboAvisa(r ? { ok:true, n: r.ok } : { ok:false, motivo: document.getElementById('czInfo')?.textContent || 'erro ao aplicar' });
}
const SET_ID = qs.get('set');

const esc = s => String(s ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;');

const KIND_LABEL = {
  feed:'Feed', carrossel:'Carrossel', stories:'Stories',
  reels:'Reels', generico:'Material'
};

// ==================================================================
// CARGA
// ==================================================================
// Erro solto vira aviso na tela. Antes só ia para o console e passava
// batido — foi o que aconteceu com o realtime.
window.addEventListener('unhandledrejection', ev => {
  const m = ev.reason?.message || String(ev.reason || '');
  if (!m || m.includes('postgres_changes')) return;
  if (typeof showToast === 'function') showToast('Erro: ' + m, 'error');
});

(async () => {
  Theme.init();
  // Rodando dentro do popup da tarefa? Esconde o cabeçalho repetido.
  if (window.self !== window.top) document.body.classList.add('embed');

  const auth = await Auth.requireAuth(['admin','team','client']);
  if (!auth) return;
  profile = auth.profile;

  if (!SET_ID) { showEmpty('Nenhum lote informado', 'O link está incompleto — falta o código do lote de aprovação.'); return; }

  await load();

  // Equipe fora do popup (aba própria): precisa de um jeito de voltar.
  if (profile.role !== 'client' && window.self === window.top) {
    const v = document.getElementById('apVoltar');
    v.style.display = 'inline-block';
    v.onclick = ev => { ev.preventDefault();
      if (window.opener) { window.close(); return; }
      if (history.length > 1) history.back(); else location.href = '/'; };
  }
  // Vindo do botão "Publicar" da tarefa: já cai na etapa de publicar.
  if (new URLSearchParams(location.search).get('publicar') === '1' && profile.role !== 'client') {
    setTimeout(() => abrirPublicacao(), 400);
  }
})();

async function load(){
  const { data: s, error } = await sb.from('approval_sets').select('*').eq('id', SET_ID).single();
  if (error || !s) {
    showEmpty('Material não encontrado', 'Ele pode ter sido removido, ou este link não é para a sua conta.');
    return;
  }
  apSet = s;

  const { data: cli } = await sb.from('clients').select('name').eq('id', s.client_id).single();

  document.getElementById('apEyebrow').textContent = (cli?.name || 'Pontodot') + ' · Aprovação';
  document.getElementById('apTitle').textContent   = s.title;
  document.getElementById('apSub').textContent     = s.subtitle
    || 'Revise cada peça, deixe seu comentário e marque como aprovada ou peça ajuste. Suas observações chegam direto na equipe.';
  document.title = s.title + ' — Pontodot';

  const { data: it } = await sb.from('approval_items')
    .select('*').eq('set_id', SET_ID).order('position');
  items = it || [];

  const ids = items.map(i => i.id);
  let talk = [];
  if (ids.length) {
    const { data: c } = await sb.from('approval_comments')
      .select('*').in('item_id', ids).order('created_at');
    talk = c || [];
  }
  // Apontamento interno (equipe → IA) nunca aparece pro cliente
  if (profile.role === 'client') talk = talk.filter(c => !AP.ehInterno(c.body));
  items.forEach(i => i._talk = talk.filter(c => c.item_id === i.id));

  if (profile.role !== 'client' && apSet.task_id && drive === null) {
    drive = (await AP.drive.obter(apSet.task_id)) || false;
  }

  // Versões anteriores (só equipe): data da última correção enviada de
  // cada peça. O Excel de correções só traz o que veio DEPOIS dela.
  versoes = {};
  if (profile.role !== 'client' && ids.length) {
    const { data: vs, error: ev } = await sb.from('approval_item_versions')
      .select('id,item_id,version,media,caption,hashtags,created_at,origem')
      .in('item_id', ids).order('version', { ascending:false });
    if (!ev) (vs || []).forEach(v => (versoes[v.item_id] = versoes[v.item_id] || []).push(v));
  }

  render();
  listenLive();

  // Veio do botão "Subir correções" da tarefa: abre direto.
  if (qs.get('corrigir') === '1' && !window._corrAberto && profile.role !== 'client') {
    window._corrAberto = true;
    abrirCorrecoes();
    if (qs.get('drive') === '1') setTimeout(() => document.getElementById('czDrive')?.click(), 150);
  }

  // Veio de uma correção específica: destaca e rola até ela.
  const alvo = location.hash.replace('#item-','');
  if (alvo) setTimeout(() => {
    const c = document.querySelector(`.ap-card[data-id="${alvo}"]`);
    if (c) {
      c.scrollIntoView({behavior:'smooth', block:'center'});
      c.style.transition = 'box-shadow .4s';
      c.style.boxShadow = '0 0 0 4px rgba(219,39,119,.35)';
      setTimeout(() => c.style.boxShadow = '', 2600);
    }
  }, 260);
}

// ==================================================================
// RENDER
// ==================================================================
function render(){
  const board = document.getElementById('apBoard');

  if (!items.length) {
    showEmpty('Nada por aqui ainda', 'A equipe ainda não enviou material neste lote.');
    return;
  }

  const total = items.length;
  const ok    = items.filter(i => i.status === 'aprovado').length;
  const fix   = items.filter(i => i.status === 'ajustar').length;
  const pend  = items.filter(i => i.status === 'pendente').length;

  document.getElementById('apFill').style.width = (total ? (ok/total*100) : 0) + '%';
  document.getElementById('apCount').textContent =
    ok + ' de ' + total + (ok === total ? ' — tudo aprovado' : ' aprovadas');
  document.getElementById('nAll').textContent  = total;
  document.getElementById('nPend').textContent = pend;
  document.getElementById('nOk').textContent   = ok;
  document.getElementById('nFix').textContent  = fix;

  // O download só aparece quando não sobrou nada pendente nem em ajuste:
  // material meio aprovado não é material pronto para soltar.
  const bp = document.getElementById('btnPdf');
  if (bp) bp.onclick = gerarPDF;

  const equipe = profile.role !== 'client';
  const bc = document.getElementById('btnCorr');
  const bx = document.getElementById('btnXls');
  if (bc) { bc.style.display = equipe ? 'block' : 'none'; bc.onclick = abrirCorrecoes; }
  if (bx) { bx.style.display = equipe ? 'block' : 'none'; bx.onclick = baixarExcelCorrecoes; }
  const btT = document.getElementById('btnTudo');
  const faltaInterno = items.filter(i => !i.interno_ok).length;
  if (btT && equipe && apSet.interno) {
    // Revisão interna: o gestor aprova tudo de uma vez (com exceções)
    btT.style.display = faltaInterno ? 'block' : 'none';
    btT.textContent = `✓ Aprovar tudo (${faltaInterno})`;
    btT.onclick = () => AP.aprovarTudo(items, async (id, decision, comment) => {
      if (decision === 'ajustar') {
        const { error } = await sb.from('approval_comments').insert({ item_id: id, author_id: profile.id,
          author_name: profile.name, is_client: false, body: '[INTERNO]\n' + comment });
        if (error) throw error;
        await sb.rpc('set_internal_review', { p_item_ids: [id], p_ok: false });
      } else {
        const { error } = await sb.rpc('set_internal_review', { p_item_ids: [id], p_ok: true });
        if (error) throw error;
      }
    }, async r => {
      await load();
      if (r.falhas) { showToast(`${r.falhas} falharam — rodou a migration_aprovacao_interna.sql?`, 'error'); return; }
      if (r.corrigir) {
        showToast(`${r.aprovadas} aprovada(s), ${r.corrigir} com apontamento. Use "Correções pra IA" pra mandar.`, 'success');
      } else if (confirm('Tudo aprovado internamente. Liberar pro cliente agora?')) {
        liberarCliente(true);
      }
    }, { pendente: i => !i.interno_ok, titulo: 'Aprovar internamente' });
  } else if (btT) {
    btT.style.display = (!equipe && (total - ok) > 0) ? 'block' : 'none';
    btT.textContent = `✓ Aprovar tudo (${total - ok})`;
    if (bp && !equipe) bp.style.marginLeft = btT.style.display === 'none' ? 'auto' : '';
    btT.onclick = () => AP.aprovarTudo(items, async (id, decision, comment) => {
      const { error } = await sb.rpc('review_approval_item', { p_item_id: id, p_decision: decision,
        p_comment: comment || null, p_anchor: null });
      if (error) throw error;
    }, async r => {
      showToast(`${r.aprovadas} aprovada(s)` + (r.corrigir ? `, ${r.corrigir} pra corrigir` : '') + (r.falhas ? ` · ${r.falhas} falharam` : '') + '.',
        r.falhas ? 'warn' : 'success');
      notifyTeam({ pendentes: 0, task: apSet.task_id }, r.corrigir ? 'ajustar' : 'aprovado');
      if (profile.role === 'client') {   // push no celular da equipe, não só o sino
        if (r.aprovadas) AP.registrarDecisao(apSet.share_token, 'aprovado', r.aprovadas);
        if (r.corrigir) AP.registrarDecisao(apSet.share_token, 'ajustar', r.corrigir);
      }
      await load();
      if (r.corrigir) AP.correcaoParaIA(apSet.share_token, apSet, items);
    });
  }
  const bi = document.getElementById('btnIA');
  if (bi) { bi.style.display = (equipe && drive) ? 'block' : 'none'; bi.onclick = mandarCorrecoesIA; }

  const av = document.getElementById('apAviso');
  if (av) av.innerHTML = (equipe && apSet.interno) ? `<div class="ap-interno"><div>
      <div style="flex:1;min-width:220px"><b>Revisão interna — o cliente ainda não vê este lote · ${total - faltaInterno} de ${total} aprovadas</b>
        <span>Aponte o que precisa mudar em cada peça (vai pra IA no "Correções pra IA") ou libere quando estiver pronto.</span></div>
      <button class="ap-lib" onclick="liberarCliente()">✓ Liberar pro cliente</button></div></div>` : '';

  const bz = document.getElementById('btnZip');
  if (bz) {
    const pronto = total > 0 && ok === total;
    bz.style.display = pronto ? 'block' : 'none';
    bz.onclick = baixarZip;
  }

  // Botão de agendar: sozinho ele já sabe em que estado está —
  // "agendar" quando tem peça aprovada esperando, "acompanhando" com
  // contador quando já foi enviado. Os dois podem coexistir: já tem
  // publicando E chegou peça nova aprovada depois.
  const ba = document.getElementById('btnAgendar');
  if (ba) {
    const temSocial = items.some(i => i.status === 'aprovado' &&
      ['feed','carrossel','stories','reels'].includes(i.kind));
    ba.style.display = (profile.role !== 'client' && temSocial) ? 'block' : 'none';
    if (ba.style.display === 'block') atualizarBotaoAgendar();
  }

  const vis = items.filter(i => filter === 'all' || i.status === filter);

  if (!vis.length) {
    board.innerHTML = `<div class="ap-empty">
      <div class="ic">○</div><h3>Nada neste filtro</h3>
      <p>Não há peças com esse status agora.</p></div>`;
    return;
  }

  // Galeria (folheto, outdoor, qualquer material) = grade simples.
  // Social = colunas por dia, como no painel original.
  if (apSet.layout === 'galeria') {
    board.innerHTML = `<div class="ap-grid">${vis.map(cardHTML).join('')}</div>`;
  } else {
    const groups = [];
    vis.forEach(i => {
      const k = i.group_label || '—';
      let g = groups.find(x => x.k === k);
      if (!g) { g = { k, theme: i.group_theme, list: [] }; groups.push(g); }
      g.list.push(i);
    });
    board.innerHTML = `<div class="ap-cols">${groups.map(g => `
      <div class="ap-col">
        <div class="ap-col-head">
          <h2>${esc(g.k)}</h2>
          ${g.theme ? `<div class="theme">${esc(g.theme)}</div>` : ''}
        </div>
        ${g.list.map(cardHTML).join('')}
      </div>`).join('')}</div>`;
  }

  bind();
}

function cardHTML(it){
  const media = Array.isArray(it.media) ? it.media : [];
  const isClient = profile.role === 'client';
  const internoEquipe = apSet.interno && !isClient;
  const badge = internoEquipe ? (it.interno_ok ? 'Aprovado (interno)' : 'Em revisão')
              : it.status === 'aprovado' ? 'Aprovado'
              : it.status === 'ajustar'  ? 'Ajustar' : 'Pendente';

  let mediaHTML = '';
  if (media.length) {
    // A mídia aparece na PROPORÇÃO REAL do arquivo — 1:1 fica quadrado,
    // 1080×1920 fica vertical, horizontal fica horizontal. Nada de
    // moldura quadrada cortando arte. Vídeo toca direto no card.
    mediaHTML = `<div class="ap-media" data-item="${it.id}">
        ${mediaTagHTML(media[0], 0)}
        ${media.length > 1 ? `<div class="n">1 / ${media.length}</div>` : ''}
      </div>`;
    if (media.length > 1) {
      mediaHTML += `<div class="ap-strip" data-item="${it.id}">${
        media.map((m,i) => ehVideo(m)
          ? `<video src="${esc(m.url||m.thumb)}" data-i="${i}" class="${i===0?'on':''}" muted preload="metadata"></video>`
          : `<img src="${esc(m.thumb||m.url)}" data-i="${i}" class="${i===0?'on':''}" loading="lazy">`).join('')
      }</div>`;
    }
  }

  let body = '';
  if (it.headline) body += `<p class="ap-headline">${esc(it.headline)}</p>`;
  if (it.art_note) body += `<p class="ap-note">${esc(it.art_note)}</p>`;
  if (Array.isArray(it.storyboard) && it.storyboard.length) {
    body += `<div class="ap-sb">${it.storyboard.map(s => `
      <div class="sc"><b>${esc(s.cena)}.</b> <span class="d">${esc(s.desc)}</span>
      ${s.texto ? `<div class="t">"${esc(s.texto)}"</div>` : ''}</div>`).join('')}</div>`;
  }
  if (it.caption) {
    body += `<details class="ap-cap"><summary>Ler legenda completa</summary>
      <div class="ap-cap-text">${esc(it.caption)}</div></details>`;
  }
  if (it.hashtags) body += `<div class="ap-hash">${esc(it.hashtags)}</div>`;

  // Apresentação da peça — o texto do designer, para material impresso
  // e afins, onde não existe legenda de post.
  if (it.pitch) {
    body += `<div style="font-size:12.5px;line-height:1.6;color:var(--text2);
      white-space:pre-line;padding:10px 12px;background:var(--surface2);
      border-radius:9px;margin-bottom:8px">${esc(it.pitch)}</div>`;
  }

  // Link do arquivo final: o pesado mora fora, aqui fica só o caminho.
  if (it.external_url) {
    body += `<a href="${esc(it.external_url)}" target="_blank" rel="noopener"
      style="display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:9px;
             border:1px solid var(--border);background:var(--surface2);text-decoration:none;
             color:var(--text);font-size:12.5px;font-weight:700;margin-bottom:8px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;flex-shrink:0">
        <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/>
        <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      <span>${esc(it.external_label || 'Arquivo final')}</span>
      <span style="margin-left:auto;color:var(--text3);font-weight:400">abrir ›</span></a>`;
  }
  if (it.publish_at) {
    body += `<div class="ap-note">Publicação prevista: ${
      AP.quando(it.publish_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>`;
  }

  const talk = (it._talk || []).map(c => {
    const int = AP.ehInterno(c.body);
    return `
    <div class="ap-msg ${c.is_client ? 'cli' : ''} ${int ? 'int' : ''}">

      ${!isClient ? `
      <div style="margin-top:9px"><button class="ed-toggle" onclick="editarPeca('${it.id}')">✎ Editar / trocar arte</button></div>
      <div class="ed-zone" id="ed_${it.id}" style="display:none;margin:10px -16px -14px;border-radius:0"></div>
