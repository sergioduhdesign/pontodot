function bind(){
  document.querySelectorAll('.ap-btn[data-act]').forEach(b =>
    b.onclick = () => decide(b.dataset.id, b.dataset.act));

  document.querySelectorAll('[data-send]').forEach(b =>
    b.onclick = () => sendComment(b.dataset.send));

  document.querySelectorAll('[data-int-ok]').forEach(b => b.onclick = async () => {
    const it = items.find(x => x.id === b.dataset.intOk);
    b.disabled = true;
    const { error } = await sb.rpc('set_internal_review', { p_item_ids: [it.id], p_ok: !it.interno_ok });
    b.disabled = false;
    if (error) { showToast('Erro: ' + error.message + ' (rodou a migration_aprovacao_interna.sql?)', 'error'); return; }
    showToast(it.interno_ok ? 'Aprovação interna desfeita.' : 'Aprovada internamente.', 'success');
    await load();
  });

  document.querySelectorAll('.ap-strip img, .ap-strip video').forEach(th => {
    th.onclick = () => {
      const wrap = th.closest('.ap-strip');
      const it   = items.find(x => x.id === wrap.dataset.item);
      const box  = document.querySelector(`.ap-media[data-item="${wrap.dataset.item}"]`);
      const i    = +th.dataset.i;
      // Regenera a tag certa (img↔video) — trocar só o src quebraria
      // quando a peça mistura foto e vídeo no mesmo item.
      const n = box.querySelector('.n');
      box.innerHTML = mediaTagHTML(it.media[i], i) + (n ? n.outerHTML : '');
      if (box.querySelector('.n')) box.querySelector('.n').textContent = (i+1) + ' / ' + it.media.length;
      wrap.querySelectorAll('img,video').forEach(x => x.classList.toggle('on', x === th));
      ligarCliqueMedia(box);
    };
  });

  document.querySelectorAll('.ap-media').forEach(ligarCliqueMedia);
}

document.querySelectorAll('.ap-chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.ap-chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  filter = c.dataset.f;
  render();
});

async function decide(id, decision){
  const ta = document.getElementById('ta_' + id);   // arte
  const tt = document.getElementById('tt_' + id);   // texto
  const comment = AP.montarComentario(ta ? ta.value : '', tt ? tt.value : '');

  if (decision === 'ajustar' && !comment) {
    showToast('Escreva o que precisa ser ajustado — na arte, no texto ou nos dois.', 'warn');
    ta.focus();
    return;
  }

  const card = document.querySelector(`.ap-card[data-id="${id}"]`);
  card.querySelectorAll('.ap-btn').forEach(b => b.disabled = true);

  // O comentário viaja junto da decisão — inclusive numa aprovação.
  const { data, error } = await sb.rpc('review_approval_item', {
    p_item_id: id, p_decision: decision, p_comment: comment || null, p_anchor: null
  });

  card.querySelectorAll('.ap-btn').forEach(b => b.disabled = false);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }

  showToast(decision === 'aprovado' ? 'Peça aprovada.' : 'Ajuste registrado.', 'success');
  if (data && profile.role === 'client') notifyTeam(data, decision);
  if (profile.role === 'client') AP.registrarDecisao(apSet.share_token, decision, 1);
  if (ta) ta.value = '';
  if (tt) tt.value = '';
  await load();
  if (decision === 'ajustar' && profile.role === 'client') AP.correcaoParaIA(apSet.share_token, apSet, items);
}

// ================================================================
// EDIÇÃO PELA EQUIPE
//
// É aqui que a correção do cliente vira trabalho: trocar a arte,
// reescrever a legenda, mexer na data. Ao salvar, a peça volta para
// "pendente" e o cliente é avisado de que há material novo.
// Tudo fica registrado: quem mexeu, no quê e quando.
// ================================================================
const edArquivos = {};   // itemId -> [File]   artes novas (vão pro fim)
const edTroca    = {};   // itemId -> { índice: File }   troca NO LUGAR

function editarPeca(id){
  const box = document.getElementById('ed_' + id);
  if (!box) return;
  if (box.style.display === 'block') { box.style.display = 'none'; return; }

  const it = items.find(x => x.id === id);
  if (!it) return;
  edArquivos[id] = [];
  edTroca[id] = {};

  const midias = (it.media || []).map((m, i) => `
    <div class="ed-art" data-i="${i}" title="${esc(m.name || '')}">
      ${AP.ehVideo(m)
        ? `<video src="${esc(m.url)}" muted preload="metadata" style="width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--border)"></video>`
        : `<img src="${esc(m.thumb || m.url)}">`}
      ${(it.media||[]).length > 1 ? `<span class="num">${i+1}</span>` : ''}
      <button onclick="removerArte('${id}',${i})" title="Remover">✕</button>
      <button class="sw" onclick="trocarArte('${id}',${i})" title="Trocar esta arte (mantém a posição)">↻</button>
    </div>`).join('');

  const dt = AP.quando(it.publish_at);
  const dtLocal = dt ? AP.instanteBanco(dt).slice(0,16) : '';
  const hist = versoes[id] || [];

  box.style.display = 'block';
  box.innerHTML = `
    <div class="ed-f">
      <label>Artes ${(it.version||1) > 1 ? '· versão ' + it.version : ''}</label>
      <div class="ed-arts" id="edArts_${id}">${midias}</div>
      <div class="ap-tip" style="margin-top:6px">↻ troca a arte no mesmo lugar · ✕ remove · arraste abaixo para acrescentar.</div>
      <div class="ed-drop" id="edDrop_${id}" style="margin-top:7px">Arraste ou clique para acrescentar arte nova</div>
      <input type="file" id="edFile_${id}" multiple accept="image/*,video/*,.pdf" style="display:none">
      <input type="file" id="edSw_${id}" accept="image/*,video/*,.pdf" style="display:none">
      ${hist.length ? `<div class="ed-hist" id="edHist_${id}">
        <button onclick="verHistorico('${id}')">Ver ${hist.length} versão(ões) anterior(es)</button></div>` : ''}
    </div>
    <div class="ed-f"><label>Texto da arte</label>
      <textarea id="edHead_${id}" style="min-height:48px">${esc(it.headline || '')}</textarea></div>
    <div class="ed-f"><label>Legenda</label>
      <textarea id="edCap_${id}" style="min-height:100px">${esc(it.caption || '')}</textarea></div>
    <div class="ed-f"><label>Hashtags</label>
      <input id="edHash_${id}" value="${esc(it.hashtags || '')}"></div>
    <div class="ed-f"><label>Apresentação da peça</label>
      <textarea id="edPitch_${id}" style="min-height:70px">${esc(it.pitch || '')}</textarea></div>
    <div class="ed-f"><label>Link do arquivo final</label>
      <input id="edLink_${id}" value="${esc(it.external_url || '')}"
        placeholder="Cole aqui o link do Drive"></div>
    <div class="ed-f"><label>Publicação</label>
      <div style="display:flex;gap:7px">
        <input type="date" id="edD_${id}" value="${dtLocal.slice(0,10)}"
               style="flex:1" oninput="previewData('${id}')">
        <input type="time" id="edH_${id}" value="${dtLocal.slice(11,16) || '09:00'}"
               style="width:110px" oninput="previewData('${id}')">
        <button type="button" onclick="limparData('${id}')" title="Sem data"
          style="width:38px;border:1px solid var(--border);border-radius:8px;
                 background:var(--surface2);color:var(--text3);cursor:pointer;font-family:inherit">✕</button>
      </div>
      <div id="edDprev_${id}" class="ap-tip" style="margin-top:5px"></div>
    </div>
    <button class="ed-save" id="edSave_${id}" onclick="salvarPeca('${id}')">
      Salvar e devolver para aprovação
    </button>
    <div class="ap-tip">A peça volta para "pendente", a versão anterior fica guardada e o cliente recebe aviso de material corrigido.</div>`;

  previewData(id);

  const drop = document.getElementById('edDrop_' + id);
  const inp  = document.getElementById('edFile_' + id);
  drop.onclick = () => inp.click();
  inp.onchange = () => { addArtes(id, [...inp.files]); inp.value = ''; };
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { if (e.dataTransfer.files.length) addArtes(id, [...e.dataTransfer.files]); });

  // Arrastar um arquivo EM CIMA de uma arte existente = trocar aquela arte
  box.querySelectorAll('.ed-art[data-i]').forEach(d => {
    ['dragenter','dragover'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.style.opacity = '.55'; }));
    ['dragleave','drop'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.style.opacity = ''; }));
    d.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) aplicarTroca(id, +d.dataset.i, f); });
  });
}

// Troca no lugar: a arte nova assume a posição da antiga (card 3 de um
// carrossel continua sendo o card 3).
function trocarArte(id, i){
  const inp = document.getElementById('edSw_' + id);
  inp.onchange = () => { if (inp.files[0]) aplicarTroca(id, i, inp.files[0]); inp.value = ''; };
  inp.click();
}
function aplicarTroca(id, i, f){
  if (f.size > 52428800) { showToast(f.name + ' passa de 50 MB.', 'warn'); return; }
  edTroca[id][i] = f;
  const d = document.querySelector(`#edArts_${id} .ed-art[data-i="${i}"]`);
  if (!d) return;
  const url = URL.createObjectURL(f);
  const velho = d.querySelector('img,video');
  const novo = f.type.startsWith('video') ? document.createElement('video') : document.createElement('img');
  novo.src = url;
  if (novo.tagName === 'VIDEO') { novo.muted = true; novo.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:6px'; }
  velho.replaceWith(novo);
  d.classList.add('trocada');
  d.title = 'Nova: ' + f.name;
}

async function verHistorico(id){
  const box = document.getElementById('edHist_' + id);
  const hist = versoes[id] || [];
  box.innerHTML = hist.map(v => `
    <div class="v"><b>V${v.version} · ${new Date(v.created_at).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</b>
      ${(v.media||[]).map((m,i) => AP.ehVideo(m)
        ? `<span style="font-size:10px;color:var(--text3)">vídeo</span>`
        : `<img src="${esc(m.thumb || m.url)}" onclick="lbOpen({media:versoes['${id}'].find(x=>x.id==='${v.id}').media},${i})">`).join('')}
    </div>`).join('');
}

// O campo de data nativo não tem "OK": a pessoa escolhe e fica sem
// confirmação nenhuma. Esta linha embaixo escreve por extenso o que
// foi entendido, para não haver dúvida antes de salvar.
function previewData(id){
  const el = document.getElementById('edDprev_' + id);
  const d  = document.getElementById('edD_' + id).value;
  const h  = document.getElementById('edH_' + id).value;
  if (!el) return;
  if (!d) { el.textContent = 'Sem data definida.'; el.style.color = 'var(--text3)'; return; }
  const dt = new Date(d + 'T' + (h || '09:00'));
  const fmt = dt.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
  el.textContent = 'Publica ' + fmt + (h ? ', às ' + h : '') + '.';
  el.style.color = dt < new Date() ? '#db2777' : 'var(--text3)';
  if (dt < new Date()) el.textContent += '  Atenção: é uma data no passado.';
}
function limparData(id){
  document.getElementById('edD_' + id).value = '';
  document.getElementById('edH_' + id).value = '';
  previewData(id);
}

function addArtes(id, lista){
  const wrap = document.getElementById('edArts_' + id);
  lista.forEach(f => {
    if (f.size > 52428800) { showToast(f.name + ' passa de 50 MB.', 'warn'); return; }
    edArquivos[id].push(f);
    const url = URL.createObjectURL(f);
    const d = document.createElement('div');
    d.className = 'ed-art trocada';
    d.dataset.novo = edArquivos[id].length - 1;
    d.innerHTML = `<img src="${url}"><button onclick="this.parentElement.remove()">✕</button>`;
    wrap.appendChild(d);
  });
}

function removerArte(id, i){
  const el = document.querySelector(`#edArts_${id} .ed-art[data-i="${i}"]`);
  if (el) el.remove();
}

// Sobe um arquivo para o storage do lote (módulo comum: guarda também
// o link do original quando o arquivo veio do Drive).
function subirMidia(f, extra){ return AP.subirMidia(f, apSet.client_id, SET_ID, extra); }

// Guarda a foto da versão atual antes de qualquer correção. Se a
// migration ainda não rodou, segue sem histórico (não trava a correção).
async function registrarVersao(itemId, origem){
  const { error } = await sb.rpc('register_approval_version', { p_item_id: itemId, p_origem: origem });
  if (error) console.warn('Versão não registrada (rodou a migration_aprovacao_versoes.sql?):', error.message);
}

async function salvarPeca(id){
  const btn = document.getElementById('edSave_' + id);
  btn.disabled = true; btn.textContent = 'Salvando…';

  try {
    const it = items.find(x => x.id === id);
    const wrap = document.getElementById('edArts_' + id);

    // Antigas que ficaram, NA ORDEM, com as trocas no lugar
    const finais = [];
    let trocou = false;
    for (const d of wrap.querySelectorAll('.ed-art[data-i]')) {
      const i = +d.dataset.i, velha = it.media[i];
      const f = edTroca[id] && edTroca[id][i];
      if (f) {
        btn.textContent = 'Subindo ' + f.name + '…';
        // Mantém o "path" original: o próximo ZIP de correções continua
        // achando esta arte pelo nome de sempre.
        finais.push(await subirMidia(f, velha?.path ? { path: velha.path } : null));
        trocou = true;
      } else if (velha) finais.push(velha);
    }
    if (finais.length !== (it.media||[]).length) trocou = true;   // removeu alguma

    // Novas, no fim
    for (const d of wrap.querySelectorAll('.ed-art[data-novo]')) {
      const f = edArquivos[id][+d.dataset.novo];
      if (!f) continue;
      btn.textContent = 'Subindo ' + f.name + '…';
      finais.push(await subirMidia(f));
      trocou = true;
    }

    const d = document.getElementById('edD_' + id).value;
    const h = document.getElementById('edH_' + id).value || '09:00';
    const dv = d ? (d + 'T' + h) : '';

    btn.textContent = 'Salvando…';
    await registrarVersao(id, trocou ? 'troca' : 'edicao');

    const { error } = await sb.rpc('update_approval_item', {
      p_item_id: id,
      p_media: finais,
      p_headline: document.getElementById('edHead_' + id).value.trim() || null,
      p_caption:  document.getElementById('edCap_'  + id).value.trim() || null,
      p_hashtags: document.getElementById('edHash_' + id).value.trim() || null,
      p_publish_at: dv ? AP.dataBanco(d, h) : null,
      p_trocou_arte: trocou,
      p_external_url: document.getElementById('edLink_'  + id).value.trim() || null,
      p_pitch:        document.getElementById('edPitch_' + id).value.trim() || null
    });
    if (error) throw error;

    showToast('Peça atualizada. O cliente foi avisado.', 'success');
    delete edArquivos[id]; delete edTroca[id];
    await load();

  } catch(err){
    showToast('Erro: ' + err.message, 'error');
    btn.disabled = false; btn.textContent = 'Salvar e devolver para aprovação';
  }
}

// A equipe responde sem decidir nada — a decisão é sempre do cliente.
async function sendComment(id){
  const ta = document.getElementById('ta_' + id);
  const tt = document.getElementById('tt_' + id);
  const body = ta.dataset.interno ? AP.montarInterno(ta.value, tt ? tt.value : '') : ta.value.trim();
  if (!body) return;

  const { error } = await sb.from('approval_comments').insert({
    item_id: id, author_id: profile.id, author_name: profile.name,
    is_client: false, body
  });

  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  ta.value = ''; if (tt) tt.value = '';
  showToast(ta.dataset.interno ? 'Apontamento registrado — vai pra IA em "Correções pra IA".' : 'Resposta enviada.', 'success');
  await load();
}

// Avisa a equipe: notificação no painel da plataforma
async function notifyTeam(r, decision){
  try {
    const { data: team } = await sb.from('profiles')
      .select('id').in('role',['admin','team']).eq('active', true);
    if (!team || !team.length) return;

    const titulo = decision === 'aprovado' ? '✓ Cliente aprovou' : '↺ Cliente pediu ajuste';
    const corpo  = (apSet?.title || 'Material') +
      (r.pendentes === 0 ? ' — lote completo' : ' — faltam ' + r.pendentes);

    await sb.from('notifications').insert(team.map(t => ({
      user_id: t.id, actor_id: profile.id,
      type: decision === 'aprovado' ? 'aprovacao_ok' : 'aprovacao_ajuste',
      title: titulo, body: corpo,
      link: r.task ? ('task:' + r.task) : ('aprovacao:' + SET_ID)
    })));
  } catch(e){ console.log('aviso falhou:', e.message); }
}

// ==================================================================
// TEMPO REAL — a equipe vê a decisão do cliente chegando
// ==================================================================
let canalLive = null;

function listenLive(){
  // load() roda depois de toda decisão e de toda edição, e chamava esta
  // função de novo — tentando assinar um canal que já estava assinado.
  // O Supabase recusa e o erro estourava no console.
  if (canalLive) return;

  canalLive = sb.channel('ap_' + SET_ID)
    .on('postgres_changes',
        { event:'*', schema:'public', table:'approval_items', filter:'set_id=eq.' + SET_ID },
        () => load())
    .subscribe();
}

// Ao sair da tela, desliga o canal — senão fica pendurado.
window.addEventListener('beforeunload', () => {
  if (canalLive) { sb.removeChannel(canalLive); canalLive = null; }
});

// ==================================================================
// AGENDAR AS APROVADAS
//
// Pega toda peça de rede social já aprovada, que ainda não está na
// fila, e cria o agendamento — usando a data que já veio do Excel no
// momento da montagem do lote. Não pede nada de novo pra pessoa além
// de escolher em quais contas conectadas vai publicar.
// ==================================================================
// ==================================================================
// ESTADO DO BOTÃO DE AGENDAMENTO — três situações possíveis:
//   1. Nada agendado ainda → botão verde "Agendar aprovadas" normal
//   2. Já agendado, ainda publicando → pílula com contador X/Y,
//      atualiza sozinha a cada 30s enquanto a tela ficar aberta
//   3. Tudo publicado, mas surgiu peça nova aprovada depois → mostra
//      o resultado ("10/10 publicadas") E o botão de agendar as novas,
//      lado a lado — as duas coisas são situações reais ao mesmo tempo.
// ==================================================================
async function atualizarBotaoAgendar(){
  const ba = document.getElementById('btnAgendar');
  if (!ba || ba.style.display === 'none') return;

  const elegiveis = items.filter(i => i.status === 'aprovado' &&
    ['feed','carrossel','stories','reels'].includes(i.kind));
  const idsElegiveis = elegiveis.map(i => i.id);
  if (!idsElegiveis.length) return;

  const { data: postsDoLote } = await sb.from('scheduled_posts')
    .select('id,batch_name').in('batch_name', idsElegiveis.map(id => 'ap:' + id));

  const idsAgendados = new Set((postsDoLote||[]).map(p => (p.batch_name||'').replace('ap:','')));
  const pendentes = elegiveis.filter(i => !idsAgendados.has(i.id));

  if (!postsDoLote || !postsDoLote.length) {
    // Situação 1 — nada agendado ainda, botão normal de CTA.
    ba.innerHTML = '📤 Agendar aprovadas';
    ba.onclick = abrirAgendamento;
    ba.style.background = '#16a34a';
    ba.disabled = false;
    return;
  }

  // Já tem algo agendado — busca o status de cada alvo pra montar o contador.
  const postIds = postsDoLote.map(p => p.id);
  const { data: alvos } = await sb.from('scheduled_post_targets')
    .select('status').in('post_id', postIds);

  const totalAlvos = (alvos||[]).length;
  const publicados = (alvos||[]).filter(a => a.status === 'publicado').length;
  const comErro = (alvos||[]).filter(a => a.status === 'erro').length;
  const tudoPronto = publicados + comErro === totalAlvos;

  const corBadge = comErro ? '#dc2626' : (tudoPronto ? '#16a34a' : '#2563eb');
  const textoBadge = tudoPronto
    ? `✓ ${publicados}/${totalAlvos} publicada${totalAlvos!==1?'s':''}` + (comErro ? ` (${comErro} com erro)` : '')
    : `${publicados}/${totalAlvos} publicando…`;

  if (pendentes.length) {
    // Situação 3 — mostra os dois: o que já foi, e o botão pras novas.
    ba.innerHTML = `<span style="opacity:.9">${textoBadge}</span><span style="opacity:.5;margin:0 2px">·</span>+ agendar ${pendentes.length} nova(s)`;
    ba.onclick = abrirAgendamento;
    ba.style.background = corBadge;
    ba.disabled = false;
  } else {
    // Situação 2 — só o acompanhamento, sem ação pendente.
    ba.innerHTML = textoBadge + ' ▾';
    ba.onclick = abrirStatusPublicacao;
    ba.style.background = corBadge;
    ba.style.cursor = 'pointer';
  }
}
// Atualiza sozinho a cada 30s, enquanto a tela ficar aberta — "vai
// atualizando conforme o tempo passa e novas publicações acontecem".
setInterval(atualizarBotaoAgendar, 30000);

// Entrada única da etapa PUBLICAR: agenda o que falta; se já está tudo na fila, mostra o andamento.
async function abrirPublicacao(){
  const el = items.filter(i => i.status === 'aprovado' && ['feed','carrossel','stories','reels'].includes(i.kind));
  if (!el.length) { showToast('Ainda não há peça aprovada pra publicar.', 'warn'); return; }
  const { data: ja } = await sb.from('scheduled_posts').select('batch_name').in('batch_name', el.map(i => 'ap:' + i.id));
  if ((ja||[]).length >= el.length) abrirStatusPublicacao(); else abrirAgendamento();
}

// Andamento da publicação: cada peça/conta, quando sai, o que deu errado — e "publicar agora".
async function abrirStatusPublicacao(){
  const ids = items.filter(i => i.status === 'aprovado').map(i => 'ap:' + i.id);
  const { data: posts } = await sb.from('scheduled_posts').select('id,batch_name,scheduled_at').in('batch_name', ids);
  if (!posts || !posts.length) { showToast('Nada agendado ainda.', 'info'); return; }
  const { data: alvos } = await sb.from('scheduled_post_targets')
    .select('id,post_id,platform,status,error_message,scheduled_at_override,social_account_id')
    .in('post_id', posts.map(p => p.id));
  const { data: ctas } = await sb.from('social_accounts').select('id,account_name').eq('client_id', apSet.client_id);
  const nomeConta = Object.fromEntries((ctas||[]).map(c => [c.id, c.account_name]));
  const porPost = Object.fromEntries(posts.map(p => [p.id, p]));
  const nomeItem = bn => { const it = items.find(i => 'ap:' + i.id === bn); return it ? (it.title || it.headline || it.kind) : '(peça)'; };
  const cor = { publicado:'#16a34a', erro:'#dc2626', publicando:'#2563eb', agendado:'#a16207', cancelado:'#6b7280' };
  const agora = Date.now();
  const linhas = (alvos||[]).map(a => {
    const p = porPost[a.post_id] || {};
    const q = a.scheduled_at_override || p.scheduled_at;
    const venceu = a.status === 'agendado' && q && new Date(q).getTime() <= agora;
    const quando = q ? new Date(q).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : 'sem data';
    const rot = a.status === 'agendado' ? (venceu ? 'venceu — aguardando o robô' : 'aguarda a data') : a.status;
    return `<div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px">
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nomeItem(p.batch_name))} <span style="color:var(--text3)">· ${esc(nomeConta[a.social_account_id] || a.platform)}</span></span>
      <span style="color:var(--text3);white-space:nowrap">${quando}</span>
      <b style="color:${cor[a.status]||'inherit'};white-space:nowrap">${rot}</b></div>`
      + (a.status === 'erro' && a.error_message ? `<div style="font-size:11.5px;color:#dc2626;padding:2px 0 6px">${esc(a.error_message)}</div>` : '');
  }).join('');
  const faltam = (alvos||[]).filter(a => a.status === 'agendado' || a.status === 'erro').map(a => a.id);
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:99600;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,10,12,.55);backdrop-filter:blur(6px)';
  ov.innerHTML = `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.4)">
    <div style="font-size:15px;font-weight:700;margin-bottom:4px">Publicação</div>
    <div style="font-size:12.5px;color:var(--text3);line-height:1.5;margin-bottom:12px">Cada peça sai na data da planilha, pelo robô que roda a cada poucos minutos. Se quiser antecipar, use “Publicar agora”.</div>
    <div>${linhas}</div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button id="stFechar" class="btn btn-secondary" style="flex:1;justify-content:center">Fechar</button>
      ${faltam.length ? `<button id="stAgora" class="btn btn-primary" style="flex:1;justify-content:center;background:#16a34a;border-color:#16a34a">Publicar agora (${faltam.length})</button>` : ''}
    </div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#stFechar').onclick = () => ov.remove();
  ov.onclick = ev => { if (ev.target === ov) ov.remove(); };
  const bt = ov.querySelector('#stAgora');
  if (bt) bt.onclick = async () => {
    const futuros = (alvos||[]).filter(a => faltam.includes(a.id)).map(a => new Date(a.scheduled_at_override || (porPost[a.post_id]||{}).scheduled_at || 0).getTime()).filter(t => t > Date.now() + 600000).sort((x,y) => x - y);
    const aviso = futuros.length
      ? `ATENÇÃO: ${futuros.length} dessas peças estão agendadas para o futuro (a primeira para ${new Date(futuros[0]).toLocaleDateString('pt-BR')}, a última para ${new Date(futuros[futuros.length-1]).toLocaleDateString('pt-BR')}) e vão sair AGORA, antes da data.\n\n` : '';
    if (futuros.length) {
      const r = prompt(aviso + `Para confirmar, digite PUBLICAR:`);
      if (!r || r.trim().toUpperCase() !== 'PUBLICAR') { showToast('Cancelado — nada foi publicado.', 'info'); return; }
    } else if (!confirm(`Publicar ${faltam.length} agora, de verdade, nas redes? Não tem volta.`)) return;
    bt.disabled = true; bt.textContent = 'Publicando…';
    let ok = 0, falha = 0, msg = '';
    for (let i = 0; i < faltam.length; i += 30) {
      try {
        const r = await AP.sdFetch('/social-publish-now.php', { target_ids: faltam.slice(i, i + 30) });
        (r.resultados||[]).forEach(x => x.ok ? ok++ : falha++);
      } catch(e) { falha += Math.min(30, faltam.length - i); msg = e.message; }
    }
    ov.remove();
    showToast(`${ok} publicada(s)` + (falha ? `, ${falha} com erro${msg ? ' — ' + msg : ''}` : '.'), falha ? 'warn' : 'success');
    atualizarBotaoAgendar();
  };
}

async function abrirAgendamento(){
  const elegiveis = items.filter(i => i.status === 'aprovado' &&
    ['feed','carrossel','stories','reels'].includes(i.kind));

  if (!elegiveis.length) { showToast('Nada aprovado ainda para agendar.', 'warn'); return; }

  // "piece_id" em scheduled_posts aponta pra tabela antiga de design
  // (pieces), não pra approval_items — são conceitos parecidos, mas
  // de sistemas diferentes. Uso batch_name (campo livre) só pra eu
  // mesmo saber depois de qual peça aprovada este agendamento veio,
  // e pra não agendar a mesma peça duas vezes.
  const { data: jaAgendadas } = await sb.from('scheduled_posts')
    .select('batch_name').in('batch_name', elegiveis.map(i => 'ap:' + i.id));
  const idsAgendados = new Set((jaAgendadas||[]).map(x => (x.batch_name||'').replace('ap:','')));
  const pendentes = elegiveis.filter(i => !idsAgendados.has(i.id));

  // Tudo já na fila: a janela abre mesmo assim, pra ligar/desligar o "agendar sozinho".

  // Contas conectadas deste cliente
  const clienteId = apSet.client_id;
  if (!clienteId) { showToast('Este lote não tem cliente vinculado.', 'error'); return; }
  const { data: contas } = await sb.from('social_accounts')
    .select('id,platform,account_name').eq('client_id', clienteId).eq('status','conectada');

  if (!contas || !contas.length) {
    showToast('Nenhuma conta social conectada para este cliente. Vá em Admin → Redes sociais.', 'warn');
    return;
  }

  // Agendar sozinho (por cliente): lembra as contas e o liga/desliga
  let cfgAuto = null;
  try {
    const { data, error } = await sb.from('pd_publicacao').select('agendar_sozinho,contas').eq('client_id', clienteId).maybeSingle();
    if (!error) cfgAuto = data || { agendar_sozinho: false, contas: [] };
  } catch(e) {}
  const contaMarcada = id => !cfgAuto || !(cfgAuto.contas || []).length || cfgAuto.contas.includes(id);

  const ov = document.createElement('div');
  ov.style.cssText = `position:fixed;inset:0;z-index:99600;display:flex;align-items:center;
    justify-content:center;padding:24px;background:rgba(10,10,12,.55);backdrop-filter:blur(6px)`;
  ov.innerHTML = `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
                max-width:400px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.4)">
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">${pendentes.length ? `Agendar ${pendentes.length} peça(s)` : 'Tudo aprovado já está na fila'}</div>
      <div style="font-size:12.5px;color:var(--text3);line-height:1.5;margin-bottom:16px">
        Cada peça publica na data que veio da planilha. Escolha em quais contas.</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
        ${contas.map(c => `
          <label style="display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border);
                        border-radius:9px;cursor:pointer">
            <input type="checkbox" class="ag-conta" value="${c.id}" data-platform="${c.platform}" ${contaMarcada(c.id) ? 'checked' : ''}
              style="width:16px;height:16px">
            <span style="font-size:13px">${c.platform === 'instagram' ? '📷' : '📘'} ${c.account_name}</span>
          </label>`).join('')}
      </div>
      ${cfgAuto ? `<label style="display:flex;gap:9px;align-items:flex-start;padding:10px 11px;margin:-6px 0 16px;border-radius:9px;
                    background:var(--surface2,rgba(127,127,127,.08));cursor:pointer;font-size:12.5px;line-height:1.45">
        <input type="checkbox" id="agAuto" ${cfgAuto.agendar_sozinho ? 'checked' : ''} style="width:16px;height:16px;margin-top:1px;flex-shrink:0">
        <span><b>Agendar sozinho daqui pra frente</b><br><span style="color:var(--text3)">Toda peça aprovada deste cliente, com data,
        entra na fila nestas contas — sem abrir esta janela. Peça sem data ou com a data já passada espera você.</span></span>
      </label>` : ''}
      <div style="display:flex;gap:8px">
        <button id="agCancel" class="btn btn-secondary" style="flex:1;justify-content:center">Cancelar</button>
        <button id="agConfirm" class="btn btn-primary" style="flex:1;justify-content:center;background:#16a34a;border-color:#16a34a">Confirmar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  ov.querySelector('#agCancel').onclick = () => ov.remove();
  ov.onclick = ev => { if (ev.target === ov) ov.remove(); };
  ov.querySelector('#agConfirm').onclick = () => confirmarAgendamento(pendentes, clienteId, ov);
}

async function confirmarAgendamento(pendentes, clienteId, ov){
  const marcadas = [...document.querySelectorAll('.ag-conta:checked')]
    .map(el => ({ id: el.value, platform: el.dataset.platform }));

  if (!marcadas.length) { showToast('Escolha pelo menos uma conta.', 'warn'); return; }
  const auto = document.getElementById('agAuto');
  if (auto) {
    const { error: ea } = await sb.from('pd_publicacao').upsert({ client_id: clienteId, agendar_sozinho: auto.checked,
      contas: marcadas.map(c => c.id), atualizado_por: profile.id, atualizado_em: new Date().toISOString() });
    if (ea) console.warn('agendar sozinho:', ea.message);
    else if (auto.checked) showToast('Agendar sozinho ligado pra este cliente.', 'success');
  }
  if (!pendentes.length) { ov.remove(); if (!auto) showToast('Nada novo pra agendar.', 'info'); return; }

  const btn = ov.querySelector('#agConfirm');
  btn.disabled = true; btn.textContent = 'Agendando…';

  let ok = 0, falhas = 0;

  for (const item of pendentes) {
    // A tabela real não tem coluna própria para hashtags — junta tudo
    // dentro de "caption", como o post final vai sair mesmo.
    const legendaCompleta = [item.caption || item.headline, item.hashtags]
      .filter(Boolean).join('\n\n') || null;

    const { data: post, error: e1 } = await sb.from('scheduled_posts').insert({
      client_id: clienteId,
      batch_name: 'ap:' + item.id,
      caption: legendaCompleta,
      media_urls: item.media || [],
      post_type: item.kind,
      scheduled_at: (AP.quando(item.publish_at) || new Date()).toISOString(),
      created_by: profile.id,
    }).select().single();

    if (e1 || !post) { falhas++; console.log('agendar post:', e1?.message); continue; }

    const placement = { feed:'feed', carrossel:'feed', stories:'stories', reels:'reels' }[item.kind] || 'feed';

    const alvos = marcadas.map(c => ({
      post_id: post.id, social_account_id: c.id, platform: c.platform, placement,
    }));
    const { error: e2 } = await sb.from('scheduled_post_targets').insert(alvos);

    if (e2) { falhas++; console.log('agendar alvo:', e2.message); } else { ok++; }
  }

  ov.remove();
  if (ok) showToast(`${ok} peça(s) na fila de publicação.` + (falhas ? ` ${falhas} falharam.` : ''), falhas ? 'warn' : 'success');
  else showToast('Não consegui agendar. Confira o console.', 'error');

  await load();
}

// ==================================================================
// DOWNLOAD DO CONTEÚDO APROVADO
//
// Monta um zip organizado por SEMANA e, dentro dela, por tipo de peça.
// A semana é a da data de publicação; peça sem data cai em "Semana 1",
// porque conteúdo sem data ainda é conteúdo de uma semana só.
//
// Junto vai um leia-me com legenda, hashtags e horário de cada peça —
// quem for postar tem tudo num lugar só, sem voltar na plataforma.
// ==================================================================
function pastaTipo(kind){
  return { feed:'feed', carrossel:'carrossel', stories:'stories',
           reels:'reels', material:'material', generico:'material' }[kind] || 'outros';
}

function semanaDe(items, it){
  // Sem data: tudo vira Semana 1. Com data: conta a partir da mais antiga.
  const datas = items.map(x => x.publish_at).filter(Boolean).map(d => AP.quando(d));
  if (!datas.length || !it.publish_at) return 1;
  const min = new Date(Math.min(...datas));
  min.setHours(0,0,0,0);
  const dias = Math.floor((AP.quando(it.publish_at) - min) / 86400000);
  return Math.floor(dias / 7) + 1;
}

function limparNome(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9 _.-]/g,'').trim().replace(/\s+/g,'-').substring(0,60) || 'peca';
}

async function baixarZip(){
  const btn = document.getElementById('btnZip');
  const txt = btn.textContent;
  btn.disabled = true;

  try {
    const zip = new JSZip();
    const linhas = ['CONTEUDO APROVADO', apSet.title, ''];
    let baixados = 0, falhas = [];

    // Total de arquivos, para a barra de progresso fazer sentido
    const total = items.reduce((n,i) => n + ((i.media||[]).length || 0), 0);

    for (const it of items) {
      const sem  = 'Semana ' + semanaDe(items, it);
      const tipo = pastaTipo(it.kind);
      const base = limparNome(it.title || ('peca-' + (it.position + 1)));
      const midias = it.media || [];

      // Leia-me
      linhas.push('─'.repeat(58));
      linhas.push(`[${sem} · ${tipo.toUpperCase()}] ${it.title || base}`);
      if (it.publish_at) linhas.push('Publicar: ' + AP.quando(it.publish_at).toLocaleString('pt-BR'));
      if (it.headline) linhas.push('Texto da arte: ' + it.headline.replace(/\n/g,' / '));
      if (it.caption)  linhas.push('', 'LEGENDA:', it.caption);
      if (it.hashtags) linhas.push('', 'HASHTAGS: ' + it.hashtags);
      linhas.push('Arquivos: ' + (midias.map(m => m.name).join(', ') || '(nenhum)'));
      linhas.push('');

      for (let i = 0; i < midias.length; i++) {
        const m = midias[i];
        try {
          const r = await fetch(m.url);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const blob = await r.blob();
          const ext = (m.name && m.name.includes('.'))
            ? m.name.split('.').pop().toLowerCase()
            : (blob.type.split('/')[1] || 'jpg');
          const nome = midias.length > 1
            ? `${base}-${String(i+1).padStart(2,'0')}.${ext}`
            : `${base}.${ext}`;
          zip.folder(sem).folder(tipo).file(nome, blob);
          baixados++;
          btn.textContent = `Preparando… ${baixados}/${total}`;
        } catch(err){
          falhas.push((m.name || 'arquivo') + ' — ' + err.message);
        }
      }
    }

    if (falhas.length) {
      linhas.push('', '─'.repeat(58), 'NAO FOI POSSIVEL BAIXAR:', ...falhas);
    }
    zip.file('LEIA-ME.txt', linhas.join('\n'));

    btn.textContent = 'Compactando…';
    const blob = await zip.generateAsync({ type:'blob' }, meta => {
      btn.textContent = 'Compactando… ' + Math.round(meta.percent) + '%';
    });

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = limparNome(apSet.title) + '.zip';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);

    showToast(falhas.length
      ? `Baixado, mas ${falhas.length} arquivo(s) falharam — veja o LEIA-ME.`
      : 'Conteúdo baixado.', falhas.length ? 'warn' : 'success');

  } catch(err){
    showToast('Erro ao montar o zip: ' + err.message, 'error');
  }

  btn.disabled = false;
  btn.textContent = txt;
}

// ================================================================
// REVER MATERIAL JÁ APROVADO
//
// Depois de aprovado, o material entra em produção: agendamento,
// gráfica, veiculação. Reabrir é possível, mas não é grátis — e a
// pessoa precisa saber disso antes, não depois.
// ================================================================
function reverMaterial(id){
  const ov = document.createElement('div');
  ov.className = 'ap-warn';
  ov.innerHTML = `
    <div class="ap-warn-box">
      <h3>Reabrir um material aprovado</h3>
      <p>Este material já foi aprovado e pode ter entrado em produção — agendamento,
         impressão ou veiculação. Vamos atender seu pedido o quanto antes, mas o que
         já saiu pode não ter volta.<br><br>
         Quer seguir e pedir a revisão?</p>
      <div class="ap-warn-acts">
        <button class="no">Deixar como está</button>
        <button class="yes">Pedir revisão</button>
      </div>
    </div>`;

  ov.querySelector('.no').onclick  = () => ov.remove();
  ov.onclick = ev => { if (ev.target === ov) ov.remove(); };
  ov.querySelector('.yes').onclick = () => {
    ov.remove();
    const ta = document.getElementById('ta_' + id);
    if (ta) {
      ta.focus();
      ta.scrollIntoView({behavior:'smooth', block:'center'});
      ta.placeholder = 'Conte o que precisa ser revisto neste material.';
      ta.style.borderColor = '#db2777';
    }
    showToast('Escreva o que precisa ser revisto e toque em "Pedir ajuste".', 'info');
    // Libera os botões normais nesta peça
    const card = document.querySelector(`.ap-card[data-id="${id}"] .ap-btns`);
    if (card) card.innerHTML =
      `<button class="ap-btn ok"  data-act="aprovado" data-id="${id}">✓ Aprovar</button>

// ==================================================================
// LIBERAR PRO CLIENTE — o lote sai da revisão interna, ganha o link
// público e o gestor manda pelo WhatsApp (com a mensagem pronta).
// ==================================================================
async function liberarCliente(jaConfirmado){
  const jaTinhaLink = !!apSet.share_token;
  const falta = items.filter(i => !i.interno_ok).length;
  if (!jaConfirmado && !confirm(falta
      ? `${falta} peça(s) ainda não foram aprovadas internamente. Liberar mesmo assim? O cliente passa a ver todas.`
      : 'Liberar este lote pro cliente? Ele passa a ver todas as peças e recebe o link.')) return;
  try {
    const { error: e1 } = await sb.from('approval_sets').update({ interno: false }).eq('id', SET_ID);
    if (e1) throw e1;
    const { data: env, error: e2 } = await sb.rpc('send_approval_set', { p_set_id: SET_ID, p_days: 30 });
    if (e2) throw e2;
    if (drive) { try { await AP.drive.chamar('liberar', { task_id: apSet.task_id }); } catch(e){ console.warn(e.message); } }
    const link = `${location.origin}/aprovacao-preview.php?t=${env.token}`;
    // Avisa o cliente sozinho: sino + push + e-mail com o link
    let avisados = 0;
    try {
      const r = await AP.sdFetch('/ponte-drive.php', { acao: 'avisar_cliente', task_id: apSet.task_id || '-',
        set_id: SET_ID, link, corrigido: !!(jaTinhaLink || apSet._jaLiberado) });
      avisados = r.avisados || 0;
    } catch(e) { console.warn('Aviso ao cliente:', e.message); }
    mostrarLinkCliente(link, avisados);
    await load();
  } catch(err){ showToast('Erro ao liberar: ' + err.message, 'error'); }
}

function mostrarLinkCliente(link, avisados){
  const cli = document.getElementById('apEyebrow').textContent.split(' · ')[0];
  const msg = `Olá! O material "${apSet.title}" está pronto para sua aprovação: ${link}`;
  const ov = document.createElement('div');
  ov.className = 'ap-warn';
  ov.innerHTML = `<div class="ap-warn-box">
      <h3>Liberado pro cliente</h3>
      <p>${avisados ? `✓ ${avisados} contato(s) do ${esc(cli)} já foram avisados (notificação + e-mail). ` : ''}Se quiser, mande também pelo WhatsApp — o cliente aprova sem precisar de conta.</p>
      <input class="ap-ta" value="${esc(link)}" readonly style="min-height:0;margin-bottom:14px">
      <div class="ap-warn-acts">
        <button class="no" id="lkCopy">Copiar link</button>
        <button class="yes" id="lkWa" style="background:#16a34a;border-color:#16a34a">WhatsApp</button>
      </div></div>`;
  document.body.appendChild(ov);
  ov.onclick = ev => { if (ev.target === ov) ov.remove(); };

}

// internos) vai direto pra pasta ENTRADA da tarefa no Drive, e a
// planilha SD_CONTROLE muda pra CORRIGIR. Sem baixar nada.
// ==================================================================
async function mandarCorrecoesIA(){
  const btn = document.getElementById('btnIA');
  if (!drive) return;
  btn.disabled = true; const txt = btn.textContent; btn.textContent = 'Enviando…';
  try {
    const desde = {};
    Object.entries(versoes).forEach(([id, vs]) => { if (vs[0]) desde[id] = vs[0].created_at; });
    const linhasInfo = AP.gerarExcelCorrecoes({ set: apSet, items, desdeVersao: desde,
      clienteNome: document.getElementById('apEyebrow').textContent.split(' · ')[0], retornarBuffer: true });
    // gerarExcelCorrecoes com retornarBuffer devolve o arquivo; conta à parte
    const resumo = contarCorrecoes(desde);
    if (!resumo.n && !confirm('Não achei correção nova (do cliente ou interna). Mandar o Excel mesmo assim?')) {
      btn.disabled = false; btn.textContent = txt; return;
    }
    const b64 = await AP.b64(linhasInfo);
    // Briefing de correção na pasta ANTES do chamado por e-mail
    let pedido = '';
    try { pedido = await AP.montarBriefing(apSet.task_id, { correcao: true }); } catch(e) { console.warn(e.message); }
    const r = await AP.drive.chamar('enviar_correcoes', { task_id: apSet.task_id, b64, nome: 'correcoes.xlsx',
      origem: apSet.interno ? 'revisão interna' : 'cliente', resumo: resumo.n + ' peça(s) com correção' });
    drive = r.drive || drive;
    try { if (pedido) await navigator.clipboard.writeText(pedido); } catch(e){}
    showToast(`Correções na pasta ENTRADA (${resumo.n} peça(s)). Chamado CORRIGIR enviado por e-mail pra IA.`, 'success');
  } catch(err){ showToast('Erro: ' + err.message, 'error'); }
  btn.disabled = false; btn.textContent = txt;
}

function contarCorrecoes(desde){
  let n = 0;
  items.forEach(it => {
    const corte = desde[it.id] ? new Date(desde[it.id]) : null;
    const tem = (it._talk || []).some(c => (c.is_client || AP.ehInterno(c.body)) &&
      (corte ? new Date(c.created_at) > corte : (AP.ehInterno(c.body) || it.status === 'ajustar')));
    if (tem) n++;
  });
  return { n };
}

async function czReceber(files, entradasDrive){
  const st = document.getElementById('czSt');
  try {
    const r = await AP.lerPacote(files || [], { doc:false, entradas: entradasDrive,
      paginas: document.getElementById('czPag')?.value || 'auto',
      contexto: (apSet.title || '') + ' ' + (apSet.subtitle || ''), onStatus: t => st.textContent = t });

    const novas = r.pecas.map(p => {
      const alvo = AP.casarPeca(p, items);
      const it = alvo && items.find(i => i.id === alvo);
      const { mapa } = AP.casarSlots(it?.media || [], p.files);
      // Nenhum nome bateu = a peça veio inteira de novo → troca tudo
      const modoAuto = (it && Object.keys(mapa).length) ? 'parcial' : 'tudo';
      return { peca: p, alvo: alvo || 'novo', modoAuto,
               modo: cz.modo === 'tudo' ? 'tudo' : modoAuto };
    });
    // Linhas do Excel sem arte no pacote = só texto
    r.linhas.filter(l => !l._usada).forEach(l => {
      novas.push({ linha: l, alvo: AP.casarLinha(l, items) || '' });
    });
    // Peças casadas por arte também levam o texto da linha delas
    novas.forEach(e => { if (e.peca && e.peca.linha) e.linha = e.peca.linha; });

    cz.entradas.push(...novas);
    st.textContent = `Li ${r.pecas.length} peça(s) com arte` +
      (r.linhas.length ? ` e ${r.linhas.length} linha(s) de planilha` : '') + '. Confira abaixo antes de aplicar.';
    czRender();
  } catch(err){
    st.textContent = 'Não consegui ler: ' + err.message;
  }
}

// O que vai acontecer com cada peça do lote — usado na conferência e
// na aplicação (uma fonte só, pra o que se vê ser o que se faz).
function czPlano(){
  const plano = {};     // itemId -> { it, media:[{velha}|{novo}], trocou, caption, hashtags, publish_at, origens:[] }
  const novas = [];     // peças novas a criar
  const pega = it => plano[it.id] = plano[it.id] || {
    it, media: (it.media||[]).map(m => ({ velha: m, name: m.name, path: m.path })),
    trocou: false, caption: undefined, hashtags: undefined, publish_at: undefined, origens: []
  };

  cz.entradas.forEach((e, idx) => {
    if (!e.alvo) return;
    if (e.alvo === 'novo') { if (e.peca) novas.push(e.peca); return; }
    const it = items.find(i => i.id === e.alvo);
    if (!it) return;
    const pl = pega(it);
    pl.origens.push(idx);

    if (e.peca) {
      const arqs = e.peca.files.map(f => ({ novo: f, name: f.nome, path: f.path }));
      if (e.modo === 'tudo') {
        pl.media = arqs; pl.trocou = true;
      } else {
        const meta = pl.media.map(m => ({ name: m.name, path: m.path }));
        const { mapa, sobra } = AP.casarSlots(meta, e.peca.files);
        Object.entries(mapa).forEach(([i, f]) => {
          pl.media[+i] = { novo: f, name: f.nome, path: pl.media[+i].path || f.path };
        });
        sobra.forEach(f => pl.media.push({ novo: f, name: f.nome, path: f.path }));
        if (Object.keys(mapa).length || sobra.length) pl.trocou = true;
      }
      // Texto vindo de .txt da pasta (sem planilha)
      if (!e.linha && e.peca.fonteLegenda === 'txt') {
        if (e.peca.legenda && e.peca.legenda.trim() !== (it.caption||'').trim()) pl.caption = e.peca.legenda.trim();
        if (e.peca.hashtags && e.peca.hashtags.trim() !== (it.hashtags||'').trim()) pl.hashtags = e.peca.hashtags.trim();
      }
    }
    if (e.linha) {
      const l = e.linha;
      if (l.legenda && l.legenda.trim() !== (it.caption||'').trim()) pl.caption = l.legenda.trim();
      if (l.hashtags && l.hashtags.trim() !== (it.hashtags||'').trim()) pl.hashtags = l.hashtags.trim();
      if (l.data) {
        const pp = l.data.split('/');
        if (pp.length === 3) {
          const novaData = AP.dataBanco(`${pp[2].length===2?'20'+pp[2]:pp[2]}-${pp[1].padStart(2,'0')}-${pp[0].padStart(2,'0')}`, l.hora);
          const iso = AP.quando(novaData);
          if (iso && (!it.publish_at || Math.abs(AP.quando(it.publish_at) - iso) > 59000)) pl.publish_at = novaData;
        }
      }
    }
  });

  const mudou = Object.values(plano).filter(p => p.trocou || p.caption !== undefined
    || p.hashtags !== undefined || p.publish_at !== undefined);
  return { mudou, novas };
}

function czRender(){
  const lista = document.getElementById('czLista');
  if (!lista || !cz) return;
  const { mudou, novas } = czPlano();
  const porItem = {}; mudou.forEach(p => porItem[p.it.id] = p);

  const opcoes = (sel, permiteNovo) => `
    <option value="" ${!sel?'selected':''}>— ignorar —</option>
    ${permiteNovo ? `<option value="novo" ${sel==='novo'?'selected':''}>+ adicionar como peça nova</option>` : ''}
    ${items.map((it, n) => `<option value="${it.id}" ${sel===it.id?'selected':''}>${n+1} · ${esc((it.title||'Peça').slice(0,60))}</option>`).join('')}`;

  const thumb = (m, novo) => {
    const url = novo ? m.novo.url : (m.velha?.thumb || m.velha?.url);
    const vid = novo ? AP.RE.VID.test(m.name||'') : AP.ehVideo(m.velha);
    return vid ? `<video src="${esc(url)}" muted preload="metadata" class="${novo?'novo':''}" title="${esc(m.name||'')}"></video>`
               : `<img src="${esc(url)}" class="${novo?'novo':''}" title="${esc(m.name||'')}">`;
  };

  lista.innerHTML = cz.entradas.map((e, idx) => {
    const nome = e.peca ? e.peca.titulo : (e.linha.titulo || e.linha.arquivos[0] || 'Linha da planilha');
    const src  = e.peca ? (e.peca.individual ? e.peca.files[0].path : e.peca._pasta + '/ · ' + e.peca.files.length + ' arte(s)')
                        : 'só texto · ' + (e.linha._fonte || 'planilha');
    const pl = e.alvo && e.alvo !== 'novo' ? porItem[e.alvo] : null;
    const it = e.alvo && e.alvo !== 'novo' ? items.find(i => i.id === e.alvo) : null;

    let cmp = '';
    if (e.peca && e.alvo === 'novo') {
      cmp = `<div class="cz-cmp"><span class="seta">+</span><div class="lado">${e.peca.files.slice(0,10).map(f => thumb({ novo:f, name:f.nome }, true)).join('')}</div></div>`;
    } else if (pl && pl.trocou) {
      cmp = `<div class="cz-cmp">
        <div class="lado">${(it.media||[]).slice(0,10).map(m => thumb({ velha:m })).join('') || '<span class="ph">vazio</span>'}</div>
        <span class="seta">→</span>
        <div class="lado">${pl.media.slice(0,10).map(m => m.novo ? thumb(m, true) : thumb(m)).join('')}</div></div>`;
    }
    let tx = '';
    if (pl && pl.caption !== undefined) tx += `<div class="cz-tx"><b>LEGENDA NOVA</b>${esc(pl.caption.slice(0,400))}${pl.caption.length>400?'…':''}</div>`;
    if (pl && pl.hashtags !== undefined) tx += `<div class="cz-tx"><b>HASHTAGS NOVAS</b>${esc(pl.hashtags)}</div>`;
    if (pl && pl.publish_at !== undefined) tx += `<div class="cz-tx"><b>NOVA DATA</b>${AP.quando(pl.publish_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>`;

    const nada = e.alvo && e.alvo !== 'novo' && !cmp && !tx;
    const modoSel = (e.peca && it && (it.media||[]).length > 1) ? `
      <select onchange="cz.entradas[${idx}].modo=this.value;czRender()" title="Como trocar as artes desta peça">
        <option value="parcial" ${e.modo==='parcial'?'selected':''}>Só as de mesmo nome</option>
        <option value="tudo" ${e.modo==='tudo'?'selected':''}>Trocar todas</option>
      </select>` : '';

    return `<div class="cz-row ${!e.alvo || nada ? 'off' : ''}">
      <div class="hd">
        <div class="nm">${esc(nome)}<span class="src">${esc(src)}</span></div>
        <select onchange="cz.entradas[${idx}].alvo=this.value;czRender()">${opcoes(e.alvo, !!e.peca)}</select>
        ${modoSel}
      </div>
      ${!e.alvo ? `<div class="ap-tip" style="margin:0">${e.peca ? 'Não achei a peça correspondente — escolha acima ou deixe ignorado.' : 'Linha sem peça correspondente — escolha acima ou deixe ignorada.'}</div>` : ''}
      ${nada ? '<div class="ap-tip" style="margin:0">Igual ao que já está no lote — nada muda.</div>' : ''}
      ${cmp}${tx}
    </div>`;
  }).join('');

  const nArte = mudou.filter(p => p.trocou).length;
  const nTxt  = mudou.filter(p => !p.trocou).length;
  const partes = [];
  if (nArte) partes.push(`${nArte} peça(s) com arte nova`);
  if (nTxt) partes.push(`${nTxt} só com texto`);
  if (novas.length) partes.push(`${novas.length} peça(s) nova(s)`);
  document.getElementById('czInfo').textContent = partes.length ? partes.join(' · ') : 'Nada para aplicar.';
  document.getElementById('czOk').disabled = !partes.length;
}

async function czAplicar(){
  const btn = document.getElementById('czOk');
  const bar = document.getElementById('czBar'), prog = document.getElementById('czProg');
  const info = document.getElementById('czInfo');
  btn.disabled = true;
  prog.style.display = 'block';

  const { mudou, novas } = czPlano();
  // Correção da IA num lote que o cliente já vê: volta pra revisão
  // interna — o gestor confere antes do cliente ver a versão nova.
  if (cz.fonte === 'drive' && !apSet.interno && (mudou.length || novas.length)) {
    const { error: ei } = await sb.from('approval_sets').update({ interno: true }).eq('id', SET_ID);
    if (!ei) { apSet.interno = true; apSet._jaLiberado = true; }
  }
  const totalArq = mudou.reduce((n, p) => n + p.media.filter(m => m.novo).length, 0)
                 + novas.reduce((n, p) => n + p.files.length, 0);
  let feitos = 0, ok = 0;
  const aplicados = new Set();
  const passo = (t) => { feitos++; bar.style.width = Math.round(feitos / Math.max(1,totalArq) * 100) + '%'; info.textContent = t; };

  try {
    for (const pl of mudou) {
      const it = pl.it;
      const finais = [];
      for (const m of pl.media) {
        if (m.novo) { finais.push(await subirMidia(m.novo.file, m.path ? { path: m.path } : null)); passo('Subindo ' + m.name + '…'); }
        else finais.push(m.velha);
      }
      info.textContent = 'Salvando ' + (it.title || 'peça') + '…';
      await registrarVersao(it.id, 'zip');
      const { error } = await sb.rpc('update_approval_item', {
        p_item_id: it.id,
        p_media: finais,
        p_headline: it.headline || null,
        p_caption:  pl.caption  !== undefined ? pl.caption  : (it.caption  || null),
        p_hashtags: pl.hashtags !== undefined ? pl.hashtags : (it.hashtags || null),
        p_publish_at: pl.publish_at !== undefined ? pl.publish_at : (it.publish_at || null),
        p_trocou_arte: pl.trocou,
        p_external_url: it.external_url || null,
        p_pitch: it.pitch || null
      });
      if (error) throw new Error((it.title || 'Peça') + ': ' + error.message);
      ok++; aplicados.add(it.id);
    }

    if (novas.length) {
      let pos = items.reduce((m, i) => Math.max(m, i.position ?? 0), -1) + 1;
      const linhas = [];
      for (const p of novas) {
        const media = [];
        for (const f of p.files) { media.push(await subirMidia(f.file, { path: f.path })); passo('Subindo ' + f.nome + '…'); }
        linhas.push({
          set_id: SET_ID, position: pos++, kind: p.kind,
          title: p.titulo.trim(), caption: (p.legenda||'').trim() || null,
          hashtags: (p.hashtags||'').trim() || null,
          publish_at: AP.dataBanco(p.dataPub, p.horaPub),
          source_key: p.chave, media
        });
      }
      const { error } = await sb.from('approval_items').insert(linhas);
      if (error) throw new Error('Peças novas: ' + error.message);
    }

    if (cz.fonte === 'drive' && apSet.task_id) {
      try { await AP.drive.chamar('revisao', { task_id: apSet.task_id, set_id: SET_ID, liberado: !apSet.interno }); }
      catch(e){ console.warn('Drive revisao:', e.message); }
    }
    fecharCorrecoes();
    showToast(`Correções aplicadas: ${ok} peça(s) atualizada(s)` +
      (novas.length ? `, ${novas.length} nova(s)` : '') + '.', 'success');
    await load();
    return { ok: ok + novas.length };
  } catch(err){
    info.textContent = 'Erro: ' + err.message + (ok ? ` — ${ok} peça(s) já tinham sido salvas.` : '');
    showToast('Erro: ' + err.message, 'error');
    // O que já foi salvo sai da lista: tentar de novo não duplica versão.
    cz.entradas = cz.entradas.filter(e => !aplicados.has(e.alvo));
    btn.disabled = false;
    if (ok) { await load(); czRender(); }
  }
}

// ==================================================================
// MÍDIA — helpers de vídeo/imagem
// ==================================================================
function ehVideo(m){
  return ((m?.mime)||'').startsWith('video') || /\.(mp4|mov|webm|m4v)(\?|$)/i.test(m?.url || m?.name || '');
}
function mediaTagHTML(m, i){
  if (m && m.source === 'drive_link') {
    return `<a href="${esc(m.url)}" target="_blank" rel="noopener" data-i="${i}" style="display:block;padding:44px 16px;text-align:center;
      color:var(--text2);font-size:12.5px;line-height:1.5;text-decoration:none">▶ ${esc(m.name || 'Arquivo')}<br>
      <span style="color:var(--text3)">Arquivo pesado — abrir no Drive</span></a>`;
  }
  if (ehVideo(m)) {
    return `<video src="${esc(m.url || m.thumb)}" data-i="${i}" controls playsinline preload="metadata"></video>`;
  }
  return `<img src="${esc(m.thumb || m.url)}" data-i="${i}" loading="lazy"
    onerror="this.closest('.ap-media').innerHTML='<div style=&quot;padding:38px 16px;text-align:center;color:var(--text3);font-size:12px;line-height:1.5&quot;>Não consegui carregar esta imagem.<br>Confira o compartilhamento da pasta no Drive.</div>'">`;
}
// Clique abre o lightbox — só pra imagem; vídeo tem os próprios controles.
function ligarCliqueMedia(box){
  const img = box.querySelector('img');
  if (!img) return;
  img.onclick = () => {
    const it = items.find(x => x.id === box.dataset.item);
    lbOpen(it, +(img.dataset.i || 0));
  };
}

// ==================================================================
// LIGHTBOX
// ==================================================================
function lbOpen(it, i){
  lb.list = it.media || [];
  lb.i = i;
  lbShow();
  document.getElementById('apLb').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function lbShow(){
  const m = lb.list[lb.i];
  if (!m) return;
  const img = document.getElementById('apLbImg');
  const vid = document.getElementById('apLbVid');
  if (ehVideo(m)) {
    img.style.display = 'none';
    vid.style.display = '';
    vid.src = m.url || m.thumb;
  } else {
    vid.pause?.(); vid.removeAttribute('src');
    vid.style.display = 'none';
    img.style.display = '';
    img.src = m.url || m.thumb;
  }
  document.getElementById('apLbCap').textContent =
    (m.name || '') + (lb.list.length > 1 ? `  ·  ${lb.i+1} de ${lb.list.length}` : '');
}
function lbGo(d){
  if (!lb.list.length) return;
  lb.i = (lb.i + d + lb.list.length) % lb.list.length;
  lbShow();
}
function lbClose(){
  document.getElementById('apLb').classList.remove('on');
  document.getElementById('apLbVid')?.pause?.();
  document.body.style.overflow = '';
}
document.getElementById('apLb').onclick = e => { if (e.target.id === 'apLb') lbClose(); };
document.addEventListener('keydown', e => {
  if (!document.getElementById('apLb').classList.contains('on')) return;
  if (e.key === 'Escape')     lbClose();
  if (e.key === 'ArrowLeft')  lbGo(-1);
  if (e.key === 'ArrowRight') lbGo(1);
});
</script>
<script src="/js/protege.js?v=1">
// celular: seletor de filtro + menu ⋯ com as ferramentas (os botões continuam os mesmos, só mudam de lugar)
(function(){
  const sel = document.getElementById('apSel'), pop = document.getElementById('apMaisPop'), mais = document.getElementById('apMaisBtn');
  if (!sel || !pop || !mais) return;
  const mq = window.matchMedia('(max-width:700px)');
  const rot = { all:['Tudo','nAll'], pendente:['Pendentes','nPend'], aprovado:['Aprovados','nOk'], ajustar:['Com ajustes','nFix'] };
  sel.innerHTML = Object.entries(rot).map(([k,[t]]) => `<option value="${k}">${t}</option>`).join('');
  sel.onchange = () => document.querySelector('.ap-chip[data-f="' + sel.value + '"]')?.click();
  function sync(){
    Object.entries(rot).forEach(([k,[t,id]],i) => { const o = sel.options[i]; const n = document.getElementById(id)?.textContent || ''; if (o) o.textContent = t + (n ? ' · ' + n : ''); });
    const on = document.querySelector('.ap-chip.on')?.dataset.f; if (on && sel.value !== on) sel.value = on;
    const tem = ['btnIA','btnCorr','btnXls','btnPdf','btnZip'].some(id => { const b = document.getElementById(id); return b && b.style.display !== 'none'; });
    mais.style.display = mq.matches && tem ? 'grid' : 'none';
  }
  function mover(){
    const bar = document.querySelector('.ap-bar');
    ['btnIA','btnCorr','btnXls','btnPdf','btnZip'].forEach(id => { const b = document.getElementById(id); if (!b) return;
      if (mq.matches) pop.appendChild(b); else bar.appendChild(b); });
    pop.classList.remove('on'); sync();
  }
  mais.onclick = ev => { ev.stopPropagation(); const r = document.querySelector('.ap-bar').getBoundingClientRect(); pop.style.setProperty('--ap-pop-top', Math.round(r.bottom + 6) + 'px'); pop.classList.toggle('on'); };
  document.addEventListener('click', ev => { if (!ev.target.closest('#apMaisPop')) pop.classList.remove('on'); });
  pop.addEventListener('click', ev => { if (ev.target.closest('button')) setTimeout(() => pop.classList.remove('on'), 50); });
  mq.addEventListener?.('change', mover); mover(); setInterval(sync, 700);
})();
</script>
