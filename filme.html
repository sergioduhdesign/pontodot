<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Design · Filme · Pontodot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#121212;--gray:#6c6c69;--line:rgba(0,0,0,.1);--soft:#f5f5f3;--bg:#fff;--pano:#e9e9e6;--ok:#1f8a55;--bad:#c63d32;--azul:#2f7fd1;--roxo:#7c4dff;--verde:#1f8a55;--lar:#e07a1f}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/1.4 "Helvetica Neue","Inter Tight",system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-rows:48px 1fr 260px;height:100%}
.top{display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--bg)}.top .nome{flex:1;min-width:100px}.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-height:36px}
.btn{font:500 12.5px "Helvetica Neue","Inter Tight";padding:7px 11px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.i{width:36px;height:36px;padding:0;justify-content:center}.btn.s{padding:5px 9px;font-size:12px;min-height:30px}.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meio{display:grid;grid-template-columns:280px 1fr 300px;min-height:0}
.painel{border-right:1px solid var(--line);background:var(--soft);overflow:auto;padding:12px 14px}.painel.dir{border-right:0;border-left:1px solid var(--line)}
h3{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);margin:0 0 8px}h3:not(:first-child){margin-top:14px}.lab{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--gray);margin:10px 0 4px}.vazio{color:var(--gray);font-size:12px;padding:6px 0}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.preview{position:relative;display:grid;place-items:center;background:var(--pano);min-height:0;overflow:hidden}.palco{position:relative;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.3)}.palco video,.palco img,.palco canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.palco canvas{pointer-events:none}
.transp{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;align-items:center}
.midia{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}.midia .it{position:relative;aspect-ratio:1;border-radius:7px;overflow:hidden;background:#ddd;cursor:pointer;border:1px solid var(--line)}.midia .it img{width:100%;height:100%;object-fit:cover}.midia .it small{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:9.5px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.midia .it.aud{display:grid;place-items:center;font-size:22px;background:#2a2a2a;color:#fff}
.tl{border-top:1px solid var(--line);background:var(--soft);display:grid;grid-template-rows:34px 1fr;min-height:0}
.tl-top{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);font-size:12px}
.tl-corpo{position:relative;overflow:auto;}
.trilhas{position:relative;min-width:100%}
.regua{height:22px;position:relative;border-bottom:1px solid var(--line);background:var(--bg);font-size:10px;color:var(--gray)}.regua span{position:absolute;top:3px;border-left:1px solid var(--line);padding-left:3px;height:19px}
.trilha{position:relative;height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center}.trilha .rot{position:sticky;left:0;z-index:3;width:42px;height:100%;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--gray);background:var(--soft);border-right:1px solid var(--line)}
.clip{position:absolute;top:5px;height:36px;border-radius:7px;color:#fff;font-size:11px;padding:0 8px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;cursor:grab;user-select:none;border:2px solid transparent}.clip.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}.clip.v{background:var(--azul)}.clip.t{background:var(--roxo)}.clip.a1{background:var(--verde)}.clip.a2{background:var(--lar)}.clip.img{background:#4a7a9b}.clip .alca{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;background:rgba(255,255,255,.35)}.clip .alca.e{left:0}.clip .alca.d{right:0}
.cab{position:absolute;top:0;bottom:0;width:2px;background:#e5007d;z-index:4;pointer-events:none}.cab i{position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid #e5007d}
.msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:7px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50}.msg.on{opacity:1}
.ocupado{position:fixed;inset:0;display:none;place-items:center;background:rgba(255,255,255,.55);z-index:60}.ocupado.on{display:grid}.ocupado i{width:28px;height:28px;border:3px solid rgba(0,0,0,.15);border-top-color:var(--ink);border-radius:50%;animation:gira .8s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
.anc{display:grid;grid-template-columns:repeat(3,22px);gap:3px}.anc button{width:22px;height:22px;border:1px solid var(--line);background:var(--bg);border-radius:4px;cursor:pointer}.anc button.on{background:var(--ink)}
.sw{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);cursor:pointer;display:inline-block}
</style></head><body><div id="app">
<div class="top">
  <select id="cli" onchange="trocaCliente()" title="Cliente"></select>
  <select id="fmt" onchange="FILME.fmt=this.value;dirty=true;palco()" title="Formato"><option value="v">Filme vertical · 1080×1920</option><option value="h">Filme horizontal · 1920×1080</option><option value="q">Filme quadrado · 1080×1080</option></select>
  <input class="nome" id="nome" placeholder="Nome do filme" value="Filme" onchange="dirty=true;nomeAba()"><small id="salvoEm" class="vazio" style="white-space:nowrap"></small>
  <span class="sep"></span>
  <button class="btn i" onclick="salvar()" title="Salvar (⌘S)"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
  <button class="btn p" onclick="renderizar()" title="Renderiza o MP4 na oficina e guarda no Drive"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg> Gerar saída</button>
</div>
<div class="meio">
  <div class="painel"><h3>Mídia do cliente</h3><div class="row" style="margin-bottom:8px"><label class="btn s" title="Subir do computador"><input type="file" accept="video/*,audio/*,image/*" multiple style="display:none" onchange="subir(this)"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></svg> Subir</label><button class="btn s" onclick="galeria()" title="Reler a pasta MÍDIA do Drive"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button><span class="vazio" style="flex:1">clique = vai pra linha do tempo</span></div>
    <div class="lab">Vídeos e imagens</div><div id="mVid" class="midia"></div><div class="lab">Áudios</div><div id="mAud" class="midia"></div><div id="mMsg" class="vazio"></div>
    <h3>Texto</h3><div class="row"><button class="btn s" onclick="addTexto()"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6"/></svg> Texto sobre o filme</button></div></div>
  <div class="preview" id="preview"><div class="palco" id="palco"><video id="pv" playsinline></video><img id="pi" alt="" style="display:none"><canvas id="pc"></canvas></div>
    <div class="transp"><button class="btn i" onclick="irInicio()" title="Início"><svg viewBox="0 0 24 24"><path d="M6 5v14M20 5l-11 7 11 7z"/></svg></button><button class="btn i" id="bPlay" onclick="playPause()" title="Play / pausa (espaço)"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><span id="tempo" style="background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-variant-numeric:tabular-nums;font-size:12px">0:00 / 0:00</span></div></div>
  <div class="painel dir" id="props"><div class="vazio">Selecione um clipe na linha do tempo.</div></div>
</div>
<div class="tl"><div class="tl-top"><b>Linha do tempo</b><span class="vazio" id="tlInfo"></span><span style="flex:1"></span><span class="vazio">zoom</span><input type="range" min="20" max="300" value="80" style="min-height:0;padding:0;width:120px" oninput="TL.pps=+this.value;tlPinta()"><button class="btn s" onclick="apagarSel()" title="Apagar o selecionado (Delete)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>
  <div class="tl-corpo" id="tlCorpo" onclick="tlClique(event)"><div class="trilhas" id="trilhas"></div></div></div>
</div>
<div class="msg" id="msg"></div><div class="ocupado" id="ocupado"><i></i></div>
<script>
const SB_URL='https://ibkflplbraltewsjjsqm.supabase.co',SB_KEY='sb_publishable_M5Wws9n27ONN9JmG_qXbSg_e3U1xFxD';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb,ses,CLIS=[],KIT=null,dirty=false,PECA={id:null,client_id:null};
const FMT={v:[1080,1920],h:[1920,1080],q:[1080,1080]};
// o filme: trilhas V (clipes em sequência), T (textos com início e duração), A1 trilha, A2 locução
let FILME={fmt:'v',v:[],t:[],a1:null,a2:null};
const TL={pps:80,sel:null,t:0,tocando:false};
let OCUP=0;function ocupa(){OCUP++;$('#ocupado').classList.add('on');}function desocupa(){OCUP=Math.max(0,OCUP-1);if(!OCUP)$('#ocupado').classList.remove('on');}
let MSGT;function msg(t,ms=3500){const e=$('#msg');e.textContent=t;e.classList.add('on');clearTimeout(MSGT);MSGT=setTimeout(()=>e.classList.remove('on'),ms);}
async function api(arq,b){ocupa();try{const r=await fetch('/'+arq,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ses.access_token},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erro '+r.status);return j;}finally{desocupa();}}
function nomeAba(){try{parent.postMessage({tipo:'est-nome',nome:$('#nome').value||'Filme',dirty},'*');}catch(e){}}
function avisa(texto){try{parent.postMessage({tipo:'est-aviso',texto,quem:null,peca:$('#nome').value},'*');}catch(e){}}
const q=new URLSearchParams(location.search);
async function boot(){sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{autoRefreshToken:false}});ses=(await sb.auth.getSession()).data.session;if(!ses){document.body.innerHTML='<div style="padding:20px">Entre na PD primeiro.</div>';return;}
  const {data}=await sb.from('clients').select('id,name,active').order('name');CLIS=(data||[]).filter(c=>c.active!==false);$('#cli').innerHTML='<option value="">Escolha o cliente</option>'+CLIS.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  if(q.get('cliente'))$('#cli').value=q.get('cliente');
  if(q.get('peca'))await abrir(q.get('peca'));else await trocaCliente();
  palco();tlPinta();nomeAba();window.addEventListener('resize',palco);document.addEventListener('keydown',teclas);
  setInterval(()=>{if(dirty&&PECA.client_id)salvar(true);},5000);}
async function trocaCliente(){PECA.client_id=$('#cli').value||null;KIT=null;if(PECA.client_id){try{const {data}=await sb.from('brand_kits').select('*').eq('client_id',PECA.client_id).maybeSingle();KIT=data||null;}catch(e){}await galeria();}}
// ---------- mídia
let GAL=[];
async function galeria(){if(!PECA.client_id){$('#mMsg').textContent='Escolha o cliente.';return;}$('#mMsg').textContent='Lendo a pasta MÍDIA…';try{const r=await api('pd-estudio.php',{acao:'galeria',client_id:PECA.client_id});GAL=r.itens||[];
  const vid=GAL.filter(x=>x.tipo==='video'||x.tipo==='foto'),aud=GAL.filter(x=>x.tipo==='audio');
  $('#mVid').innerHTML=vid.map((x,i)=>`<div class="it" title="${esc(x.nome)}" onclick="midiaAdd(${i})">${x.thumb?`<img src="${esc(x.thumb)}">`:`<div style="display:grid;place-items:center;height:100%;background:#2a2a2a;color:#fff;font-size:20px">▶</div>`}<small>${esc(x.nome)}</small></div>`).join('')||'<div class="vazio" style="grid-column:1/-1">Nada em MÍDIA. Suba aqui ou solte na pasta do Drive.</div>';
  $('#mAud').innerHTML=aud.map(x=>`<div class="it aud" title="${esc(x.nome)}"><span>♪</span><small>${esc(x.nome)}</small><div style="position:absolute;top:3px;right:3px;display:flex;gap:2px"><button class="btn s" style="min-height:0;padding:2px 5px;font-size:10px" onclick="event.stopPropagation();audioSet('a1','${esc(location.origin+x.arquivo)}','${esc(x.nome)}')" title="Usar como trilha">trilha</button><button class="btn s" style="min-height:0;padding:2px 5px;font-size:10px" onclick="event.stopPropagation();audioSet('a2','${esc(location.origin+x.arquivo)}','${esc(x.nome)}')" title="Usar como locução">voz</button></div></div>`).join('')||'<div class="vazio" style="grid-column:1/-1">Sem áudios.</div>';
  $('#mMsg').textContent='';}catch(e){$('#mMsg').textContent=e.message;}}
function midiaAdd(i){const vid=GAL.filter(x=>x.tipo==='video'||x.tipo==='foto');const x=vid[i];if(!x)return;const url=location.origin+x.arquivo;if(x.tipo==='foto'){FILME.v.push({tipo:'img',url:x.cheia?location.origin+x.cheia:url,nome:x.nome,dur:4,trans:'corte'});dirty=true;tlPinta();return;}
  const vd=document.createElement('video');vd.preload='metadata';vd.src=url;vd.onloadedmetadata=()=>{FILME.v.push({tipo:'vid',url,nome:x.nome,dur:vd.duration||5,ini:0,fim:null,vol:1,mudo:false,trans:'corte'});dirty=true;tlPinta();};vd.onerror=()=>{FILME.v.push({tipo:'vid',url,nome:x.nome,dur:5,ini:0,fim:null,vol:1,mudo:false,trans:'corte'});dirty=true;tlPinta();};}
async function subir(inp){const fs=[...inp.files];inp.value='';for(const f of fs){try{const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);});const r=await api('pd-oficina.php',{acao:'anexar',arquivo:{nome:f.name,mime:f.type,b64}});
    if(f.type.startsWith('audio/'))audioSet(FILME.a1?'a2':'a1',r.url,f.name);else if(f.type.startsWith('image/'))FILME.v.push({tipo:'img',url:r.url,nome:f.name,dur:4,trans:'corte'});else{const vd=document.createElement('video');vd.preload='metadata';vd.src=r.url;await new Promise(res=>{vd.onloadedmetadata=res;vd.onerror=res;});FILME.v.push({tipo:'vid',url:r.url,nome:f.name,dur:vd.duration||5,ini:0,fim:null,vol:1,mudo:false,trans:'corte'});}
    dirty=true;tlPinta();}catch(e){msg(e.message,6000);}}}
function audioSet(k,url,nome){FILME[k]={url,nome,vol:k==='a1'?.35:1,ini:0};dirty=true;tlPinta();msg((k==='a1'?'Trilha':'Locução')+': '+nome);}
function addTexto(){const t0=TL.t||0;FILME.t.push({texto:'Seu texto aqui',ini:t0,dur:3,tam:7,cor:'#ffffff',fundo:'',anc:4,fonte:(KIT&&KIT.fonts&&KIT.fonts[0]&&KIT.fonts[0].name)||'Inter',peso:'700'});TL.sel={k:'t',i:FILME.t.length-1};dirty=true;tlPinta();propsUI();}
// ---------- tempo
const durClip=c=>c.tipo==='img'?(+c.dur||4):Math.max(.1,((c.fim==null?c.dur:c.fim)-(c.ini||0)));
function total(){return FILME.v.reduce((a,c)=>a+durClip(c),0);}
function iniDe(i){let t=0;for(let k=0;k<i;k++)t+=durClip(FILME.v[k]);return t;}
function fmtT(s){s=Math.max(0,s||0);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
// ---------- linha do tempo
function tlPinta(){const el=$('#trilhas');const pps=TL.pps;const T=Math.max(total(),FILME.t.reduce((a,t)=>Math.max(a,t.ini+t.dur),0),(FILME.a1?(FILME.a1.ini||0)+30:0),10)+5;const L=42;el.style.width=(L+T*pps+40)+'px';
  const regua=`<div class="regua"><div style="position:sticky;left:0;width:42px;height:100%;background:var(--soft);display:inline-block;z-index:3;border-right:1px solid var(--line)"></div>${Array.from({length:Math.ceil(T)+1}).map((_,s)=>s%(pps<40?5:pps<80?2:1)?'':`<span style="left:${L+s*pps}px">${fmtT(s)}</span>`).join('')}</div>`;
  const sel=TL.sel;const on=(k,i)=>sel&&sel.k===k&&sel.i===i?'on':'';
  let x=L;const vcl=FILME.v.map((c,i)=>{const w=durClip(c)*pps;const h=`<div class="clip ${c.tipo==='img'?'img':'v'} ${on('v',i)}" style="left:${x}px;width:${Math.max(24,w)}px" draggable="true" ondragstart="tlDrag(event,'v',${i})" ondragover="event.preventDefault()" ondrop="tlDrop(event,${i})" onclick="event.stopPropagation();sel('v',${i})" title="${esc(c.nome)} · ${durClip(c).toFixed(1)}s${c.trans==='fade'?' · fade':''}">${c.tipo==='vid'?`<span class="alca e" onpointerdown="alca(event,${i},'e')"></span>`:''}<span style="overflow:hidden;text-overflow:ellipsis">${c.tipo==='img'?'🖼 ':''}${esc(c.nome)}</span>${c.trans==='fade'?'<small style="opacity:.8">⟋</small>':''}<span class="alca d" onpointerdown="alca(event,${i},'d')"></span></div>`;x+=w;return h;}).join('');
  const tcl=FILME.t.map((t,i)=>`<div class="clip t ${on('t',i)}" style="left:${L+t.ini*pps}px;width:${Math.max(24,t.dur*pps)}px" onpointerdown="moveT(event,${i})" onclick="event.stopPropagation();sel('t',${i})" title="${esc(t.texto)}">T · ${esc(t.texto)}<span class="alca d" onpointerdown="event.stopPropagation();alcaT(event,${i})"></span></div>`).join('');
  const acl=(k,cls)=>{const a=FILME[k];if(!a)return '';return `<div class="clip ${cls} ${on(k,0)}" style="left:${L+(a.ini||0)*pps}px;width:${Math.max(60,Math.min(T,total()||30)*pps)}px" onclick="event.stopPropagation();sel('${k}',0)" title="${esc(a.nome)}">♪ ${esc(a.nome)} · vol ${Math.round((a.vol??1)*100)}%</div>`;};
  el.innerHTML=regua+`<div class="trilha"><div class="rot">V</div>${vcl}</div><div class="trilha"><div class="rot">T</div>${tcl}</div><div class="trilha" style="height:36px"><div class="rot">A1</div>${acl('a1','a1')}</div><div class="trilha" style="height:36px"><div class="rot">A2</div>${acl('a2','a2')}</div><div class="cab" id="cab" style="left:${L+TL.t*pps}px"><i></i></div>`;
  $('#tlInfo').textContent=FILME.v.length+' clipe'+(FILME.v.length!==1?'s':'')+' · '+fmtT(total())+(FILME.t.length?' · '+FILME.t.length+' texto'+(FILME.t.length>1?'s':''):'');$('#tempo').textContent=fmtT(TL.t)+' / '+fmtT(total());}
function sel(k,i){TL.sel={k,i};tlPinta();propsUI();}
function tlClique(e){const r=$('#trilhas').getBoundingClientRect();const x=e.clientX-r.left-42;if(x<0)return;TL.t=Math.max(0,Math.min(total(),x/TL.pps));pausa();mostraEm(TL.t);tlPinta();}
let TDRAG=null;function tlDrag(e,k,i){TDRAG={k,i};e.dataTransfer.effectAllowed='move';}
function tlDrop(e,i){e.preventDefault();if(!TDRAG||TDRAG.k!=='v')return;const [c]=FILME.v.splice(TDRAG.i,1);FILME.v.splice(i,0,c);TDRAG=null;dirty=true;TL.sel={k:'v',i};tlPinta();propsUI();}
function alca(e,i,lado){e.stopPropagation();e.preventDefault();const c=FILME.v[i];const x0=e.clientX;const ini0=c.ini||0,fim0=c.fim==null?c.dur:c.fim,dur0=c.dur;const mv=ev=>{const d=(ev.clientX-x0)/TL.pps;if(c.tipo==='img'){c.dur=Math.max(.5,dur0+d);}else if(lado==='e')c.ini=Math.max(0,Math.min(fim0-.2,ini0+d));else c.fim=Math.max((c.ini||0)+.2,Math.min(c.dur,fim0+d));tlPinta();};const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);dirty=true;propsUI();};document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);}
function moveT(e,i){if(e.target.classList.contains('alca'))return;e.preventDefault();const t=FILME.t[i];const x0=e.clientX,ini0=t.ini;let mexeu=false;const mv=ev=>{const d=(ev.clientX-x0)/TL.pps;if(Math.abs(d)>.02)mexeu=true;t.ini=Math.max(0,ini0+d);tlPinta();};const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);if(mexeu)dirty=true;sel('t',i);};document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);}

function apagarSel(){const s=TL.sel;if(!s)return;if(s.k==='v')FILME.v.splice(s.i,1);else if(s.k==='t')FILME.t.splice(s.i,1);else FILME[s.k]=null;TL.sel=null;dirty=true;tlPinta();propsUI();}
function teclas(e){const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;if(e.code==='Space'){e.preventDefault();playPause();}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();apagarSel();}if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();salvar();}}
// ---------- propriedades
function propsUI(){const el=$('#props');const s=TL.sel;if(!s){el.innerHTML='<div class="vazio">Selecione um clipe na linha do tempo.</div>';return;}
  const num=(lab,val,fn,step=.1,min=0)=>`<div class="lab">${lab}</div><input type="number" step="${step}" min="${min}" value="${Math.round(val*100)/100}" onchange="${fn}" style="width:100%">`;
  if(s.k==='v'){const c=FILME.v[s.i];if(!c){TL.sel=null;propsUI();return;}
    el.innerHTML=`<h3>${c.tipo==='img'?'Imagem':'Clipe de vídeo'}</h3><div style="font-size:12px;word-break:break-all">${esc(c.nome)}</div>`+(c.tipo==='img'?num('Duração (s)',c.dur,`FILME.v[${s.i}].dur=+this.value;dirty=true;tlPinta()`):num('Começa em (s)',c.ini||0,`FILME.v[${s.i}].ini=+this.value;dirty=true;tlPinta()`)+num('Termina em (s)',c.fim==null?c.dur:c.fim,`FILME.v[${s.i}].fim=+this.value;dirty=true;tlPinta()`)+`<div class="lab">Áudio do clipe</div><div class="row"><input type="range" min="0" max="1" step=".05" value="${c.vol??1}" style="min-height:0;padding:0;flex:1" oninput="FILME.v[${s.i}].vol=+this.value;dirty=true"><button class="btn s ${c.mudo?'on':''}" onclick="FILME.v[${s.i}].mudo=!FILME.v[${s.i}].mudo;dirty=true;propsUI()">mudo</button></div>`)+
      `<div class="lab">Transição para o próximo</div><div class="row"><button class="btn s ${c.trans!=='fade'?'on':''}" onclick="FILME.v[${s.i}].trans='corte';dirty=true;tlPinta();propsUI()">corte</button><button class="btn s ${c.trans==='fade'?'on':''}" onclick="FILME.v[${s.i}].trans='fade';dirty=true;tlPinta();propsUI()">fade</button></div><div class="vazio" style="margin-top:8px">O clipe entra inteiro no quadro (cobrir e cortar), na ordem da trilha V. Arraste pra reordenar; alças nas pontas cortam.</div>`;}
  else if(s.k==='t'){const t=FILME.t[s.i];if(!t){TL.sel=null;propsUI();return;}const fontes=[...new Set([...(KIT&&KIT.fonts||[]).map(f=>f.name),'Inter','Montserrat','Poppins','Playfair Display','Bebas Neue','Oswald'])];
    el.innerHTML=`<h3>Texto</h3><textarea style="width:100%;min-height:70px" onchange="FILME.t[${s.i}].texto=this.value;dirty=true;tlPinta();mostraEm(TL.t)">${esc(t.texto)}</textarea>
      <div class="lab">Fonte</div><select style="width:100%" onchange="FILME.t[${s.i}].fonte=this.value;dirty=true;mostraEm(TL.t)">${fontes.map(f=>`<option ${t.fonte===f?'selected':''}>${esc(f)}</option>`).join('')}</select>
      <div class="row" style="margin-top:6px"><div style="flex:1">${num('Tamanho (% da largura)',t.tam,`FILME.t[${s.i}].tam=+this.value;dirty=true;mostraEm(TL.t)`,.5,1)}</div><div style="flex:1"><div class="lab">Peso</div><select style="width:100%" onchange="FILME.t[${s.i}].peso=this.value;dirty=true;mostraEm(TL.t)"><option value="400" ${t.peso=='400'?'selected':''}>Regular</option><option value="700" ${t.peso=='700'?'selected':''}>Bold</option><option value="900" ${t.peso=='900'?'selected':''}>Black</option></select></div></div>
      <div class="lab">Cor</div><div class="row"><input type="color" value="${t.cor}" style="width:40px;padding:2px" oninput="FILME.t[${s.i}].cor=this.value;dirty=true;mostraEm(TL.t)">${(KIT&&KIT.colors||[]).map(c=>`<span class="sw" style="background:${esc(c.hex)}" onclick="FILME.t[${s.i}].cor='${esc(c.hex)}';dirty=true;propsUI();mostraEm(TL.t)"></span>`).join('')}</div>
      <div class="lab">Caixa atrás</div><div class="row"><button class="btn s ${!t.fundo?'on':''}" onclick="FILME.t[${s.i}].fundo='';dirty=true;propsUI();mostraEm(TL.t)">sem</button>${(KIT&&KIT.colors||[{hex:'#121212'}]).map(c=>`<span class="sw" style="background:${esc(c.hex)};${t.fundo===c.hex?'outline:2px solid var(--ink)':''}" onclick="FILME.t[${s.i}].fundo='${esc(c.hex)}';dirty=true;propsUI();mostraEm(TL.t)"></span>`).join('')}</div>
      <div class="lab">Posição</div><div class="anc">${[0,1,2,3,4,5,6,7,8].map(a=>`<button class="${t.anc===a?'on':''}" onclick="FILME.t[${s.i}].anc=${a};dirty=true;propsUI();mostraEm(TL.t)"></button>`).join('')}</div>
      <div class="row" style="margin-top:6px"><div style="flex:1">${num('Entra em (s)',t.ini,`FILME.t[${s.i}].ini=+this.value;dirty=true;tlPinta()`)}</div><div style="flex:1">${num('Duração (s)',t.dur,`FILME.t[${s.i}].dur=+this.value;dirty=true;tlPinta()`,.1,.3)}</div></div>`;}
  else{const a=FILME[s.k];if(!a){TL.sel=null;propsUI();return;}el.innerHTML=`<h3>${s.k==='a1'?'Trilha':'Locução'}</h3><div style="font-size:12px;word-break:break-all">${esc(a.nome)}</div><div class="lab">Volume</div><input type="range" min="0" max="1" step=".05" value="${a.vol??1}" style="min-height:0;padding:0;width:100%" oninput="FILME['${s.k}'].vol=+this.value;dirty=true;tlPinta()">`+num('Entra em (s)',a.ini||0,`FILME['${s.k}'].ini=+this.value;dirty=true;tlPinta()`)+`<div class="vazio" style="margin-top:8px">Toca junto do filme inteiro a partir desse ponto; corta no fim.</div>`;}}
// ---------- palco e prévia
function palco(){const [w,h]=FMT[FILME.fmt]||FMT.v;const p=$('#preview'),pl=$('#palco');const k=Math.min((p.clientWidth-40)/w,(p.clientHeight-70)/h);pl.style.width=Math.round(w*k)+'px';pl.style.height=Math.round(h*k)+'px';const c=$('#pc');c.width=w;c.height=h;$('#fmt').value=FILME.fmt;mostraEm(TL.t);}
function clipEm(t){let acc=0;for(let i=0;i<FILME.v.length;i++){const d=durClip(FILME.v[i]);if(t<acc+d||i===FILME.v.length-1)return {i,c:FILME.v[i],off:t-acc};acc+=d;}return null;}
function mostraEm(t){const pv=$('#pv'),pi=$('#pi');const e=clipEm(t);if(!e){pv.style.display='none';pi.style.display='none';desenhaTextos(t);return;}
  if(e.c.tipo==='img'){pv.style.display='none';pi.style.display='';if(pi.src!==e.c.url)pi.src=e.c.url;}else{pi.style.display='none';pv.style.display='';if(pv.dataset.url!==e.c.url){pv.dataset.url=e.c.url;pv.src=e.c.url;pv.muted=true;}if(!TL.tocando){try{pv.currentTime=(e.c.ini||0)+e.off;}catch(x){}}}
  desenhaTextos(t);}
function desenhaTextos(t){const c=$('#pc'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);const W=c.width,H=c.height;
  FILME.t.filter(tx=>t>=tx.ini&&t<tx.ini+tx.dur).forEach(tx=>{const fs=W*(tx.tam||7)/100;x.font=`${tx.peso||'700'} ${fs}px "${tx.fonte||'Inter'}",sans-serif`;const linhas=String(tx.texto||'').split('\n');const col=(tx.anc||4)%3,row=Math.floor((tx.anc||4)/3);const pad=W*.06;const lh=fs*1.15;const bh=linhas.length*lh;
    x.textAlign=col===0?'left':col===2?'right':'center';x.textBaseline='top';const px=col===0?pad:col===2?W-pad:W/2;const py=row===0?pad:row===2?H-pad-bh:(H-bh)/2;
    if(tx.fundo){x.fillStyle=tx.fundo;const tw=Math.max(...linhas.map(l=>x.measureText(l).width));const bx=col===0?px-fs*.3:col===2?px-tw-fs*.3:px-tw/2-fs*.3;x.fillRect(bx,py-fs*.15,tw+fs*.6,bh+fs*.3);}
    x.fillStyle=tx.cor||'#fff';if(!tx.fundo){x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=fs*.25;}linhas.forEach((l,i)=>x.fillText(l,px,py+i*lh));x.shadowBlur=0;});}
let TICK=null,A1=null,A2=null;
function playPause(){if(TL.tocando)pausa();else play();}
function play(){if(!FILME.v.length){msg('Coloque um clipe na linha do tempo.');return;}if(TL.t>=total()-.05)TL.t=0;TL.tocando=true;$('#bPlay').innerHTML='<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
  const pv=$('#pv');let atual=null;let t0=performance.now()-TL.t*1000;
  const aud=(k,A)=>{const a=FILME[k];if(!a)return null;const el=A||new Audio();el.src=a.url;el.volume=a.vol??1;const off=TL.t-(a.ini||0);if(off>=0){el.currentTime=off;el.play().catch(()=>{});}else setTimeout(()=>{if(TL.tocando){el.currentTime=0;el.play().catch(()=>{});}},-off*1000);return el;};A1=aud('a1',A1);A2=aud('a2',A2);
  const passo=()=>{if(!TL.tocando)return;TL.t=(performance.now()-t0)/1000;if(TL.t>=total()){TL.t=total();pausa();mostraEm(TL.t);return;}const e=clipEm(TL.t);
    if(e&&(!atual||atual.i!==e.i)){atual=e;mostraEm(TL.t);if(e.c.tipo==='vid'){pv.muted=!!e.c.mudo;pv.volume=e.c.vol??1;try{pv.currentTime=(e.c.ini||0)+e.off;}catch(x){}pv.play().catch(()=>{});}else pv.pause();}
    else desenhaTextos(TL.t);
    $('#cab').style.left=(42+TL.t*TL.pps)+'px';$('#tempo').textContent=fmtT(TL.t)+' / '+fmtT(total());TICK=requestAnimationFrame(passo);};TICK=requestAnimationFrame(passo);}
function pausa(){TL.tocando=false;cancelAnimationFrame(TICK);$('#pv').pause();if(A1)A1.pause();if(A2)A2.pause();$('#bPlay').innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';tlPinta();}
function irInicio(){pausa();TL.t=0;mostraEm(0);tlPinta();}
// ---------- salvar / abrir
async function thumb(){const c=document.createElement('canvas');const [w,h]=FMT[FILME.fmt];c.width=400;c.height=Math.round(400*h/w);const x=c.getContext('2d');x.fillStyle='#111';x.fillRect(0,0,c.width,c.height);try{const e=clipEm(0);if(e){if(e.c.tipo==='img'){const im=new Image();im.crossOrigin='anonymous';im.src=e.c.url;await new Promise(r=>{im.onload=r;im.onerror=r;});x.drawImage(im,0,0,c.width,c.height);}else{const pv=$('#pv');if(pv.readyState>=2)x.drawImage(pv,0,0,c.width,c.height);}}}catch(err){}x.drawImage($('#pc'),0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7);}
async function salvar(silencio){if(!PECA.client_id){if(!silencio){msg('Escolha o cliente.');}return false;}const [w,h]=FMT[FILME.fmt];
  try{const r=await api('pd-estudio.php',{acao:'salvar',id:PECA.id,client_id:PECA.client_id,nome:$('#nome').value||'Filme',formato:{tipo:'filme-'+FILME.fmt,nome:'Filme '+(FILME.fmt==='v'?'vertical':FILME.fmt==='h'?'horizontal':'quadrado'),w,h},doc:{version:'5',objects:[],filme:FILME},thumb:await thumb()});PECA.id=r.peca.id;dirty=false;$('#salvoEm').textContent='salvo '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});nomeAba();if(!silencio)msg('Salvo.');return true;}catch(e){if(!silencio)msg(e.message,6000);return false;}}
async function abrir(id){try{const {peca:p}=await api('pd-estudio.php',{acao:'abrir',id});PECA.id=p.id;$('#cli').value=p.client_id||'';await trocaCliente();$('#nome').value=p.nome;FILME=Object.assign({fmt:'v',v:[],t:[],a1:null,a2:null},(p.doc&&p.doc.filme)||{});if(!FMT[FILME.fmt])FILME.fmt='v';}catch(e){msg(e.message,6000);}}
async function antesDeSair(){if(!dirty)return true;return await salvar(true);}
// ---------- render (oficina): V em sequência; textos viram camada PNG por cena; A1/A2 por cima
async function renderizar(){if(!PECA.client_id){msg('Escolha o cliente.');return;}if(!FILME.v.length){msg('Coloque pelo menos um clipe.');return;}if(!await salvar(true))return;const [w,h]=FMT[FILME.fmt];ocupa();
  try{const cenas=[];let acc=0;for(const c of FILME.v){const d=durClip(c);const ativos=FILME.t.filter(t=>t.ini<acc+d&&t.ini+t.dur>acc);let topo=null;
      if(ativos.length){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const save=$('#pc');const tmp=FILME.t;FILME.t=ativos;const old=$('#pc');document.body.appendChild(cv);cv.id='pcTmp';const x=cv.getContext('2d');x.clearRect(0,0,w,h);
        ativos.forEach(tx=>{const fs=w*(tx.tam||7)/100;x.font=`${tx.peso||'700'} ${fs}px "${tx.fonte||'Inter'}",sans-serif`;const linhas=String(tx.texto||'').split('\n');const col=(tx.anc||4)%3,row=Math.floor((tx.anc||4)/3);const pad=w*.06,lh=fs*1.15,bh=linhas.length*lh;x.textAlign=col===0?'left':col===2?'right':'center';x.textBaseline='top';const px=col===0?pad:col===2?w-pad:w/2;const py=row===0?pad:row===2?h-pad-bh:(h-bh)/2;if(tx.fundo){x.fillStyle=tx.fundo;const tw=Math.max(...linhas.map(l=>x.measureText(l).width));const bx=col===0?px-fs*.3:col===2?px-tw-fs*.3:px-tw/2-fs*.3;x.fillRect(bx,py-fs*.15,tw+fs*.6,bh+fs*.3);}x.fillStyle=tx.cor||'#fff';if(!tx.fundo){x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=fs*.25;}linhas.forEach((l,i)=>x.fillText(l,px,py+i*lh));x.shadowBlur=0;});
        FILME.t=tmp;const b64=cv.toDataURL('image/png');cv.remove();topo=(await api('pd-oficina.php',{acao:'anexar',arquivo:{nome:'topo-'+cenas.length+'.png',mime:'image/png',b64}})).url;}
      if(c.tipo==='img')cenas.push({dur:d,trans:c.trans||'corte',fundo_url:c.url,topo_url:topo,clipes:[]});
      else cenas.push({dur:d,trans:c.trans||'corte',fundo_url:null,topo_url:topo,clipes:[{url:c.url,ini:c.ini||0,fim:c.fim==null?null:c.fim,x:0,y:0,w,h,vol:c.vol??1,mudo:!!c.mudo}]});acc+=d;}
    const nome=($('#nome').value||'filme').replace(/[\/\\:*?"<>|]+/g,'-');
    const r=await api('pd-oficina.php',{acao:'pedir',modulo:'video',titulo:'Filme · '+nome,client_id:PECA.client_id,ok_agora:true,entrada:{nome,w,h,fps:30,cenas,trilha:FILME.a1,locucao:FILME.a2,drive_subpasta:'ESTÚDIO/'+nome,pedido:'Filme do Studio Design: '+cenas.length+' cenas, '+fmtT(total())}});
    msg(r.trabalho&&r.trabalho.status==='fila'?'Na oficina. O MP4 cai em Saída de materiais e em cliente › ESTÚDIO › '+nome+' em alguns minutos; eu aviso.':'Pedido: '+(r.trabalho&&r.trabalho.status),9000);
    if(r.trabalho){const id=r.trabalho.id;const t=setInterval(async()=>{try{const j=await api('pd-oficina.php',{acao:'ver',id});const st=j.trabalho&&j.trabalho.status;if(st==='pronto'){clearInterval(t);avisa('Terminei o filme '+nome+'! Está em Saída de materiais e no Drive.');}else if(st==='erro'){clearInterval(t);avisa('Não consegui terminar o filme '+nome+': '+(j.trabalho.erro||'erro'));}}catch(e){}},40000);}}
  catch(e){msg(e.message,8000);}finally{desocupa();}}
boot();
