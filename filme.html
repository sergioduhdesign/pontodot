<script>
const SB_URL='https://ibkflplbraltewsjjsqm.supabase.co',SB_KEY='sb_publishable_M5Wws9n27ONN9JmG_qXbSg_e3U1xFxD';

async function api(arq,b,txt){const q=b&&b._q;if(q){b=Object.assign({},b);delete b._q;}if(!q)ocupa(txt||({galeria:'Lendo a mídia do cliente…',salvar:'Salvando…',pedir:'Mandando pra oficina…',anexar:'Subindo arquivo…',banco_ver:'Lendo a pasta…',inicio:'Carregando…'}[b&&b.acao]||'Pensando…'));try{const r=await fetch('/'+arq,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ses.access_token},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erro '+r.status);return j;}finally{if(!q)desocupa();}}

async function boot(){sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{autoRefreshToken:false}});ses=(await sb.auth.getSession()).data.session;if(!ses){document.body.innerHTML='<div style="padding:20px">Entre na PD primeiro.</div>';return;}

async function trocaCliente(){PECA.client_id=$('#cli').value||null;CID=PECA.client_id;KIT=null;if(PECA.client_id){try{const {data}=await sb.from('brand_kits').select('*').eq('client_id',PECA.client_id).maybeSingle();KIT=data||null;}catch(e){}await galeria();copysCarrega();}dsUI();}
// ---------- mídia
let GAL=[];
async function galeria(){if(!PECA.client_id){$('#mMsg').textContent='Escolha o cliente.';return;}$('#mMsg').textContent='Lendo a pasta MÍDIA…';try{const r=await api('pd-estudio.php',{acao:'galeria',client_id:PECA.client_id});GAL=r.itens||[];
  const vid=GAL.filter(x=>x.tipo==='video'||x.tipo==='foto'),aud=GAL.filter(x=>x.tipo==='audio');
  $('#mVid').innerHTML=vid.map((x,i)=>`<div class="it" title="${esc(x.nome)}" onclick="midiaAdd(${i})">${x.thumb?`<img src="${esc(x.thumb)}">`:`<div style="display:grid;place-items:center;height:100%;background:#2a2a2a;color:#fff;font-size:20px">▶</div>`}<small>${esc(x.nome)}</small></div>`).join('')||'<div class="vazio" style="grid-column:1/-1">Nada em MÍDIA. Suba aqui ou solte na pasta do Drive.</div>';
  $('#mAud').innerHTML=aud.map(x=>`<div class="it aud" title="${esc(x.nome)}"><span>♪</span><small>${esc(x.nome)}</small><div style="position:absolute;top:3px;right:3px;display:flex;gap:2px"><button class="btn s" style="min-height:0;padding:2px 5px;font-size:10px" onclick="event.stopPropagation();audioSet('a1','${esc(location.origin+x.arquivo)}','${esc(x.nome)}')" title="Usar como trilha">trilha</button><button class="btn s" style="min-height:0;padding:2px 5px;font-size:10px" onclick="event.stopPropagation();audioSet('a2','${esc(location.origin+x.arquivo)}','${esc(x.nome)}')" title="Usar como locução">voz</button></div></div>`).join('')||'<div class="vazio" style="grid-column:1/-1">Sem áudios.</div>';
  $('#mMsg').textContent='';}catch(e){$('#mMsg').textContent=e.message;}}
function midiaAdd(i){const vid=GAL.filter(x=>x.tipo==='video'||x.tipo==='foto');const x=vid[i];if(!x)return;pdStudio.observa('clipe',{tipo:x.tipo});const url=location.origin+x.arquivo;if(x.tipo==='foto'){FILME.v.push({tipo:'img',url:x.cheia?location.origin+x.cheia:url,nome:x.nome,dur:4,trans:'corte'});dirty=true;tlPinta();return;}

async function subir(inp){const fs=[...inp.files];inp.value='';for(const f of fs){try{const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);});const r=await api('pd-oficina.php',{acao:'anexar',arquivo:{nome:f.name,mime:f.type,b64}});

// ---------- tempo
const durClip=c=>c.tipo==='img'||c.tipo==='packshot'?(+c.dur||4):Math.max(.1,((c.fim==null?c.dur:c.fim)-(c.ini||0)));
function total(){return FILME.v.reduce((a,c)=>a+durClip(c),0);}
function iniDe(i){let t=0;for(let k=0;k<i;k++)t+=durClip(FILME.v[k]);return t;}

// ---------- linha do tempo
function tlPinta(){const el=$('#trilhas');const pps=TL.pps;const T=Math.max(total(),FILME.t.reduce((a,t)=>Math.max(a,t.ini+t.dur),0),(FILME.a1?(FILME.a1.ini||0)+30:0),10)+5;const L=42;el.style.width=(L+T*pps+40)+'px';

  const cores=(KIT&&KIT.colors||[]);const logos=Object.entries((KIT&&KIT.logos)||{}).filter(([k,l])=>l&&l.file_url);const fontes=[...new Set((KIT&&KIT.fonts||[]).map(f=>f.name))];

    <div class="lab">Logo no filme</div><div class="row"><button class="btn s ${ds.logo.on?'on':''}" onclick="FILME.ds.logo.on=!FILME.ds.logo.on;dirty=true;dsUI();mostraEm(TL.t)">${ds.logo.on?'ligado':'desligado'}</button>${logos.map(([k])=>`<button class="btn s ${ds.logo.chave===k?'on':''}" onclick="FILME.ds.logo.chave='${k}';dirty=true;dsUI();mostraEm(TL.t)">${k}</button>`).join('')||'<span class="vazio">sem logo no kit</span>'}</div>
    <div class="row" style="margin-top:6px"><div class="anc">${[0,1,2,3,4,5,6,7,8].map(a=>`<button class="${ds.logo.anc===a?'on':''}" onclick="FILME.ds.logo.anc=${a};dirty=true;dsUI();mostraEm(TL.t)"></button>`).join('')}</div><input type="range" min="6" max="40" step="1" value="${ds.logo.w||16}" style="min-height:0;padding:0;flex:1;min-width:60px" oninput="FILME.ds.logo.w=+this.value;dirty=true;mostraEm(TL.t)" title="tamanho do logo"></div>
    <div class="lab">Estilo de legenda (padrão dos textos)</div><div class="row">${ESTILOS_LEG.map(([k,n])=>`<button class="btn s ${ds.legenda.estilo===k?'on':''}" onclick="FILME.ds.legenda.estilo='${k}';dirty=true;dsUI();mostraEm(TL.t)">${n}</button>`).join('')}</div>
    <div class="row" style="margin-top:6px"><select style="flex:1" onchange="FILME.ds.legenda.fonte=this.value;dirty=true;mostraEm(TL.t)"><option value="">fonte: ${fontes[0]?esc(fontes[0])+' (kit)':'Inter'}</option>${fontes.map(f=>`<option ${ds.legenda.fonte===f?'selected':''}>${esc(f)}</option>`).join('')}</select></div>
    <div class="row" style="margin-top:6px"><span class="vazio">texto</span><input type="color" value="${ds.legenda.cor||'#ffffff'}" style="width:34px;padding:2px" oninput="FILME.ds.legenda.cor=this.value;dirty=true;mostraEm(TL.t)"><span class="vazio">caixa</span>${cores.map(c=>`<span class="sw" style="background:${esc(c.hex)};${ds.legenda.fundo===c.hex?'outline:2px solid var(--ink)':''}" onclick="FILME.ds.legenda.fundo='${esc(c.hex)}';dirty=true;dsUI();mostraEm(TL.t)"></span>`).join('')}</div>`;}
// ---------- TEXTOS PRONTOS: copys deste cliente (área de Copys) → viram textos no filme
let COPYS=[];
async function copysCarrega(){COPYS=[];if(!CID)return;try{const r=await api('pd-copy.php',{acao:'inicio',client_id:CID},'Lendo as copys do cliente…');COPYS=(r.copys||[]).filter(c=>c.variantes&&c.variantes.itens&&c.variantes.itens.length);}catch(e){}const n=$('#tpN');if(n)n.textContent=COPYS.length?'('+COPYS.length+')':'';}
async function textosProntos(){if(!COPYS.length){msg('Nenhuma copy pronta deste cliente. Escreva na área de Copys.');return;}
  const k=await pdStudio.escolher('Textos prontos deste cliente — qual usar?',COPYS.slice(0,8).map(c=>({k:c.id,label:c.nome+(c.set_id?'':' · não aprovada')})).concat([{k:'',label:'Cancelar'}]));if(!k)return;const c=COPYS.find(x=>x.id===k);if(!c)return;
  if(!c.set_id){const ok=await pdStudio.escolher('Esse material ainda não foi aprovado pelo cliente.\nQuer usar mesmo assim?',[{k:'s',label:'Usar mesmo assim',primario:true},{k:'n',label:'Cancelar'}]);if(ok!=='s')return;}
  const itens=c.variantes.itens;const modo=await pdStudio.escolher('Como distribuir os '+itens.length+' textos?',[{k:'clipe',label:'Um por clipe',primario:true},{k:'tempo',label:'Um a cada 4 s'},{k:'n',label:'Cancelar'}]);if(!modo||modo==='n')return;
  const ds=FILME.ds&&FILME.ds.legenda||{};let t0=0;itens.forEach((it,i)=>{const texto=(it.texto||it.titulo||'').split('\n').slice(0,3).join('\n');if(!texto)return;let ini,dur;if(modo==='clipe'){const c0=FILME.v[i];if(!c0)return;ini=iniDe(i);dur=durClip(c0);}else{ini=t0;dur=4;t0+=4;}
    FILME.t.push({texto,ini,dur,tam:ds.tam||5.5,cor:ds.cor||'#ffffff',fundo:'',anc:ds.anc??7,fonte:ds.fonte||(KIT&&KIT.fonts&&KIT.fonts[0]&&KIT.fonts[0].name)||'Inter',peso:'700',estilo:ds.estilo||'caixa'});});
  dirty=true;tlPinta();mostraEm(TL.t);pdStudio.observa('textos_prontos',{copy:c.id,n:itens.length,modo});msg('Textos da copy "'+c.nome+'" na linha do tempo.');}
// ---------- SETUP PACKSHOT: assinatura animada com o DS

  TL.sel={k:'v',i:FILME.v.length-1};dirty=true;tlPinta();propsUI();pdStudio.observa('packshot',{anim:k});}
// ---------- SETUP LOTE: pasta com vídeos → N filmes cortados, legendados com o DS, com trilha e logo → render de todos
async function setupLote(){if(!CID||!KIT){msg('Escolha o cliente.');return;}
  const fonte=await pdStudio.escolher('De onde vêm os vídeos?',[{k:'midia',label:'MÍDIA do cliente',primario:true},{k:'link',label:'Pasta do Drive (link)'},{k:'',label:'Cancelar'}]);if(!fonte)return;
  let vids=[];if(fonte==='midia')vids=GAL.filter(x=>x.tipo==='video').map(x=>({nome:x.nome,url:location.origin+x.arquivo}));else{const link=prompt('Link da pasta do Drive com os vídeos:');if(!link)return;try{const r=await api('pd-estudio.php',{acao:'banco_ver',link},'Lendo a pasta…');vids=(r.itens||[]).filter(x=>x.tipo==='video').map(x=>({nome:x.nome,url:location.origin+x.arquivo}));}catch(e){msg(e.message,6000);return;}}
  if(!vids.length){msg('Nenhum vídeo aí.');return;}
  const dest=await pdStudio.escolher(vids.length+' vídeos. Pra que uso? (define o tempo de cada corte)',DESTINOS.map(([k,s0,n])=>({k,label:n})).concat([{k:'',label:'Cancelar'}]));if(!dest)return;const alvo=(DESTINOS.find(d=>d[0]===dest)||[])[1]||15;
  const legOrigem=await pdStudio.escolher('Legendas: de onde?',[{k:'copy',label:'Textos prontos do cliente',primario:COPYS.length>0},{k:'nome',label:'Sem legenda'},{k:'',label:'Cancelar'}]);if(!legOrigem)return;
  let textos=[];if(legOrigem==='copy'){if(!COPYS.length){msg('Nenhuma copy pronta; vou sem legenda.');}else{const ck=await pdStudio.escolher('Qual copy?',COPYS.slice(0,8).map(c=>({k:c.id,label:c.nome+(c.set_id?'':' · não aprovada')})));const c=COPYS.find(x=>x.id===ck);if(c){if(!c.set_id){const ok=await pdStudio.escolher('Esse material ainda não foi aprovado. Usar mesmo assim?',[{k:'s',label:'Usar',primario:true},{k:'n',label:'Não'}]);if(ok!=='s')return;}textos=c.variantes.itens.map(it=>(it.texto||it.titulo||'').split('\n').slice(0,3).join('\n'));}}}
  const comPack=await pdStudio.escolher('Fechar cada filme com a assinatura do cliente?',[{k:'s',label:'Sim, com packshot',primario:true},{k:'n',label:'Não'}]);
  const base=JSON.parse(JSON.stringify(FILME));const ds=base.ds||{};const logos=Object.keys((KIT&&KIT.logos)||{}).filter(x=>KIT.logos[x]&&KIT.logos[x].file_url);
  ocupa('Montando '+vids.length+' filmes…');let feitos=0;try{for(let i=0;i<vids.length;i++){const v=vids[i];ocupa('Filme '+(i+1)+' de '+vids.length+': '+v.nome);
      const dur=await new Promise(res=>{const vd=document.createElement('video');vd.preload='metadata';vd.src=v.url;vd.onloadedmetadata=()=>res(vd.duration||alvo);vd.onerror=()=>res(alvo);});
      const f={fmt:base.fmt,ds:base.ds,a1:base.a1,a2:base.a2,v:[{tipo:'vid',url:v.url,nome:v.nome,dur,ini:0,fim:Math.min(dur,alvo),vol:1,mudo:!!base.a2,trans:'fade'}],t:[]};
      const tx=textos[i%Math.max(1,textos.length)];if(tx)f.t.push({texto:tx,ini:0,dur:Math.min(dur,alvo),tam:(ds.legenda&&ds.legenda.tam)||5.5,cor:(ds.legenda&&ds.legenda.cor)||'#ffffff',fundo:'',anc:(ds.legenda&&ds.legenda.anc)??7,fonte:(ds.legenda&&ds.legenda.fonte)||(KIT.fonts&&KIT.fonts[0]&&KIT.fonts[0].name)||'Inter',peso:'700',estilo:(ds.legenda&&ds.legenda.estilo)||'caixa'});
      if(comPack==='s')f.v.push({tipo:'packshot',nome:'Assinatura',dur:3,trans:'preto',anim:'fade',fundo:(KIT.colors&&KIT.colors[0]&&KIT.colors[0].hex)||'#121212',logo:logos.includes('negativo')?'negativo':(logos[0]||'principal'),w:40,tag:''});
      FILME=f;PECA.id=null;$('#nome').value=(dest+' · '+v.nome.replace(/\.[^.]+$/,'')).slice(0,80);await salvar(true);await renderizar(true);feitos++;}}
  catch(e){msg('Parou no filme '+(feitos+1)+': '+e.message,9000);}finally{desocupa();}
  FILME=base;PECA.id=null;$('#nome').value='Filme';tlPinta();mostraEm(0);dsUI();msg(feitos+' filmes mandados pra oficina. Eles vão caindo em Saída de materiais e em cliente › ESTÚDIO.',10000);pdStudio.observa('lote_video',{n:feitos,dest,legendas:!!textos.length,pack:comPack==='s'});}
async function antesDeSair(){if(!dirty)return true;return await salvar(true);}
// ---------- render (oficina): V em sequência; textos viram camada PNG por cena; A1/A2 por cima
async function renderizar(silencio){pdStudio.observa('render',{clipes:FILME.v.length,textos:FILME.t.length,dur:total()});if(!PECA.client_id){msg('Escolha o cliente.');return;}if(!FILME.v.length){msg('Coloque pelo menos um clipe.');return;}if(!silencio&&!await salvar(true))return;const [w,h]=FMT[FILME.fmt];ocupa('Preparando o render…');
  try{const cenas=[];let acc=0;const ds=FILME.ds||{};for(const c of FILME.v){const d=durClip(c);
      if(c.tipo==='packshot'){let tag_url=null;if(c.tag){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');const fs=w*.04;x.font=`700 ${fs}px "${(KIT&&KIT.fonts&&KIT.fonts[0]&&KIT.fonts[0].name)||'Inter'}",sans-serif`;x.fillStyle='#fff';x.textAlign='center';x.textBaseline='top';x.fillText(c.tag,w/2,h*.62);tag_url=(await api('pd-oficina.php',{acao:'anexar',arquivo:{nome:'tag-'+cenas.length+'.png',mime:'image/png',b64:cv.toDataURL('image/png')}},'Preparando a assinatura…')).url;}
        cenas.push({dur:d,trans:c.trans||'corte',cor:c.fundo||'#121212',packshot:{anim:c.anim||'fade',logo_url:logoUrl(c.logo||'principal'),tag_url,w:Math.round(w*((c.w||40)/100)),y:.42,fundo2:c.fundo2||null},clipes:[]});acc+=d;continue;}
      const ativos=FILME.t.filter(t=>t.ini<acc+d&&t.ini+t.dur>acc);let topo=null;const temDS=(ds.filtro&&ds.filtro.cor&&ds.filtro.op>0)||(ds.logo&&ds.logo.on&&logoUrl(ds.logo.chave));
      if(ativos.length||temDS){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');desenhaCamadasDS(x,w,h,{c});desenhaTextosEm(x,w,h,ativos);if(ds.logo&&ds.logo.on){const im=img(logoUrl(ds.logo.chave));if(im)desenhaLogoDS(x,w,h);}
        const b64=cv.toDataURL('image/png');topo=(await api('pd-oficina.php',{acao:'anexar',arquivo:{nome:'topo-'+cenas.length+'.png',mime:'image/png',b64}},'Preparando a cena '+(cenas.length+1)+'…')).url;}
      if(c.tipo==='img')cenas.push({dur:d,trans:c.trans||'corte',fundo_url:c.url,topo_url:topo,movimento:c.movimento||'',clipes:[]});
      else cenas.push({dur:d,trans:c.trans||'corte',fundo_url:null,topo_url:topo,clipes:[{url:c.url,ini:c.ini||0,fim:c.fim==null?null:c.fim,x:0,y:0,w,h,vol:c.vol??1,mudo:!!c.mudo}]});acc+=d;}
    const nome=($('#nome').value||'filme').replace(/[\/\\:*?"<>|]+/g,'-');
    const r=await api('pd-oficina.php',{acao:'pedir',modulo:'video',titulo:'Filme · '+nome,client_id:PECA.client_id,ok_agora:true,entrada:{nome,w,h,fps:30,cenas,trilha:FILME.a1,locucao:FILME.a2,drive_subpasta:'ESTÚDIO/'+nome,pedido:'Filme do Studio Design: '+cenas.length+' cenas, '+fmtT(total())}});
    if(!silencio)msg(r.trabalho&&r.trabalho.status==='fila'?'Na oficina. O MP4 cai em Saída de materiais e em cliente › ESTÚDIO › '+nome+' em alguns minutos; eu aviso.':'Pedido: '+(r.trabalho&&r.trabalho.status),9000);
    if(r.trabalho){const id=r.trabalho.id;const t=setInterval(async()=>{try{const j=await api('pd-oficina.php',{acao:'ver',id});const st=j.trabalho&&j.trabalho.status;if(st==='pronto'){clearInterval(t);avisa('Terminei o filme '+nome+'! Está em Saída de materiais e no Drive.');}else if(st==='erro'){clearInterval(t);avisa('Não consegui terminar o filme '+nome+': '+(j.trabalho.erro||'erro'));}}catch(e){}},40000);}}
  catch(e){msg(e.message,8000);}finally{desocupa();}}
boot();
