<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stratesign — Artigo</title><meta name="robots" content="noindex, nofollow"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/site.css?v=5">
<style>.art{max-width:760px;margin:0 auto;padding:16vh 20px 14vh}.art .vt{font-size:13px;font-weight:700;text-decoration:none;border-bottom:1px solid}.art h1{font-size:clamp(30px,5vw,64px);letter-spacing:-.04em;line-height:1;margin:40px 0 16px}.art .cr{font-size:13px;color:#8c8b86;margin:0 0 40px}.art .tx p{font-size:18px;line-height:1.65;margin:0 0 22px}.art .or{font-size:13px;color:#8c8b86;border-top:1px solid #d8d7d2;padding-top:16px;margin-top:40px}</style></head>
<body><main class="art"><a class="vt" href="./#blog">← O que estamos vendo</a><h1 id="t"></h1><p class="cr" id="c"></p><div class="tx" id="x"></div><p class="or" id="o"></p></main>
<script>(function(){var s=new URLSearchParams(location.search).get('a')||'';fetch('dados/artigos.json?v='+Date.now()).then(function(r){return r.json()}).then(function(d){var a=(d.artigos||[]).filter(function(x){return x.slug===s&&x.publicado})[0];if(!a){document.getElementById('t').textContent='Artigo não encontrado.';return}document.title='Stratesign — '+a.titulo;document.getElementById('t').textContent=a.titulo;var dt='';try{dt=new Date(a.data+'T12:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})}catch(e){}document.getElementById('c').textContent=a.autor+' · '+dt;var x=document.getElementById('x');String(a.texto||'').split(/\n\s*\n/).forEach(function(p){var e=document.createElement('p');e.textContent=p.trim();x.appendChild(e)});if(a.origem)document.getElementById('o').textContent='Publicado originalmente em '+a.origem+'.'})})();</script></body></html>
