<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Biosphere · Painel</title>
<style>
:root{--m:#3a2b1e;--v:#12958d;--bg:#faf8f4;--l:#e3ddd2;--t:#554c43}
*{box-sizing:border-box;margin:0;padding:0}body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--t);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--v)}
.login{max-width:380px;margin:12vh auto;padding:36px;background:#fff;border:1px solid var(--l)}.login h1{font-size:22px;color:var(--m);margin-bottom:6px;font-weight:400}.login p{margin-bottom:20px}
label{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--m);margin:14px 0 5px}
input[type=text],input[type=password],input[type=date],input[type=url],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--l);background:#fff;border-radius:0}textarea{resize:vertical;min-height:88px}input:focus,textarea:focus,select:focus{outline:2px solid var(--v);outline-offset:-1px}
.b{display:inline-block;background:var(--m);color:#fff;border:0;padding:10px 18px;cursor:pointer;font-size:13px;letter-spacing:.05em;text-transform:uppercase}.b:hover{background:var(--v)}.b.s{background:#fff;color:var(--m);border:1px solid var(--l)}.b.s:hover{border-color:var(--v);color:var(--v)}.b.p{padding:6px 10px;font-size:11px}.b[disabled]{opacity:.5;cursor:wait}.b.r{color:#b3261e}
header.ad{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}header.ad h1{font-size:16px;font-weight:400;color:var(--m);margin-right:8px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}nav.tabs button{background:none;border:0;padding:8px 14px;cursor:pointer;color:var(--t);border-bottom:2px solid transparent}nav.tabs button.on{color:var(--m);border-color:var(--v)}
.sp{flex:1}.msg{font-size:13px;color:var(--v)}.msg.er{color:#b3261e}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:24px;padding:20px;max-width:1300px;margin:0 auto}.side{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;background:#fff;border:1px solid var(--l)}.side button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--l);padding:10px 14px;cursor:pointer;font-size:14px}.side button.on{background:var(--m);color:#fff}.side button:hover:not(.on){background:#f3efe7}
.card{background:#fff;border:1px solid var(--l);padding:22px;margin-bottom:18px}.card h2{font-size:18px;color:var(--m);font-weight:400;margin-bottom:6px}.hint{font-size:13px;opacity:.85}
.im{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.im .pv{width:180px;height:110px;background:#ece7dd center/cover no-repeat;border:1px solid var(--l);display:flex;align-items:center;justify-content:center;font-size:12px;color:#999;overflow:hidden}.pv video{width:100%;height:100%;object-fit:cover}.im .ac{flex:1;min-width:240px}.im .ac .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.im input[type=text]{margin-top:0}
.mod{display:none;position:fixed;inset:0;background:rgba(20,14,9,.6);z-index:50;align-items:center;justify-content:center;padding:20px}.mod.on{display:flex}.mod .bx{background:#fff;max-width:900px;width:100%;max-height:86vh;overflow:auto;padding:22px}.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}.lib .it{border:1px solid var(--l);cursor:pointer;background:#faf8f4;position:relative}.lib .it:hover{border-color:var(--v)}.lib .it .t{height:90px;background:#ece7dd center/cover}.lib .it small{display:block;padding:4px 6px;font-size:11px;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 10px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--m)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.st{display:inline-block;padding:2px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:#eee}.st.pub{background:#d8f0ee;color:#0b6b65}
.hidden{display:none!important}.cnt{font-size:12px;opacity:.7;float:right}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.side{position:static;max-height:240px}.g2{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login hidden"><h1>Biosphere · Painel</h1><p>Entre com usuário e senha.</p><form id="lf"><label>Usuário</label><input type="text" id="lu" autocomplete="username" required><label>Senha</label><input type="password" id="lp" autocomplete="current-password" required><p class="msg er" id="le" style="margin-top:12px"></p><button class="b" style="margin-top:12px">Entrar</button></form></div>
<div id="app" class="hidden">
<header class="ad"><h1>Biosphere · Painel</h1><nav class="tabs" id="tabs"></nav><span class="sp"></span><span class="msg" id="gm"></span><a href="../" target="_blank" class="b s p" style="text-decoration:none">Ver site</a><button class="b" id="salvar">Publicar alterações</button><button class="b s p" id="sair">Sair</button></header>
<div id="vt" class="wrap"><div class="side" id="side"></div><div id="form"></div></div>
<div id="vb" class="wrap hidden" style="display:block"></div><div id="vs" class="wrap hidden" style="display:block"></div><div id="vc" class="wrap hidden" style="display:block"></div><div id="vl" class="wrap hidden" style="display:block"></div><div id="vk" class="wrap hidden" style="display:block"></div>
</div>
<div class="mod" id="mod"><div class="bx"><div style="display:flex;justify-content:space-between;align-items:center"><strong>Biblioteca de arquivos</strong><button class="b s p" id="mx">Fechar</button></div><div class="lib" id="mlib"></div></div></div>
<input type="file" id="fi" class="hidden">
<script>
var D=null,SEL=null,ED={},PG='t',alvo=null;
var $=function(i){return document.getElementById(i)};
function api(a,d,fd){var o={method:'POST',headers:{'X-Bs-Admin':'1'}};if(fd){fd.append('a',a);o.body=fd}else{o.headers['Content-Type']='application/json';o.body=JSON.stringify(Object.assign({a:a},d||{}))}
return fetch('api.php',o).then(function(r){return r.json().catch(function(){return{ok:false,erro:'Resposta inválida do servidor.'}})}).then(function(j){if(j.login){show('login')}return j})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function msg(t,er){var m=$('gm');m.textContent=t;m.className='msg'+(er?' er':'');clearTimeout(msg.t);msg.t=setTimeout(function(){m.textContent=''},5000)}
function show(w){$('login').classList.toggle('hidden',w!=='login');$('app').classList.toggle('hidden',w!=='app')}
function boot(){fetch('api.php?a=sessao').then(function(r){return r.json()}).then(function(j){if(j.ok)carrega();else show('login')}).catch(function(){show('login')})}
$('lf').onsubmit=function(e){e.preventDefault();$('le').textContent='';api('login',{usuario:$('lu').value,senha:$('lp').value}).then(function(j){if(j.ok){$('lp').value='';carrega()}else $('le').textContent=j.erro||'Erro.'})};
$('sair').onclick=function(){api('sair').then(function(){location.reload()})};
function carrega(){api('dados').then(function(j){if(!j.ok){msg(j.erro,1);return}D=j;ED={};show('app');montaTabs();if(!SEL)SEL=D.schema[0].g;tela()})}
var TABS=[['t','Textos e imagens'],['b','Blog'],['s','SEO'],['c','Contatos'],['l','Biblioteca'],['k','Conta']];
function montaTabs(){$('tabs').innerHTML=TABS.map(function(t){return'<button data-p="'+t[0]+'" class="'+(PG===t[0]?'on':'')+'">'+t[1]+(t[0]==='c'&&D.leads.length?' ('+D.leads.length+')':'')+'</button>'}).join('');[].forEach.call($('tabs').children,function(b){b.onclick=function(){PG=b.dataset.p;montaTabs();tela()}})}
function tela(){['t','b','s','c','l','k'].forEach(function(p){var el=p==='t'?$('vt'):$('v'+p);el.classList.toggle('hidden',PG!==p)});$('salvar').classList.toggle('hidden',PG!=='t'&&PG!=='s');
if(PG==='t')telaTextos();if(PG==='b')telaBlog();if(PG==='s')telaSeo();if(PG==='c')telaLeads();if(PG==='l')telaLib();if(PG==='k')telaConta()}
/* ---- textos ---- */
function val(g,k,def){var key=g+'.'+k;if(ED.hasOwnProperty(key))return ED[key];if(D.valores.hasOwnProperty(key))return D.valores[key];return def}
function telaTextos(){$('side').innerHTML=D.schema.map(function(s){return'<button data-g="'+s.g+'" class="'+(SEL===s.g?'on':'')+'">'+esc(s.titulo)+'</button>'}).join('');[].forEach.call($('side').children,function(b){b.onclick=function(){SEL=b.dataset.g;telaTextos();scrollTo(0,0)}});
var s=D.schema.filter(function(x){return x.g===SEL})[0],h='<div class="card"><h2>'+esc(s.titulo)+'</h2><p class="hint">Campo vazio esconde o item no site. Depois de editar, clique em Publicar alterações.</p></div><div class="card">';
s.campos.forEach(function(f){var id='f_'+s.g+'_'+f.k,v=val(s.g,f.k,f.def);h+='<div data-k="'+s.g+'.'+f.k+'">';
if(f.type==='img'||f.type==='video'){h+='<label>'+esc(f.label)+'</label><div class="im"><div class="pv" id="pv_'+id+'">'+prev(v,f.type)+'</div><div class="ac"><input type="text" id="'+id+'" value="'+esc(v)+'" placeholder="caminho ou link" data-f="1"><div class="row"><button class="b s p" data-up="'+id+'" data-tp="'+f.type+'">Enviar arquivo</button>'+(f.type==='img'?'<button class="b s p" data-url="'+id+'">Colar link</button>':'')+'<button class="b s p" data-lib="'+id+'" data-tp="'+f.type+'">Biblioteca</button><button class="b s p" data-clr="'+id+'">Limpar</button>'+(f.def!==''?'<button class="b s p" data-rst="'+id+'" data-def="'+esc(f.def)+'">Voltar ao original</button>':'')+'</div>'+(f.type==='video'?'<p class="hint" style="margin-top:6px">MP4 até o limite do servidor, ou cole link do YouTube/Vimeo no campo.</p>':'')+'</div></div>'}
else if(f.type==='area'){h+='<label>'+esc(f.label)+'</label><textarea id="'+id+'" data-f="1">'+esc(v)+'</textarea>'}
else{h+='<label>'+esc(f.label)+'</label><input type="text" id="'+id+'" value="'+esc(v)+'" data-f="1">'}
h+='</div>'});$('form').innerHTML=h+'</div>';
[].forEach.call($('form').querySelectorAll('[data-f]'),function(i){i.oninput=function(){var k=i.closest('[data-k]').dataset.k;ED[k]=i.value;var p=$('pv_'+i.id);if(p){var f=campo(k);p.innerHTML=prev(i.value,f.type)}}});
bindIm()}
function campo(k){var p=k.split('.'),s=D.schema.filter(function(x){return x.g===p[0]})[0];return s.campos.filter(function(c){return c.k===p[1]})[0]}
function prev(v,tp){if(!v)return'sem arquivo';var u=/^(https?:|\/)/.test(v)?v:'../'+v;if(tp==='video'){if(/\.(mp4|webm|mov)$/i.test(v))return'<video src="'+esc(u)+'" muted></video>';return'vídeo (link)'}return'<img src="'+esc(u)+'" style="width:100%;height:100%;object-fit:cover">'}
function setCampo(id,v){var i=$(id);i.value=v;i.dispatchEvent(new Event('input'))}
function bindIm(){var f=$('form');
[].forEach.call(f.querySelectorAll('[data-up]'),function(b){b.onclick=function(){alvo={id:b.dataset.up,tp:b.dataset.tp};$('fi').accept=b.dataset.tp==='video'?'video/*':'image/*';$('fi').value='';$('fi').click()}});
[].forEach.call(f.querySelectorAll('[data-url]'),function(b){b.onclick=function(){var u=prompt('Cole o link da imagem (Google Drive, Dropbox ou endereço direto):');if(!u)return;b.disabled=true;msg('Baixando…');api('upload_url',{url:u}).then(function(j){b.disabled=false;if(j.ok){setCampo(b.dataset.url,j.src);msg('Imagem recebida.');recarregaLib()}else msg(j.erro,1)})}});
[].forEach.call(f.querySelectorAll('[data-lib]'),function(b){b.onclick=function(){abreLib(function(src){setCampo(b.dataset.lib,src)},b.dataset.tp)}});
[].forEach.call(f.querySelectorAll('[data-clr]'),function(b){b.onclick=function(){setCampo(b.dataset.clr,'')}});
[].forEach.call(f.querySelectorAll('[data-rst]'),function(b){b.onclick=function(){setCampo(b.dataset.rst,b.dataset.def)}})}
$('fi').onchange=function(){var f=this.files[0];if(!f||!alvo)return;var fd=new FormData();fd.append('arq',f);var a=alvo;msg('Enviando '+f.name+'…');api('upload',{},fd).then(function(j){if(j.ok){if(a.cb)a.cb(j.src);else setCampo(a.id,j.src);msg('Arquivo enviado.');recarregaLib()}else msg(j.erro,1)})};
function recarregaLib(){api('dados').then(function(j){if(j.ok){D.biblioteca=j.biblioteca}})}
$('salvar').onclick=function(){var b=this;if(PG==='s'){salvaSeo(b);return}if(!Object.keys(ED).length){msg('Nada alterado.');return}b.disabled=true;api('salvar_textos',{valores:ED}).then(function(j){b.disabled=false;if(j.ok){Object.keys(ED).forEach(function(k){D.valores[k]=ED[k]});ED={};msg('Publicado. '+j.salvos+' campo(s).')}else msg(j.erro,1)})};
/* ---- biblioteca ---- */
function abreLib(cb,tp){var l=D.biblioteca.filter(function(x){return tp==='video'?/\.(mp4|webm|mov)$/.test(x.f):!/\.(mp4|webm|mov)$/.test(x.f)});
$('mlib').innerHTML=l.length?l.map(function(x,i){return'<div class="it" data-i="'+i+'"><div class="t" style="background-image:url(\'../'+esc(x.f.replace(/\.jpg$/,'_m.jpg'))+'\')"></div><small>'+esc(x.f.slice(8))+'</small></div>'}).join(''):'<p>Nada enviado ainda. As imagens do site original ficam em img/ (use o campo para ver o caminho).</p>';
[].forEach.call($('mlib').children,function(e){e.onclick=function(){cb(l[+e.dataset.i].f);$('mod').classList.remove('on')}});$('mod').classList.add('on')}
$('mx').onclick=function(){$('mod').classList.remove('on')};
function telaLib(){var l=D.biblioteca;$('vl').innerHTML='<div class="card"><h2>Biblioteca</h2><p class="hint">Arquivos enviados pelo painel. Para trocar uma foto do site, vá em Textos e imagens e use Enviar arquivo. Limite de envio do servidor: '+D.limite_mb+' MB.</p><div class="row" style="margin-top:12px"><button class="b" id="lu2">Enviar para a biblioteca</button></div></div><div class="card"><div class="lib">'+(l.length?l.map(function(x){var vd=/\.(mp4|webm|mov)$/.test(x.f);return'<div class="it"><div class="t" style="background-image:url(\'../'+esc(x.f.replace(/\.jpg$/,'_m.jpg'))+'\')">'+(vd?'<div style="padding:30px 10px;text-align:center">vídeo</div>':'')+'</div><small>'+esc(x.f)+'</small><div style="display:flex;gap:4px;padding:4px"><button class="b s p" data-cp="'+esc(x.f)+'">Copiar caminho</button><button class="b s p r" data-ap="'+esc(x.f)+'">Apagar</button></div></div>'}).join(''):'<p>Nenhum arquivo enviado.</p>')+'</div></div>';
$('lu2').onclick=function(){alvo={cb:function(){api('dados').then(function(j){D.biblioteca=j.biblioteca;telaLib()})}};$('fi').accept='image/*,video/*';$('fi').value='';$('fi').click()};
[].forEach.call($('vl').querySelectorAll('[data-cp]'),function(b){b.onclick=function(){navigator.clipboard.writeText(b.dataset.cp);msg('Caminho copiado.')}});
[].forEach.call($('vl').querySelectorAll('[data-ap]'),function(b){b.onclick=function(){if(!confirm('Apagar este arquivo? Se estiver em uso no site, o espaço ficará vazio.'))return;api('apagar_upload',{f:b.dataset.ap}).then(function(j){if(j.ok){D.biblioteca=D.biblioteca.filter(function(x){return x.f!==b.dataset.ap});telaLib()}else msg(j.erro,1)})}})}
/* ---- SEO ---- */
var SG=null;
function telaSeo(){var g=Object.assign({},D.seo.global||{}),p=D.seo.paginas||{};if(SG)g=SG.g,p=SG.p;SG={g:g,p:p};
var h='<div class="card"><h2>SEO geral</h2><p class="hint">Vale para o site todo. Os campos de cada página abaixo sobrescrevem o padrão; vazio usa o texto padrão.</p><div class="g2">'
+gi('nome_site','Nome do site','Biosphere by C. Reymond')+gi('canonical_base','Endereço oficial do site (sem barra no final)','https://www.seudominio.com.br')+gi('og_image','Imagem padrão de compartilhamento (caminho ou link)','img/hero-agua.jpg')+gi('instagram_url','Link do Instagram da marca','https://www.instagram.com/biosphere.by.caua.reymond')
+gi('google_verificacao','Google Search Console · código de verificação','')+gi('bing_verificacao','Bing · código de verificação','')+gi('meta_verificacao','Meta (Facebook) · verificação de domínio','')+gi('ga4','Google Analytics 4 · ID (G-XXXX)','')+gi('meta_pixel','Meta Pixel · ID','')+gi('robots','Robots padrão','index,follow,max-image-preview:large')
+'</div><label>Código extra no &lt;head&gt; (avançado)</label><textarea id="sg_head_extra" style="min-height:90px;font-family:monospace;font-size:13px">'+esc(g.head_extra||'')+'</textarea><label><input type="checkbox" id="sg_bloq" '+(g.bloquear_buscadores==='1'?'checked':'')+'> Bloquear buscadores enquanto o site está em construção (robots.txt)</label></div>';
Object.keys(D.seo_paginas).forEach(function(k){var d=D.seo_paginas[k],v=p[k]||{};h+='<div class="card"><h2>'+esc(d[0])+'</h2><div class="g2"><div><label>Título (até 60 caracteres ideais) <span class="cnt" id="c_'+k+'_t"></span></label><input type="text" data-p="'+k+'" data-c="title" value="'+esc(v.title||'')+'" placeholder="'+esc(d[1])+'"></div><div><label>Imagem de compartilhamento</label><input type="text" data-p="'+k+'" data-c="og_image" value="'+esc(v.og_image||'')+'"></div></div><label>Descrição (até 155 caracteres ideais) <span class="cnt" id="c_'+k+'_d"></span></label><textarea data-p="'+k+'" data-c="description" style="min-height:64px" placeholder="'+esc(d[2])+'">'+esc(v.description||'')+'</textarea><div class="g2"><div><label>Robots (opcional)</label><input type="text" data-p="'+k+'" data-c="robots" value="'+esc(v.robots||'')+'" placeholder="noindex,nofollow para esconder"></div><div><label>Canonical (opcional)</label><input type="text" data-p="'+k+'" data-c="canonical" value="'+esc(v.canonical||'')+'"></div></div></div>'});
$('vs').innerHTML=h;
function cont(){Object.keys(D.seo_paginas).forEach(function(k){var t=$('vs').querySelector('[data-p="'+k+'"][data-c=title]'),d=$('vs').querySelector('[data-p="'+k+'"][data-c=description]');$('c_'+k+'_t').textContent=(t.value||t.placeholder).length+' car.';$('c_'+k+'_d').textContent=(d.value||d.placeholder).length+' car.'})}cont();
[].forEach.call($('vs').querySelectorAll('input,textarea'),function(i){i.oninput=function(){lerSeo();cont()}});$('sg_bloq').onchange=lerSeo}
function gi(k,l,ph){var v=(SG&&SG.g[k])||'';return'<div><label>'+l+'</label><input type="text" data-g="'+k+'" value="'+esc(v)+'" placeholder="'+esc(ph)+'"></div>'}
function lerSeo(){var g={},p={};[].forEach.call($('vs').querySelectorAll('[data-g]'),function(i){g[i.dataset.g]=i.value});g.head_extra=$('sg_head_extra').value;g.bloquear_buscadores=$('sg_bloq').checked?'1':'';[].forEach.call($('vs').querySelectorAll('[data-p]'),function(i){(p[i.dataset.p]=p[i.dataset.p]||{})[i.dataset.c]=i.value});SG={g:g,p:p}}
function salvaSeo(b){lerSeo();b.disabled=true;api('salvar_seo',{global:SG.g,paginas:SG.p}).then(function(j){b.disabled=false;if(j.ok){D.seo={global:SG.g,paginas:SG.p};msg('SEO publicado.')}else msg(j.erro,1)})}
$('vs').addEventListener('input',function(e){if(e.target.id==='sg_head_extra')lerSeo()});
/* ---- blog ---- */
var PO=null;
function telaBlog(){if(PO){editaPost();return}var l=D.posts;$('vb').innerHTML='<div class="card"><h2>Blog</h2><p class="hint">Artigos aparecem em /blog quando estiverem como Publicado e com data de hoje ou anterior (dá para agendar).</p><div style="margin-top:12px"><button class="b" id="np">Novo artigo</button></div></div><div class="card">'+(l.length?'<table><tr><th>Título</th><th>Data</th><th>Situação</th><th></th></tr>'+l.map(function(p){return'<tr><td>'+esc(p.titulo)+'<br><small>/blog/'+esc(p.slug)+'</small></td><td>'+esc(p.data)+'</td><td><span class="st '+(p.status==='publicado'?'pub':'')+'">'+p.status+'</span></td><td style="white-space:nowrap"><button class="b s p" data-e="'+p.id+'">Editar</button> <button class="b s p r" data-x="'+p.id+'">Excluir</button></td></tr>'}).join('')+'</table>':'<p>Nenhum artigo ainda.</p>')+'</div>';
$('np').onclick=function(){PO={titulo:'',slug:'',resumo:'',capa:'',data:new Date().toISOString().slice(0,10),status:'rascunho',conteudo:'',seo_titulo:'',seo_descricao:'',seo_imagem:''};editaPost()};
[].forEach.call($('vb').querySelectorAll('[data-e]'),function(b){b.onclick=function(){PO=Object.assign({},D.posts.filter(function(p){return p.id===b.dataset.e})[0]);editaPost()}});
[].forEach.call($('vb').querySelectorAll('[data-x]'),function(b){b.onclick=function(){if(!confirm('Excluir este artigo?'))return;api('post_excluir',{id:b.dataset.x}).then(function(j){if(j.ok){D.posts=j.posts;telaBlog()}else msg(j.erro,1)})}})}
function editaPost(){var p=PO;$('vb').innerHTML='<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="b" id="ps">Salvar artigo</button><button class="b s" id="pv">Voltar à lista</button>'+(p.id&&p.status==='publicado'?'<a class="b s" style="text-decoration:none" target="_blank" href="../blog/'+esc(p.slug)+'">Ver no site</a>':'')+(p.id?'<a class="b s" style="text-decoration:none" target="_blank" href="../blog/'+esc(p.slug)+'?previa=1">Pré-visualizar</a>':'')+'<span class="msg" id="pm"></span></div></div><div class="card"><label>Título</label><input type="text" id="pt" value="'+esc(p.titulo)+'"><div class="g2"><div><label>Endereço (slug)</label><input type="text" id="psl" value="'+esc(p.slug)+'" placeholder="gerado do título"></div><div><label>Data</label><input type="date" id="pd" value="'+esc(p.data)+'"></div></div><div class="g2"><div><label>Situação</label><select id="pst"><option value="rascunho"'+(p.status==='rascunho'?' selected':'')+'>Rascunho</option><option value="publicado"'+(p.status==='publicado'?' selected':'')+'>Publicado</option></select></div><div></div></div><label>Resumo (aparece na lista e no Google)</label><textarea id="pr" style="min-height:64px">'+esc(p.resumo)+'</textarea><label>Imagem de capa</label><div class="im"><div class="pv" id="pcv">'+prev(p.capa,'img')+'</div><div class="ac"><input type="text" id="pc" value="'+esc(p.capa)+'"><div class="row"><button class="b s p" id="pcu">Enviar imagem</button><button class="b s p" id="pcl">Biblioteca</button><button class="b s p" id="pcx">Limpar</button></div></div></div></div>'
+'<div class="card"><label>Texto do artigo</label><div class="row" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><button class="b s p" data-md="## ">Título</button><button class="b s p" data-md="### ">Subtítulo</button><button class="b s p" data-wrap="**">Negrito</button><button class="b s p" data-md="> ">Citação</button><button class="b s p" data-md="- ">Lista</button><button class="b s p" id="pim">Inserir imagem</button><button class="b s p" id="pvd">Inserir vídeo (link)</button></div><textarea id="pco" style="min-height:420px;font-size:15px;line-height:1.6">'+esc(p.conteudo)+'</textarea><p class="hint" style="margin-top:6px">Parágrafos se separam por linha em branco. Imagens: <code>![legenda](uploads/arquivo.jpg)</code>. Vídeo: cole o link do YouTube/Vimeo sozinho em uma linha. Links: <code>[texto](https://...)</code>.</p></div>'
+'<div class="card"><h2>SEO do artigo</h2><label>Título para o Google (vazio = título do artigo)</label><input type="text" id="pst2" value="'+esc(p.seo_titulo)+'"><label>Descrição para o Google (vazio = resumo)</label><textarea id="psd" style="min-height:64px">'+esc(p.seo_descricao)+'</textarea><label>Imagem de compartilhamento (vazio = capa)</label><input type="text" id="psi" value="'+esc(p.seo_imagem)+'"></div>';
var pm=function(t,er){$('pm').textContent=t;$('pm').className='msg'+(er?' er':'')};
$('pv').onclick=function(){PO=null;telaBlog()};
$('pc').oninput=function(){$('pcv').innerHTML=prev(this.value,'img')};
$('pcu').onclick=function(){alvo={cb:function(s){$('pc').value=s;$('pc').oninput()}};$('fi').accept='image/*';$('fi').value='';$('fi').click()};
$('pcl').onclick=function(){abreLib(function(s){$('pc').value=s;$('pc').oninput()},'img')};$('pcx').onclick=function(){$('pc').value='';$('pc').oninput()};
var ta=$('pco');function ins(t){var s=ta.selectionStart,e=ta.selectionEnd;ta.value=ta.value.slice(0,s)+t+ta.value.slice(e);ta.focus();ta.selectionStart=ta.selectionEnd=s+t.length}
[].forEach.call($('vb').querySelectorAll('[data-md]'),function(b){b.onclick=function(){var s=ta.selectionStart;var ls=ta.value.lastIndexOf('\n',s-1)+1;ta.value=ta.value.slice(0,ls)+b.dataset.md+ta.value.slice(ls);ta.focus()}});
[].forEach.call($('vb').querySelectorAll('[data-wrap]'),function(b){b.onclick=function(){var s=ta.selectionStart,e=ta.selectionEnd,w=b.dataset.wrap;ta.value=ta.value.slice(0,s)+w+ta.value.slice(s,e)+w+ta.value.slice(e);ta.focus()}});
$('pim').onclick=function(){alvo={cb:function(s){ins('\n\n!['+(prompt('Legenda da imagem (opcional):')||'')+']('+s+')\n\n')}};$('fi').accept='image/*';$('fi').value='';$('fi').click()};
$('pvd').onclick=function(){var u=prompt('Link do YouTube ou Vimeo:');if(u)ins('\n\n'+u.trim()+'\n\n')};
$('ps').onclick=function(){var b=this;b.disabled=true;var d={id:p.id,titulo:$('pt').value,slug:$('psl').value,data:$('pd').value,status:$('pst').value,resumo:$('pr').value,capa:$('pc').value,conteudo:ta.value,seo_titulo:$('pst2').value,seo_descricao:$('psd').value,seo_imagem:$('psi').value};
api('post_salvar',{post:d}).then(function(j){b.disabled=false;if(j.ok){PO=j.post;D.posts=j.posts;pm('Salvo.');$('psl').value=j.post.slug}else pm(j.erro,1)})}}
/* ---- contatos ---- */
function telaLeads(){var l=D.leads;$('vc').innerHTML='<div class="card"><h2>Contatos recebidos</h2><p class="hint">Mensagens do formulário do site (também seguem por e-mail).</p></div><div class="card">'+(l.length?'<table><tr><th>Data</th><th>Quem</th><th>Mensagem</th><th></th></tr>'+l.map(function(x){return'<tr><td>'+esc(x.data)+'<br><small>'+esc(x.tipo||'')+'</small></td><td><strong>'+esc(x.nome)+'</strong><br>'+esc(x.email)+'<br>'+esc(x.telefone||'')+'<br>'+esc(x.empresa||'')+' '+esc(x.cidade||'')+'</td><td>'+esc(x.assunto||'')+'<br>'+esc(x.mensagem||'').replace(/\n/g,'<br>')+'</td><td><button class="b s p r" data-d="'+x.id+'">Apagar</button></td></tr>'}).join('')+'</table>':'<p>Nenhum contato ainda.</p>')+'</div>';
[].forEach.call($('vc').querySelectorAll('[data-d]'),function(b){b.onclick=function(){if(!confirm('Apagar este contato?'))return;api('lead_excluir',{id:b.dataset.d}).then(function(j){if(j.ok){D.leads=j.leads;montaTabs();telaLeads()}})}})}
/* ---- conta ---- */
function telaConta(){$('vk').innerHTML='<div class="card" style="max-width:480px"><h2>Trocar senha</h2><p class="hint">Usuário: '+esc(D.usuario)+'</p><label>Senha atual</label><input type="password" id="sa" autocomplete="current-password"><label>Nova senha (mínimo 8 caracteres)</label><input type="password" id="sn" autocomplete="new-password"><p class="msg" id="sm" style="margin-top:10px"></p><button class="b" id="ss" style="margin-top:10px">Trocar senha</button></div>';
$('ss').onclick=function(){api('senha',{atual:$('sa').value,nova:$('sn').value}).then(function(j){$('sm').textContent=j.ok?'Senha trocada.':(j.erro||'Erro.');$('sm').className='msg'+(j.ok?'':' er');if(j.ok){$('sa').value='';$('sn').value=''}})}}
boot();
</script></body></html>
