<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel — Biosphere</title>
<style>
:root{--t:#0F938A;--m:#2b2118;--c:#f4f3f0;--b:#e2e0db;--x:#6b645d}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Avenir Next",Helvetica,Arial,sans-serif;background:var(--c);color:var(--m)}
button,input,select,textarea{font:inherit}a{color:var(--t)}
.top{background:var(--m);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:54px;position:sticky;top:0;z-index:5}
.top b{font-weight:600;letter-spacing:.02em}.top nav{display:flex;gap:4px;flex:1;overflow:auto}
.top nav button{background:none;border:0;color:#cfc9c2;padding:16px 12px;cursor:pointer;border-bottom:3px solid transparent}
.top nav button.on{color:#fff;border-color:var(--t)}.top .sair{background:none;border:1px solid #6b5f54;color:#ddd;padding:6px 12px;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:24px 18px 80px}h2{font-weight:500;margin:0 0 4px}.sub{color:var(--x);margin:0 0 18px}
.card{background:#fff;border:1px solid var(--b);padding:16px;margin-bottom:12px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--x);margin:12px 0 4px}
input[type=text],input[type=password],input[type=email],input[type=url],input[type=date],select,textarea{width:100%;padding:9px 10px;border:1px solid #cfccc6;background:#fff}
textarea{min-height:84px;resize:vertical}
.bt{background:var(--t);color:#fff;border:0;padding:10px 18px;cursor:pointer}.bt.s{background:#fff;color:var(--m);border:1px solid #bdb9b2}.bt.r{background:#a33}.bt:disabled{opacity:.5}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 200px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--t)}.ctx{font-size:12px;color:var(--x)}
.img{display:flex;gap:14px;align-items:flex-start}.img img{width:150px;height:100px;object-fit:cover;background:#ddd;flex:none}.img>div{flex:1}
.bar{position:sticky;top:54px;z-index:4;background:var(--c);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--m);color:#fff;padding:10px 18px;display:none;z-index:9;max-width:90%}
#msg.e{background:#a33}.login{max-width:340px;margin:12vh auto;background:#fff;padding:26px;border:1px solid var(--b)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.grid div{background:#fff;border:1px solid var(--b);padding:6px;font-size:11px;word-break:break-all;cursor:pointer}.grid img,.grid video{width:100%;height:90px;object-fit:cover;display:block;background:#ddd}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:#e9e7e2;font-size:12px}.pill.on{background:#d3efe9;color:#075d56}
.cnt{font-size:12px;color:var(--x);text-align:right}.cnt.x{color:#a33}
small{color:var(--x)}hr{border:0;border-top:1px solid var(--b);margin:16px 0}
@media(max-width:640px){.img{flex-direction:column}.img img{width:100%;height:160px}}
</style></head><body>
<div id="app"></div><div id="msg"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let U='',SEC='paginas',PG='',DIRTY={};
function msg(t,e){const m=$('#msg');m.textContent=t;m.className=e?'e':'';m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',e?5000:2600)}
async function api(a,d,f){const o=f?{method:'POST',headers:{'X-Bs-Admin':'1'},body:f}:d?{method:'POST',headers:{'X-Bs-Admin':'1','Content-Type':'application/json'},body:JSON.stringify({a,...d})}:{};
 const r=await fetch('api.php?a='+a+(d||f?'':'')+(d||f?'':''),o);let j;try{j=await r.json()}catch(e){j={ok:false,erro:'Resposta inválida do servidor.'}}
 if(j.login&&a!=='sessao'){U='';login();}return j}
async function G(a,q){const r=await fetch('api.php?a='+a+(q?'&'+q:''));return r.json()}
function login(e){$('#app').innerHTML=`<div class="login"><h2>Painel Biosphere</h2><p class="sub">Entre para editar o site.</p><label>Usuário</label><input type="text" id="u" autocomplete="username"><label>Senha</label><input type="password" id="p" autocomplete="current-password"><p><button class="bt" id="go" style="width:100%">Entrar</button></p></div>`;
 const go=async()=>{const j=await api('login',{usuario:$('#u').value,senha:$('#p').value});if(j.ok){U=j.usuario;shell()}else msg(j.erro,1)};$('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()}}
function shell(){const T={paginas:'Páginas',blog:'Blog',seo:'SEO',midia:'Mídia',leads:'Contatos',conta:'Conta'};
 $('#app').innerHTML=`<div class="top"><b>Biosphere · painel</b><nav>${Object.entries(T).map(([k,v])=>`<button data-k="${k}" class="${k===SEC?'on':''}">${v}</button>`).join('')}</nav><a href="../" target="_blank" style="color:#9fe0d9">Ver site</a><button class="sair">Sair</button></div><main id="m"></main>`;
 document.querySelectorAll('.top nav button').forEach(b=>b.onclick=()=>{if(Object.keys(DIRTY).length&&!confirm('Há alterações não salvas. Sair desta tela?'))return;DIRTY={};SEC=b.dataset.k;shell()});
 $('.sair').onclick=async()=>{await api('sair',{});login()};({paginas:vPag,blog:vBlog,seo:vSeo,midia:vMid,leads:vLeads,conta:vConta})[SEC]()}
/* ===== Páginas ===== */
async function vPag(){const m=$('#m');m.innerHTML='<h2>Textos, imagens e vídeos</h2><p class="sub">Edite o conteúdo de qualquer página do site. O layout não muda.</p><div id="pl">Carregando…</div>';
 const j=await G('paginas');$('#pl').innerHTML=`<div class="row"><select id="ps">${j.paginas.map(p=>`<option value="${p.f}" ${p.f===PG?'selected':''}>${H(p.f)} — ${H(p.titulo)}</option>`).join('')}</select></div><div id="pi"></div>`;
 $('#ps').onchange=()=>{if(Object.keys(DIRTY).length&&!confirm('Descartar alterações não salvas?')){$('#ps').value=PG;return}DIRTY={};carrega($('#ps').value)};carrega(PG||j.paginas[0].f)}
async function carrega(f){PG=f;DIRTY={};const j=await G('pagina','f='+encodeURIComponent(f));const pi=$('#pi');
 if(!j.ok){pi.innerHTML=j.erro;return}
 pi.innerHTML=`<div class="bar"><button class="bt" id="sv">Salvar alterações</button><a class="bt s" style="text-decoration:none" href="../${f}" target="_blank">Abrir página</a><span id="st" class="ctx"></span></div>`+j.itens.map(x=>{
  const c=x.ctx?`<div class="ctx">${H(x.ctx)}</div>`:'';
  if(x.tipo==='texto')return `<div class="card"><span class="tag">${{h1:'Título',h2:'Título',h3:'Subtítulo',h4:'Subtítulo',p:'Parágrafo',li:'Item de lista',span:'Texto'}[x.tag]||'Texto'}</span>${c}<textarea data-i="${x.i}" data-o="${H(x.v)}" data-k="t" rows="${Math.min(8,Math.ceil(x.v.length/90)+1)}">${H(x.v)}</textarea></div>`;
  if(x.tipo==='img')return `<div class="card"><span class="tag">Imagem</span>${c}<div class="img"><img src="../${H(x.v)}" onerror="this.style.opacity=.3"><div><input type="text" data-i="${x.i}" data-o="${H(x.v)}" data-k="s" value="${H(x.v)}"><div class="row" style="margin-top:8px"><input type="file" accept="image/*" data-up="${x.i}" style="flex:2"><button class="bt s" data-lib="${x.i}">Biblioteca</button></div><label>Descrição (alt)</label><input type="text" data-i="${x.i}" data-k="a" data-oa="${H(x.alt||'')}" value="${H(x.alt||'')}"></div></div></div>`;
  return `<div class="card"><span class="tag">Vídeo</span>${c}<input type="text" data-i="${x.i}" data-o="${H(x.v)}" data-k="s" value="${H(x.v)}"><small>Cole um link do YouTube, Vimeo ou Google Drive — ou envie um arquivo:</small> <input type="file" accept="video/mp4,video/webm,video/quicktime" data-up="${x.i}"></div>`}).join('');
 pi.onchange=pi.oninput=e=>{const t=e.target;if(t.dataset.i===undefined||t.type==='file')return;DIRTY[t.dataset.i+t.dataset.k]=1;$('#st').textContent='Alterações não salvas'};
 pi.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=async()=>{const fl=inp.files[0];if(!fl)return;const fd=new FormData();fd.append('arq',fl);msg('Enviando…');const r=await api('upload',null,fd);if(!r.ok){msg(r.erro,1);return}
  const t=pi.querySelector(`[data-i="${inp.dataset.up}"][data-k="s"]`);t.value=r.p;t.dispatchEvent(new Event('input',{bubbles:true}));const im=t.closest('.card').querySelector('img');if(im)im.src='../'+r.p;msg('Arquivo enviado. Clique em Salvar.')});
 pi.querySelectorAll('[data-lib]').forEach(b=>b.onclick=()=>pick(p=>{const t=pi.querySelector(`[data-i="${b.dataset.lib}"][data-k="s"]`);t.value=p;t.dispatchEvent(new Event('input',{bubbles:true}));t.closest('.card').querySelector('img').src='../'+p}));
 $('#sv').onclick=async()=>{const mud=[];pi.querySelectorAll('[data-i]').forEach(t=>{if(t.type==='file')return;const k=t.dataset.k;if(k==='a'){if(t.value!==t.dataset.oa)mud.push({i:+t.dataset.i,alt:t.value})}else if(t.value!==t.dataset.o)mud.push({i:+t.dataset.i,v:t.value,orig:t.dataset.o})});
  if(!mud.length){msg('Nada para salvar.');return}const r=await api('salvar_pagina',{f,mud});if(r.ok){msg(r.alterados+' alteração(ões) salvas.');DIRTY={};carrega(f)}else msg(r.erro,1)}}
function pick(cb){G('midia').then(j=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px';d.innerHTML=`<div style="background:#fff;max-width:900px;width:100%;max-height:86vh;overflow:auto;padding:16px"><div class="row" style="margin-bottom:10px"><b style="flex:3">Escolha uma imagem</b><button class="bt s" id="fc">Fechar</button></div><div class="grid">${j.itens.filter(x=>!x.v).map(x=>`<div data-p="${H(x.p)}"><img src="../${H(x.p)}" loading="lazy">${H(x.p.split('/').pop())}</div>`).join('')}</div></div>`;document.body.appendChild(d);d.onclick=e=>{if(e.target.id==='fc'||e.target===d)d.remove();const g=e.target.closest('[data-p]');if(g){cb(g.dataset.p);d.remove()}}})}
/* ===== SEO ===== */
async function vSeo(){const m=$('#m');m.innerHTML='<h2>SEO</h2><p class="sub">Título, descrição e imagem de compartilhamento de cada página.</p><div id="sl">Carregando…</div>';const j=await G('seo_ler');
 $('#sl').innerHTML=`<div class="card"><div class="row"><div><label>Endereço do site (para canonical e sitemap)</label><input type="url" id="su" value="${H(j.cfg.site_url||'')}"></div></div><p><button class="bt s" id="cs">Salvar endereço</button> <small>Gera sitemap.xml e robots.txt automaticamente.</small></p></div>`+j.paginas.map((p,i)=>`<div class="card" data-f="${p.f}"><b>${H(p.f)}</b><label>Título (até 60 caracteres ideais)</label><input type="text" class="t" value="${H(p.title)}"><div class="cnt"></div><label>Descrição (até 155 ideais)</label><textarea class="d" rows="2">${H(p.description)}</textarea><div class="cnt"></div><div class="row"><div><label>Imagem de compartilhamento</label><input type="text" class="i" value="${H(p.og_image)}" placeholder="assets/photos/…"></div><button class="bt s pk" style="flex:0 0 auto">Biblioteca</button></div><p><button class="bt sv">Salvar</button></p></div>`).join('');
 const cnt=c=>{const i=c.previousElementSibling,n=c.nextElementSibling;};document.querySelectorAll('.card[data-f]').forEach(c=>{const up=()=>{[['.t',60],['.d',155]].forEach(([s,l])=>{const e=$(s,c),k=e.nextElementSibling;k.textContent=e.value.length+' / '+l;k.className='cnt'+(e.value.length>l?' x':'')})};c.oninput=up;up();
  $('.pk',c).onclick=()=>pick(p=>{$('.i',c).value=p});$('.sv',c).onclick=async()=>{const r=await api('seo_salvar',{f:c.dataset.f,title:$('.t',c).value,description:$('.d',c).value,og_image:$('.i',c).value});msg(r.ok?'SEO salvo.':r.erro,!r.ok)}});
 $('#cs').onclick=async()=>{const r=await api('cfg_salvar',{site_url:$('#su').value});msg(r.ok?'Salvo.':r.erro,!r.ok)}}
/* ===== Blog ===== */
async function vBlog(){const m=$('#m');const j=await G('posts');m.innerHTML=`<div class="row"><div><h2>Blog</h2><p class="sub">Artigos publicados aparecem em “Artigos” no mesmo visual do site.</p></div><button class="bt" id="nv" style="flex:0 0 auto">Novo artigo</button></div>`+(j.posts.length?j.posts.sort((a,b)=>b.data.localeCompare(a.data)).map(p=>`<div class="card row"><div style="flex:3"><b>${H(p.titulo)}</b><br><small>${p.data} · ${H(p.cat||'sem categoria')}</small></div><span class="pill ${p.pub?'on':''}" style="flex:0 0 auto">${p.pub?'Publicado':'Rascunho'}</span><button class="bt s ed" data-id="${p.id}" style="flex:0 0 auto">Editar</button></div>`).join(''):'<div class="card">Nenhum artigo criado pelo painel ainda. Os cards já existentes em “Artigos” são editáveis em Páginas → blog.html.</div>');
 $('#nv').onclick=()=>edPost({pub:false,data:new Date().toISOString().slice(0,10)});m.querySelectorAll('.ed').forEach(b=>b.onclick=()=>edPost(j.posts.find(p=>p.id===b.dataset.id)))}
function edPost(p){const m=$('#m');m.innerHTML=`<h2>${p.id?'Editar artigo':'Novo artigo'}</h2><div class="card"><label>Título</label><input type="text" id="bt" value="${H(p.titulo||'')}"><div class="row"><div><label>Endereço (slug)</label><input type="text" id="bs" value="${H(p.slug||'')}" placeholder="gerado do título"></div><div><label>Categoria</label><input type="text" id="bc" value="${H(p.cat||'')}" placeholder="Morar, Natureza, Projetos…"></div><div><label>Data</label><input type="date" id="bd" value="${H(p.data||'')}"></div></div><label>Resumo (aparece no card)</label><textarea id="br" rows="2">${H(p.resumo||'')}</textarea>
<label>Imagem de capa</label><div class="row"><input type="text" id="bi" value="${H(p.img||'')}"><input type="file" id="bf" accept="image/*"><button class="bt s" id="bl" style="flex:0 0 auto">Biblioteca</button></div>
<label>Texto — separe parágrafos com linha em branco · **negrito** · *itálico* · ## Subtítulo · [texto](link)</label><textarea id="bo" rows="16">${H(p.corpo||'')}</textarea>
<div class="row"><div><label>Autor</label><input type="text" id="ba" value="${H(p.autor||'')}" placeholder="Equipe Biosphere"></div><div><label>Min. de leitura</label><input type="text" id="bm" value="${H(p.min||'')}"></div></div><hr><b>SEO do artigo</b><label>Título SEO</label><input type="text" id="bz" value="${H(p.seo_title||'')}"><label>Descrição SEO</label><textarea id="bx" rows="2">${H(p.seo_desc||'')}</textarea><hr>
<label><input type="checkbox" id="bp" ${p.pub?'checked':''}> Publicado</label></div><div class="row"><button class="bt" id="bg" style="flex:0 0 auto">Salvar</button><button class="bt s" id="bv" style="flex:0 0 auto">Voltar</button>${p.id?'<button class="bt r" id="bx2" style="flex:0 0 auto;margin-left:auto">Excluir</button>':''}</div>`;
 $('#bf').onchange=async()=>{const fd=new FormData();fd.append('arq',$('#bf').files[0]);msg('Enviando…');const r=await api('upload',null,fd);if(r.ok){$('#bi').value=r.p;msg('Imagem enviada.')}else msg(r.erro,1)};$('#bl').onclick=()=>pick(x=>$('#bi').value=x);$('#bv').onclick=vBlog;
 $('#bg').onclick=async()=>{const r=await api('post_salvar',{id:p.id||'',titulo:$('#bt').value,slug:$('#bs').value,cat:$('#bc').value,data:$('#bd').value,resumo:$('#br').value,img:$('#bi').value,corpo:$('#bo').value,autor:$('#ba').value,min:$('#bm').value,seo_title:$('#bz').value,seo_desc:$('#bx').value,pub:$('#bp').checked});if(r.ok){msg('Salvo'+(r.slug?' · artigo-'+r.slug+'.html':''));p.id=r.id;vBlog()}else msg(r.erro,1)};
 const x=$('#bx2');if(x)x.onclick=async()=>{if(!confirm('Excluir este artigo?'))return;const r=await api('post_excluir',{id:p.id});if(r.ok){msg('Excluído.');vBlog()}else msg(r.erro,1)}}
/* ===== Mídia ===== */
async function vMid(){const m=$('#m');m.innerHTML='<h2>Mídia</h2><p class="sub">Envie imagens (reduzidas automaticamente) e vídeos. Depois use em Páginas ou Blog.</p><div class="card"><div class="row"><input type="file" id="mf" multiple accept="image/*,video/mp4,video/webm,video/quicktime"><label style="flex:0 0 auto;margin:0"><input type="checkbox" id="mp"> manter transparência (PNG)</label></div><div class="row" style="margin-top:10px"><input type="url" id="mu" placeholder="…ou cole um link de imagem (Google Drive, Dropbox, https)"><button class="bt s" id="mi" style="flex:0 0 auto">Importar</button></div></div><div class="grid" id="mg">Carregando…</div>';
 const lista=async()=>{const j=await G('midia');$('#mg').innerHTML=j.itens.map(x=>`<div data-p="${H(x.p)}">${x.v?`<video src="../${H(x.p)}" muted></video>`:`<img src="../${H(x.p)}" loading="lazy">`}${H(x.p)}</div>`).join('')};lista();
 $('#mg').onclick=e=>{const g=e.target.closest('[data-p]');if(g){navigator.clipboard&&navigator.clipboard.writeText(g.dataset.p);msg('Caminho copiado: '+g.dataset.p)}};
 $('#mf').onchange=async()=>{for(const f of $('#mf').files){const fd=new FormData();fd.append('arq',f);if($('#mp').checked)fd.append('png','1');msg('Enviando '+f.name+'…');const r=await api('upload',null,fd);if(!r.ok){msg(f.name+': '+r.erro,1);}}msg('Concluído.');lista()};
 $('#mi').onclick=async()=>{const r=await api('importar',{url:$('#mu').value});msg(r.ok?'Importada.':r.erro,!r.ok);if(r.ok)lista()}}
/* ===== Contatos / Conta ===== */
async function vLeads(){const j=await G('leads');$('#m').innerHTML='<h2>Contatos recebidos</h2><p class="sub">Mensagens enviadas pelos formulários do site (também vão por e-mail).</p>'+(j.itens.length?j.itens.map(l=>`<div class="card"><b>${H(l.nome)}</b> · ${H(l.email)} <span class="pill">${H(l.tipo)}</span> <small>${H(l.data)}</small><br><small>${Object.entries(l.dados||{}).filter(([k])=>!['tipo','nome','email'].includes(k)).map(([k,v])=>H(k.replace(/_/g,' '))+': '+H(v)).join(' · ')}</small></div>`).join(''):'<div class="card">Nenhum contato ainda.</div>')}
async function vConta(){const j=await G('seo_ler');$('#m').innerHTML=`<h2>Conta</h2><div class="card"><b>E-mail que recebe os contatos</b><div class="row"><input type="email" id="ce" value="${H(j.cfg.email_contato||'')}"><button class="bt" id="cb" style="flex:0 0 auto">Salvar</button></div></div><div class="card"><b>Trocar senha (${H(U)})</b><label>Senha atual</label><input type="password" id="sa"><label>Nova senha (10+ caracteres)</label><input type="password" id="sn"><p><button class="bt" id="sb">Trocar senha</button></p></div>`;
 $('#cb').onclick=async()=>{const r=await api('cfg_salvar',{email_contato:$('#ce').value});msg(r.ok?'Salvo.':r.erro,!r.ok)};$('#sb').onclick=async()=>{const r=await api('senha',{atual:$('#sa').value,nova:$('#sn').value});msg(r.ok?'Senha trocada.':r.erro,!r.ok);if(r.ok){$('#sa').value=$('#sn').value=''}}}
(async()=>{const j=await G('sessao');if(j.ok){U=j.usuario;shell()}else login()})();
window.onbeforeunload=()=>Object.keys(DIRTY).length?'x':undefined;
</script></body></html>
